}
function togglePublicSelect(){
  const libs = libraries.filter(l=>l.is_public);
  const allSelected = libs.length > 0 && libs.every(l=>selectedLibs.has(l.name));
  if(allSelected) libs.forEach(l=>selectedLibs.delete(l.name));
  else libs.forEach(l=>selectedLibs.add(l.name));
  renderLibList();
  renderLibChips();
}
// 剪掉没有任何库的空文件夹节点（登录用户视图中公共库已移入特殊分组，避免残留空壳）
function pruneEmptyFolders(node){
  node.children = node.children.filter(c=>{
    pruneEmptyFolders(c);
    return c.children.length > 0 || c.libs.length > 0;
  });
}
function renderLibList(){
  const el = document.getElementById('libList');
  document.getElementById('libCount').textContent = libraries.length;
  if(!libraries.length && !libraryFolders.length){
    el.innerHTML = '<div class="empty" style="padding:40px 10px"><div class="empty-text">暂无存储区</div></div>';
    return;
  }
  const hasPublic = libraries.some(l => l.is_public);
  let treeHtml = '';
  if(!currentUser.is_guest && hasPublic){
    // 登录用户：公共库收纳进可折叠的特殊文件夹（内部仍保留其文件夹层级，内容不可移动）
    const pubTree = buildLibTree({filter:l=>l.is_public, includeGlobalFolders:false});
    const pubCount = countLibsInFolder(pubTree);
    const pubCollapsed = collapsedFolders.has(PUBLIC_FOLDER_KEY);
    treeHtml += `<div class="folder-group ${pubCollapsed?'collapsed':''}" data-folder="${PUBLIC_FOLDER_KEY}" data-depth="0">`;
    treeHtml += publicFolderHeadHTML(pubCount);
    treeHtml += `<div class="folder-body">${renderLibTreeNodes(pubTree, 1, true)}</div></div>`;
    // 我的/他人的库正常渲染
    const myTree = buildLibTree({filter:l=>!l.is_public});
    pruneEmptyFolders(myTree);
    treeHtml += renderLibTreeNodes(myTree, 0, false);
  }else{
    // 游客（全部为公共库）或无公共库：按原树形渲染
    treeHtml += renderLibTreeNodes(buildLibTree(), 0, false);
  }
  let html = '';
  // 迁移提示条：登录用户且存在公共库时提示（公共库数据可一键复制到名下）
  if(!currentUser.is_guest && hasPublic){
    html += `<div class="lib-migrate-tip" style="display:block">公共库由<b>所有游客共同维护</b>。点公共库旁的 <b>⧉ 复制到我的库</b>，可把资料深拷贝一份到你名下（含向量索引，原库不受影响）。</div>`;
  }
  // 搜索框
  html += `<div class="lib-search-wrap"><input type="text" id="libSearchInput" placeholder="搜索库名…" oninput="filterLibTree()" value="${esc(libSearchQuery||'')}"></div>`;
  // 树形容器
  html += `<div class="lib-tree" id="libTree">`;
  html += treeHtml;
  // 根级放置区（拖拽库或文件夹到根级）
  if(libraryFolders.length > 0){
    html += `<div class="root-drop" data-folder=""></div>`;
  }
  html += `</div>`;
  el.innerHTML = html;
  // 高亮已选中
  selectedLibs.forEach(name=>{
    const it = el.querySelector(`.lib-item[data-name="${CSS.escape(name)}"]`);
    if(it) it.classList.add('active');
  });
  bindLibDragEvents(el);
  // 恢复搜索框过滤
  if(libSearchQuery) filterLibTree();
}

// 构建树形数据结构
// 节点结构：{type:'folder', path, name, children:[...], libs:[...]}
// opts.filter：只挂载满足条件的库；opts.includeGlobalFolders=false：不预先创建全局文件夹（公共子树按公共库自身路径生成）
function buildLibTree(opts){
  opts = opts || {};
  const root = {type:'folder', path:'', name:'', children:[], libs:[]};
  const folderMap = {'': root};
  // 确保路径存在（含中间路径）
  function ensureFolder(path){
    if(!path) return root;
    if(folderMap[path]) return folderMap[path];
    const parts = path.split('/');
    let curPath = '';
    let parent = root;
    for(const p of parts){
      curPath = curPath ? curPath+'/'+p : p;
      if(!folderMap[curPath]){
        const node = {type:'folder', path:curPath, name:p, children:[], libs:[]};
        folderMap[curPath] = node;
        parent.children.push(node);
      }
      parent = folderMap[curPath];
    }
    return folderMap[path];
  }
  // 先创建所有文件夹节点（含中间路径）
  if(opts.includeGlobalFolders !== false){
    for(const f of libraryFolders){ ensureFolder(f); }
  }
  // 把库挂到对应文件夹节点（同时确保其 folder 路径存在）
  for(const l of libraries){
    if(opts.filter && !opts.filter(l)) continue;
    const f = l.folder || '';
    const node = f ? ensureFolder(f) : root;
    node.libs.push(l);
  }
  return root;
}

// 递归渲染树节点
// 递归渲染树节点；locked=true 表示处于公共库特殊文件夹内部（子文件夹不可改名/删除/拖拽）
function renderLibTreeNodes(node, depth, locked){
  let html = '';
  // 渲染子文件夹（按名称排序，保持原有展示习惯）
  const children = node.children.slice().sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  for(const child of children){
    const key = locked ? PUBLIC_FOLDER_KEY + '/' + child.path : child.path;
    const collapsed = collapsedFolders.has(key);
    const directLibs = child.libs.length;
    const totalLibs = countLibsInFolder(child);
    html += `<div class="folder-group ${collapsed?'collapsed':''}" data-folder="${esc(key)}" data-depth="${depth}">`;
    html += folderHeadHTML(child.path, directLibs, totalLibs, depth, locked);
    html += `<div class="folder-body">`;
    html += renderLibTreeNodes(child, depth+1, locked);
    html += `</div></div>`;
  }
  // 渲染直接归属的库
  for(const l of node.libs){
    html += libItemHTML(l, depth);
  }
  return html;
}

// 递归计算文件夹下所有库的数量（含子文件夹）
function countLibsInFolder(node){
  let n = node.libs.length;
  for(const child of node.children) n += countLibsInFolder(child);
  return n;
}

// 获取文件夹下的所有库
function getLibsInFolder(folder, recursive){
  if(!folder){
    // 根级：folder 为空的库
    return libraries.filter(l=>!l.folder);
  }
  const prefix = folder + '/';
  if(recursive){
    return libraries.filter(l=>l.folder === folder || l.folder.startsWith(prefix));
  }
  return libraries.filter(l=>l.folder === folder);
}

// 切换文件夹全选/取消全选
function toggleFolderSelect(folder){
  const libs = getLibsInFolder(folder, true);
  const allSelected = libs.length > 0 && libs.every(l=>selectedLibs.has(l.name));
  if(allSelected){
    // 取消全选
    libs.forEach(l=>selectedLibs.delete(l.name));
  } else {
    // 全选
    libs.forEach(l=>selectedLibs.add(l.name));
  }
  renderLibList();
  renderLibChips();
}

// 搜索过滤：文件夹名匹配或后代库匹配时显示
function filterLibTree(){
  const input = document.getElementById('libSearchInput');
  libSearchQuery = (input?.value || '').trim().toLowerCase();
  const tree = document.getElementById('libTree');
  if(!tree) return;
  if(!libSearchQuery){
    // 清空搜索：恢复所有节点显示
    tree.querySelectorAll('.folder-group, .lib-item, .folder-body').forEach(el=>{
      el.style.display = '';
    });
    return;
  }
  // 递归过滤：容器内的直接子项
  function filterContainer(container){
    let anyMatch = false;
    for(const libEl of container.querySelectorAll(':scope > .lib-item')){
      const name = (libEl.dataset.name||'').toLowerCase();
      const note = (libEl.querySelector('.lib-note')?.textContent||'').toLowerCase();
      const match = name.includes(libSearchQuery) || note.includes(libSearchQuery);
      libEl.style.display = match ? '' : 'none';
      if(match) anyMatch = true;
    }
    for(const folderEl of container.querySelectorAll(':scope > .folder-group')){
      const fp = folderEl.dataset.folder || '';
      const folderMatch = fp.toLowerCase().includes(libSearchQuery);
      const body = folderEl.querySelector(':scope > .folder-body');
      const childAny = body ? filterContainer(body) : false;
      const show = folderMatch || childAny;
      folderEl.style.display = show ? '' : 'none';
      if(body) body.style.display = show ? 'block' : 'none';
      if(show) anyMatch = true;
    }
    return anyMatch;
  }
  filterContainer(tree);
}
function toggleFolder(name){
  if(collapsedFolders.has(name)) collapsedFolders.delete(name);
  else collapsedFolders.add(name);
  renderLibList();
}
// ============ 库/文件夹拖拽 ============
let draggingLibName = null;      // 正在拖拽的库名
let draggingFolderPath = null;   // 正在拖拽的文件夹路径
function bindLibDragEvents(container){
  // 库拖拽（公共库在登录用户视图中不可移动）
  container.querySelectorAll('.lib-item').forEach(it=>{
    const lib = libraries.find(l=>l.name===it.dataset.name);
    if(lib && lib.is_public && !currentUser.is_guest) return;
    it.addEventListener('dragstart', e=>{
      draggingLibName = it.dataset.name;
      draggingFolderPath = null;
      it.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggingLibName);
    });
    it.addEventListener('dragend', ()=>{
      it.classList.remove('dragging');
      draggingLibName = null;
      draggingFolderPath = null;
      document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
    });
  });
  // 文件夹拖拽（文件夹头既是拖拽源也是放置区）
  container.querySelectorAll('.folder-head').forEach(h=>{
    // 公共库特殊文件夹及其内部子文件夹不可移动
    if(h.dataset.locked) return;
    // 作为拖拽源
    h.addEventListener('dragstart', e=>{
      // 避免点击折叠按钮时触发拖拽
      draggingFolderPath = h.dataset.folder;
      draggingLibName = null;
      h.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', 'folder:'+draggingFolderPath);
    });
    h.addEventListener('dragend', ()=>{
      h.classList.remove('dragging');
      draggingLibName = null;
      draggingFolderPath = null;
      document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
    });
    // 作为放置区（接收库或文件夹）
    h.addEventListener('dragover', e=>{
      if(!draggingLibName && !draggingFolderPath) return;
      // 不能把文件夹放到自身下
      if(draggingFolderPath && (draggingFolderPath === h.dataset.folder || h.dataset.folder.startsWith(draggingFolderPath + '/'))){
        return;
      }
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      h.classList.add('drop-target');
    });
    h.addEventListener('dragleave', e=>{
      h.classList.remove('drop-target');
    });
    h.addEventListener('drop', e=>{
      e.preventDefault();
      e.stopPropagation();
      h.classList.remove('drop-target');
      const targetFolder = h.dataset.folder;
      if(draggingLibName){
        moveLibraryToFolder(draggingLibName, targetFolder);
      } else if(draggingFolderPath){
        moveFolderToFolder(draggingFolderPath, targetFolder);
      }
    });
  });
  // 根级放置区
  container.querySelectorAll('.root-drop').forEach(d=>{
    d.addEventListener('dragover', e=>{
      if(!draggingLibName && !draggingFolderPath) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      d.classList.add('drop-target');
    });
    d.addEventListener('dragleave', e=>{ d.classList.remove('drop-target'); });
    d.addEventListener('drop', e=>{
      e.preventDefault();
      d.classList.remove('drop-target');
      if(draggingLibName){
        moveLibraryToFolder(draggingLibName, '');
      } else if(draggingFolderPath){
        moveFolderToFolder(draggingFolderPath, '');
      }
    });
  });
}
async function moveFolderToFolder(oldPath, newParent){
  if(!oldPath) return;
  // 计算新路径，同位置不变
  const last = oldPath.split('/').pop();
  const newPath = newParent ? (newParent + '/' + last) : last;
  if(oldPath === newPath) return;
  // 环检测
  if(newParent === oldPath || newParent.startsWith(oldPath + '/')){
    toast('不能把文件夹移动到自身或其子文件夹下','error');
    return;
  }
  try{
    await api('POST','/api/folders', null, {action:'move_folder', old:oldPath, new_parent:newParent});
    toast(newParent ? `已将「${oldPath}」移到「${newParent}」下` : `已将「${oldPath}」移到根级`, 'success');
    // 同步折叠状态
    if(collapsedFolders.has(oldPath)){
      collapsedFolders.delete(oldPath);
      collapsedFolders.add(newPath);
    }
    loadLibraries();
  }catch(e){ toast(e.message,'error'); }
}
async function moveLibraryToFolder(libName, folder){
  const lib = libraries.find(l=>l.name===libName);
  if(!lib) return;
  if(lib.is_public && !currentUser.is_guest){ toast('公共库内容不可移动，可先「⧉ 复制到我的库」后再整理','error'); return; }
  if((lib.folder||'') === folder) return; // 同位置不变
  try{
    await api('POST', '/api/libraries/'+encodeURIComponent(libName)+'/move', null, {folder});
    toast(folder ? `已移到「${folder}」` : '已移到根级', 'success');
    loadLibraries();
  }catch(e){ toast(e.message,'error'); }
}
function toggleLibSelect(name){
  if(name === '__all__'){
    if(selectedLibs.size === 0){
      // 当前是全部，不操作（保持空=全部）
    } else {
      selectedLibs.clear();
    }
  } else if(name.startsWith('__folder__:')){
    const folder = decodeURIComponent(name.substring('__folder__:'.length));
    const libs = getLibsInFolder(folder, true);
    const allSel = libs.length>0 && libs.every(l=>selectedLibs.has(l.name));
    if(allSel) libs.forEach(l=>selectedLibs.delete(l.name));
    else libs.forEach(l=>selectedLibs.add(l.name));
  } else {
    if(selectedLibs.has(name)) selectedLibs.delete(name);
    else selectedLibs.add(name);
  }
  renderLibList();
  renderLibChips();
}
function renderLibChips(){
  const el = document.getElementById('libChips');
  if(!el) return;
  el.innerHTML = buildGroupedLibChips(selectedLibs, 'toggleLibSelect');
}
function buildGroupedLibChips(selectedSet, toggleFn){
  if(!libraries.length){ return '<span class="hint">无可用库</span>'; }
  const allActive = selectedSet.size === 0;
  const parts = [];
  // 全部按钮
  parts.push(`<span class="chip ${allActive?'active':''}" onclick="${toggleFn}('__all__')">全部</span>`);
  // 按文件夹分组渲染（支持嵌套路径）
  const tree = buildLibTree();
  // 递归渲染文件夹 chip
  function renderFolderChips(node, depth){
    for(const child of node.children){
      const libs = getLibsInFolder(child.path, true);
      const allSel = libs.length>0 && libs.every(l=>selectedSet.has(l.name));
      const someSel = libs.some(l=>selectedSet.has(l.name));
      const cls = allSel ? 'active' : (someSel ? 'partial' : '');
      const display = child.path.split('/').pop();
      const indent = '　'.repeat(depth); // 全角空格缩进
      const encPath = encodeURIComponent(child.path);
      parts.push(`<span class="chip chip-folder ${cls}" onclick="${toggleFn}('__folder__:${encPath}')" title="${esc(child.path)}">${indent}📁 ${esc(display)} (${libs.length})</span>`);
      renderFolderChips(child, depth+1);
    }
  }
  renderFolderChips(tree, 0);
  // 根级库（无文件夹归属）
  const rootLibs = tree.libs;
  if(rootLibs.length){
    parts.push('<span class="chip-sep"></span>');
    for(const l of rootLibs){
      const active = allActive || selectedSet.has(l.name);
      parts.push(`<span class="chip ${active?'active':''}" onclick="${toggleFn}('${esc(l.name)}')">${esc(l.name)}</span>`);
    }
  }
  // 各文件夹下直接归属的库（不递归）
  function renderLibChips(node){
    for(const child of node.children){
      const directLibs = child.libs;
      if(directLibs.length){
        parts.push('<span class="chip-sep"></span>');
        const display = child.path.split('/').pop();
        parts.push(`<span class="chip-group-label">${esc(display)}</span>`);
        for(const l of directLibs){
          const active = allActive || selectedSet.has(l.name);
          parts.push(`<span class="chip ${active?'active':''}" onclick="${toggleFn}('${esc(l.name)}')">${esc(l.name)}</span>`);
        }
      }
      renderLibChips(child);
    }
  }
  renderLibChips(tree);
  let html = parts.join(' ');
  if(allActive) html += '<span class="hint" style="align-self:center">（默认查全部）</span>';
  return html;
}

});

// AI 面板 DOM 缓存：切页时把 ai 面板移到隐藏容器，切回时恢复
// 这样流式渲染的 DOM 更新不会因切页而中断
let _aiPanelCached = null;  // 缓存的 ai 面板子节点数组

function renderTab(){
  const c = document.getElementById('content');

  // 切走 ai 标签时：把当前 ai 面板的所有子节点移到缓存，而非销毁
  // 这样流式渲染中的 DOM 更新（如 #chat-answer）仍然有效
  if(activeTab !== 'ai' && _aiPanelCached === null){
    // 检查当前 content 里是否有 ai 面板特征（如 chatMsgs 元素）
    if(c.querySelector('#chatMsgs') || c.querySelector('#chatSendBtn')){
      let cache = document.getElementById('_aiPanelCache');
      if(!cache){
        cache = document.createElement('div');
        cache.id = '_aiPanelCache';
        cache.style.display = 'none';
        document.body.appendChild(cache);
      }
      // 把 content 的所有子节点移到缓存
      _aiPanelCached = [];
      while(c.firstChild){
        _aiPanelCached.push(c.firstChild);
        cache.appendChild(c.firstChild);
      }
    }
  }

  if(activeTab==='search') c.innerHTML = searchHTML();
  else if(activeTab==='ai'){
    // 切回 ai 标签：若有缓存的 DOM，恢复它；否则新建
    if(_aiPanelCached){
      c.innerHTML = '';  // 清空当前内容
      // 把缓存的子节点移回 content
      for(const node of _aiPanelCached){
        c.appendChild(node);
      }
      _aiPanelCached = null;  // 清除缓存引用
    } else {
      c.innerHTML = aiSearchHTML();
    }
  }
  else if(activeTab==='stats') c.innerHTML = statsHTML();
  else if(activeTab==='import') c.innerHTML = importHTML();
  else if(activeTab==='files') c.innerHTML = filesHTML();
  else if(activeTab==='verify') c.innerHTML = verifyHTML();
  else if(activeTab==='inquiries') c.innerHTML = inquiriesHTML();
  else if(activeTab==='users'){
    c.innerHTML = usersHTML();
    loadUsersPage();
  }
  else if(activeTab==='help') c.innerHTML = helpHTML();
  else if(activeTab==='settings') c.innerHTML = settingsHTML();
  if(activeTab==='search') renderLibChips();
  if(activeTab==='ai'){
    // 首次渲染（非缓存恢复）时才需要初始化
    // 通过检查是否有 chatMsgs 元素来判断是否是缓存恢复
    const isRestored = !!document.getElementById('chatMsgs');
    if(!isRestored){
      renderAiLibChips();
      refreshTopkSuggestion();
      renderContextBar();
      if(currentChatSession && currentChatSession.id){
        loadChatSessions().then(()=>{
          if(currentChatSession && currentChatSession.messages){
            renderChatMessages();
          }
        });
      } else {
        loadChatSessions();
      }
    } else {
      // 缓存恢复：只刷新侧栏数据（标题/消息数）
      // 缓存 DOM 已由事件流（content_update / refs_update / done）更新为最终结果
      // 不调用 renderChatMessages，避免后端持久化未完成时拉到空 content 导致答案消失
      loadChatSessions();
      // 面板缓存期间可能在检索页新增/删除了上下文，恢复后按全局状态重渲染上下文栏
      renderContextBar();
    }
    // 若流式仍在进行，确保"停止"按钮状态正确
    if(chatStreaming){
      const btn = document.getElementById('chatSendBtn');
      if(btn){
        btn.textContent = '停止';
        btn.classList.add('stop');
        btn.onclick = () => { userCancelled = true; try{ if(currentChatReader) currentChatReader.cancel(); }catch(e){} };
      }
    }
  }
  if(activeTab==='import') renderImportLibOptions();
  if(activeTab==='import') resumeImportIfNeeded();  // 检测是否有进行中的导入批次
  if(activeTab==='verify') loadVerify();
  if(activeTab==='stats') loadStats();
  if(activeTab==='files') loadFilesTab();
  if(activeTab==='inquiries') loadInquiries();
  if(activeTab==='settings') loadSettings();
  // 切到任何含库列表的页面时，刷新向量索引状态
  // 避免切页后"查询中…"占位文本一直不更新
  if(['search','files','stats','import','verify'].includes(activeTab)){
    loadSemanticStatus();
  }
}

let lastQuery = '';
// 解析查询字符串，支持四种语法：
//   1. 空格分隔的多词 = 关键词 AND（每词一组，字面匹配）
//   2. (A，B) 圆括号 = 关键词同义词组（组内 OR，字面匹配）
//   3. [A，B] 方括号 = 语义同义词组（组内 OR，向量召回）
//   4. {A，B} 花括号 = 标题限定组（标题/文件名含组内任一词才保留）
//   可混合：刘备 (死，崩) {蜀书} = 关键词"刘备" AND 关键词同义"死/崩" AND 标题含"蜀书"
// 组内分隔符：中英文逗号、顿号、竖线；引号内为原子词项（("5,40"，"1.5万") 不被逗号切开）
// 返回结构：{ keyword_groups: [[...],...], semantic_groups: [[...],...], title_groups: [[...],...] }
//   - 无任何括号且多词：keyword_groups = 每词一组，其余为空
//   - 单词无括号：返回 null（走普通单关键词检索）
//   - 含 []：semantic_groups 至少一组，触发语义检索
//   - 含 {}：title_groups 至少一组，触发标题过滤/标题检索
const GROUP_SEPS = new Set(['，', ',', '、', '|']);
const QUOTE_PAIRS = {'"': '"', "'": "'", '“': '”', '『': '』', '「': '」'};
// 展示用：剥掉引号原子词项的外层引号
function stripTermQuotes(s){
  return String(s).replace(/^["'“『「]/, '').replace(/["'”』」]$/, '');
}
function splitGroupTerms(content){
  // 引号原子：词项保留引号传给后端（索引层把引号段作为整段精确短语匹配）
  const terms = [];
  let buf = '';
  let openQ = '';
  let closeQuote = null;
  for(const ch of content){
    if(closeQuote !== null){
      if(ch === closeQuote){
        // 引号闭合：词项到此为止，紧随其后的内容另起一词项
        const t = buf.trim();
        if(t) terms.push(openQ + t + QUOTE_PAIRS[openQ]);
        buf = '';
        openQ = '';
        closeQuote = null;
      }else{
        buf += ch;
      }
    }else if(QUOTE_PAIRS[ch] !== undefined){
      if(!openQ && !buf) openQ = ch;
      closeQuote = QUOTE_PAIRS[ch];
    }else if(GROUP_SEPS.has(ch)){
      const t = buf.trim();
      if(t) terms.push(openQ ? openQ + t + QUOTE_PAIRS[openQ] : t);
      buf = '';
      openQ = '';
    }else{
      buf += ch;
    }
  }
  const t = buf.trim();
  if(t) terms.push(openQ ? openQ + t + QUOTE_PAIRS[openQ] : t);
  return terms;
}
function parseQueryGroups(q){
  q = (q||'').trim();
  if (!q) return null;
  // 同时检测圆括号 () （）、方括号 [] 【】、花括号 {} ｛｝
  const hasParen = /[（(\[【{｛]/.test(q);
  const hasSpace = /\s/.test(q);
  if (!hasParen && !hasSpace) return null;  // 单词 = 普通检索

  const keyword_groups = [];
  const semantic_groups = [];
  const title_groups = [];

  if (!hasParen) {
    // 无括号但有空格：每个词一组关键词
    const words = q.split(/\s+/).filter(w => w);
    return words.length >= 2
      ? { keyword_groups: words.map(w => [w]), semantic_groups: [], title_groups: [] }
      : null;
  }

  // 同时解析 () [] 【】 {} ｛｝，按出现顺序处理括号外的独立词
  // 圆括号（中英文）= 关键词同义词组；方括号（中英文）= 语义同义词组；花括号（中英文）= 标题限定组
  const re = /[（(]([^）)]*)[）)]|\[([^\]]*)\]|【([^】]*)】|\{([^{}]*)\}|｛([^｛｝]*)｝/g;
  let m;
  let lastIdx = 0;
  while ((m = re.exec(q)) !== null) {
    // 括号前的独立词（按空格切分，每个词一组关键词）
    const before = q.substring(lastIdx, m.index).trim();
    if (before) {
      for (const w of before.split(/\s+/).filter(x => x)) keyword_groups.push([w]);
    }
    // m[1] = 圆括号内容（关键词同义词）
    // m[2]/m[3] = 方括号内容（语义同义词）
    // m[4]/m[5] = 花括号内容（标题限定）
    if (m[1] != null) {
      const syns = splitGroupTerms(m[1]);
      if (syns.length) keyword_groups.push(syns);
    } else if (m[2] != null || m[3] != null) {
      const content = m[2] != null ? m[2] : m[3];
      const syns = splitGroupTerms(content);
      if (syns.length) semantic_groups.push(syns);
    } else if (m[4] != null || m[5] != null) {
      const content = m[4] != null ? m[4] : m[5];
      const words = splitGroupTerms(content);
      if (words.length) title_groups.push(words);
    }
    lastIdx = re.lastIndex;
  }
  const after = q.substring(lastIdx).trim();
  if (after) {
    for (const w of after.split(/\s+/).filter(x => x)) keyword_groups.push([w]);
  }

  if (!keyword_groups.length && !semantic_groups.length && !title_groups.length) return null;
  return { keyword_groups, semantic_groups, title_groups };
}

async function doSearch(){
  const q = document.getElementById('searchInput').value.trim();
  if(!q){ toast('请输入关键词','error'); return; }
  lastQuery = q;
  const parallel = document.getElementById('parallelInput').value || 4;
  const top = document.getElementById('topInput').value || 20;
  const chunkLevel = document.getElementById('chunkLevelSelect').value || 'child';
  const libs = selectedLibs.size ? Array.from(selectedLibs).join(',') : undefined;
  const out = document.getElementById('searchOutput');
  out.innerHTML = '<div class="loading-overlay"><span class="loader"></span> 正在检索...</div>';
  try{
    const parsed = parseQueryGroups(q);
    let d;
    if (parsed && (parsed.keyword_groups.length || parsed.semantic_groups.length || parsed.title_groups.length)) {
      // 结构化查询：传 keyword_groups / semantic_groups / title_groups
      // 后端根据是否含 semantic_groups 决定是否触发语义检索；
      // title_groups（{} 语法）作为标题过滤条件，单独使用时触发标题检索
      // chunk_level 控制检索粒度（child=子片段级，parent=父chunk级）
      d = await api('GET','/api/search', {
        keyword_groups: JSON.stringify(parsed.keyword_groups),
        semantic_groups: JSON.stringify(parsed.semantic_groups),
        title_groups: JSON.stringify(parsed.title_groups),
        chunk_level: chunkLevel,
        libraries:libs, parallel, top
      });
    } else {
      // 单关键词普通检索（纯字面匹配，不融合语义）
      d = await api('GET','/api/search', {query:q, libraries:libs, parallel, top});
    }
    lastResults = d;
    renderSearchResults(d);
  }catch(e){
    console.error('[搜索] 错误:', e);
    out.innerHTML = `<div class="empty"><div class="empty-text">${esc(e.message)}</div></div>`;
  }
}

function renderSearchResults(d){
  const out = document.getElementById('searchOutput');
  // 语义通道不可用时的提示
  if(d.semantic_available === false){
    const reason = d.semantic_reason || '语义检索通道不可用';
    out.innerHTML = `<div class="empty">
      <div class="empty-icon">⚠</div>
      <div class="empty-text" style="color:var(--crimson)">${esc(reason)}</div>
      <div style="margin-top:8px;font-size:12px;color:var(--muted)">请确认语义检索通道已开启且索引已就绪（设置页可查看状态）</div>
    </div>`;
    return;
  }
  if(!d.total_hits){
    out.innerHTML = '<div class="empty"><div class="empty-icon">⊘</div><div class="empty-text">未找到匹配内容</div></div>';
    return;
  }
  const isRelated = d.mode === 'related' || d.mode === 'related_single';
  // isSemantic 覆盖所有含语义召回的模式：纯语义按钮、[] 语义组、关键词 AND 语义
  const isSemantic = d.mode === 'semantic' || d.mode === 'semantic_groups' || d.mode === 'keyword_and_semantic';
  const hasSemanticGroups = d.mode === 'semantic_groups' || d.mode === 'keyword_and_semantic';
  // 统计每个词在所有结果中的总命中次数，用于颜色分配
  // 关联词模式下从 group_hits.hit_count 累计，普通模式从 hit_count 估算
  const wordHitCounts = {};
  if(isRelated){
    for(const r of d.results){
      if(r.group_hits){
        for(const gh of r.group_hits){
          for(const s of (gh.hit_synonyms||[])){
            wordHitCounts[s] = (wordHitCounts[s]||0) + (gh.hit_count||0);
          }
        }
      }
    }
  }else if(!isSemantic){
    for(const r of d.results){
      for(const w of (r.matched_words||[])){
        wordHitCounts[w] = (wordHitCounts[w]||0) + (r.hit_count||1);
      }
    }
  }
  // 构造颜色映射（所有结果共享同一套颜色分配，保证视觉一致）
  const allWords = Object.keys(wordHitCounts);
  const colorMap = allWords.length ? buildWordColorMap(allWords, wordHitCounts) : null;
  // 缓存到全局，供 toggleChunkText 展开 fulltext 时复用
  lastColorMap = colorMap;
  let h = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  h += '<div class="search-stats" style="flex:1;margin-bottom:0">';
  h += `<div class="stat-item"><div class="stat-num">${fmt(d.total_hits)}</div><div class="stat-label">${isRelated?'关联命中':(isSemantic?'语义召回':'命中总数')}</div></div>`;
  h += `<div class="stat-item"><div class="stat-num">${d.parallel}</div><div class="stat-label">并行度</div></div>`;
  for(const l of d.searched_libraries){
    // 同时展示关键词命中数和语义召回数（语义召回>0 时额外标注）
    const semHits = l.semantic_hits || 0;
    const kwHits = l.hits || 0;
    const numHtml = (semHits > 0 && !isSemantic)
      ? `${fmt(kwHits)}<span style="font-size:11px;color:var(--gold-2);margin-left:4px">+${fmt(semHits)}语义</span>`
      : `${fmt(kwHits)}`;
    h += `<div class="stat-item"><div class="stat-num">${numHtml}</div><div class="stat-label">${esc(l.name)} (${l.elapsed_ms||0}ms)</div></div>`;
  }
  h += '</div><div><button class="btn-export" onclick="exportSearchJSON()">⬇ 导出 JSON</button> <button class="btn-export" onclick="exportSearchTXT()">⬇ 导出 TXT</button> <button class="btn-export" onclick="exportSearchMiniChunks()">⬇ 导出段</button></div></div>';
  // 关联词模式：顶部显示查询解析结果
  if(isRelated && d.groups){
    h += `<div class="search-related-info" style="background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--ink-2)">
      <span style="color:var(--gold-2);font-weight:600">关联词检索</span> · 共 ${d.groups.length} 组：`;
    h += d.groups.map((g,i)=>{
      // 兼容两种 groups 格式：
      //   1. 数组格式 ["刘备","先主"]（前端 parseQueryGroups 生成）
      //   2. dict 格式 {words:["刘备","先主"], required:true, label:"..."}（后端标准化后返回）
      const words = Array.isArray(g) ? g : (g.words || []);
      const label = !Array.isArray(g) && g.label ? ` · ${esc(g.label)}` : '';
      const reqTag = !Array.isArray(g) && g.required ? ' <span style="color:var(--crimson);font-size:10px">必选</span>' : '';
      return `<span style="margin:0 6px">[组${i+1}]${reqTag}${label} ${words.map(s=>{
        // 顶部组展示：命中数高的词用对应颜色，否则用默认灰（显示时剥引号）
        if(colorMap && colorMap[s]){
          const c = colorMap[s];
          return `<span class="word-tag" style="margin:0 2px;background:${c.bg};color:${c.fg};border:1px solid ${c.fg}">${esc(stripTermQuotes(s))}</span>`;
        }
        return `<span class="word-tag" style="margin:0 2px">${esc(stripTermQuotes(s))}</span>`;
      }).join('')}</span>`;
    }).join(' ∩ ');
    h += `</div>`;
  }
  // 标题限定（{} 语法）：顶部显示标题组信息
  const isTitleMode = d.mode === 'title';
  if(isTitleMode || (d.title_groups && d.title_groups.length)){
    const tg = d.title_groups || [];
    const tagHtml = tg.map(g=>`<span class="word-tag" style="margin:0 2px;background:var(--paper);border:1px dashed var(--gold-2);color:var(--gold-2)">${g.map(esc).join('|')}</span>`).join(' ∩ ');
    h += `<div class="search-related-info" style="background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--ink-2)">
      <span style="color:var(--gold-2);font-weight:600">${isTitleMode?'标题检索':'标题限定'}</span> · ${isTitleMode?'标题/文件名命中以下词组：':'仅保留标题/文件名含以下词组的结果：'}${tagHtml}
    </div>`;
  }
  // 语义检索模式：顶部显示提示
  if(isSemantic){
    const minScore = d.semantic_min_score != null ? d.semantic_min_score : '';
    // 含 [] 语义同义词组：展示组信息
    if(hasSemanticGroups && d.semantic_groups){
      h += `<div class="search-related-info" style="background:var(--gold-soft);border:1px solid var(--gold-2);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--ink-2)">
        <span style="color:var(--gold-2);font-weight:600">${d.mode==='keyword_and_semantic'?'关键词 ∧ 语义':'语义同义词组'}</span> · 共 ${d.semantic_groups.length} 组语义同义词：`;
      h += d.semantic_groups.map((g,i)=>{
        return `<span style="margin:0 6px">[组${i+1}] ${g.map(s=>`<span class="word-tag" style="margin:0 2px;background:var(--gold-soft);color:var(--gold-2);border:1px solid var(--gold-2)">${esc(s)}</span>`).join('')}</span>`;
      }).join(d.mode==='keyword_and_semantic' ? ' ∧ ' : ' ∩ ');
      if(d.keyword_groups && d.keyword_groups.length){
        h += ` · 关键词组：${d.keyword_groups.map(g=>g.join('|')).join(' ∩ ')}`;
      }
      h += (minScore!==''?` · 最低相似度 ${minScore}`:'');
      h += `</div>`;
    }else{
      h += `<div class="search-related-info" style="background:var(--gold-soft);border:1px solid var(--gold-2);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--ink-2)">
        <span style="color:var(--gold-2);font-weight:600">语义检索</span> · 纯向量近邻召回${minScore!==''?` · 最低相似度 ${minScore}`:''} · 无关键词匹配信息`;
      h += `</div>`;
    }
  }
  h += '<div class="results">';
  for(const r of d.results){
    const fp = r.source_file_path || '';
    const dispFile = r.heading ? `${esc(r.source_file||'?')} · ${esc(r.heading)}` : esc(r.source_file||'?');
    // 关联词模式：显示组命中详情；普通模式：仅显示 matched_words
    let wordsHtml;
    if(isRelated && r.group_hits){
      // 按组渲染：组内同义词按命中状态着色（命中用对应颜色，未命中半透明灰）
      wordsHtml = r.group_hits.map(gh=>{
        const hitSet = new Set(gh.hit_synonyms||[]);
        const inner = gh.synonyms.map(s=>{
          const hit = hitSet.has(s);
          if(hit && colorMap && colorMap[s]){
            const c = colorMap[s];
            return `<span class="word-tag" style="background:${c.bg};color:${c.fg};font-weight:600;border:1px solid ${c.fg}">${esc(stripTermQuotes(s))} ✓</span>`;
          }
          return `<span class="word-tag" style="opacity:0.45">${esc(stripTermQuotes(s))}</span>`;
        }).join('');
        return `<span style="display:inline-block;margin:2px 8px 2px 0;padding:2px 6px;background:var(--paper);border:1px dashed var(--line);border-radius:4px"><span style="color:var(--muted);font-size:10px">组${gh.group_index+1}</span> ${inner}${gh.hit_count>0?` <span style="color:var(--jade);font-size:10px">×${gh.hit_count}</span>`:'<span style="color:var(--crimson);font-size:10px">未命中</span>'}</span>`;
      }).join('');
    }else if(isSemantic){
      // 语义检索：展示相似度分数（0~1，越高越相关）
      const sc = r.semantic_score != null ? Number(r.semantic_score).toFixed(3) : '?';
      wordsHtml = `<span class="word-tag" style="background:var(--gold-soft);color:var(--gold-2);font-weight:600">相似度 ${sc}</span>`;
    }else{
      // 普通模式：每个词用对应颜色（若有 colorMap）
      if(r.matched_words && r.matched_words.length){
        wordsHtml = r.matched_words.map(w=>{
          if(colorMap && colorMap[w]){
            const c = colorMap[w];
            return `<span class="word-tag" style="background:${c.bg};color:${c.fg};border:1px solid ${c.fg}">${esc(w)}</span>`;
          }
          return `<span class="word-tag">${esc(w)}</span>`;
        }).join('');
      }else if(r.semantic_score != null){
        // 无关键词命中但被语义召回（双通道融合时的纯语义结果）
        const sc = Number(r.semantic_score).toFixed(3);
        wordsHtml = `<span class="word-tag" style="background:var(--gold-soft);color:var(--gold-2);font-weight:600">语义召回 · 相似度 ${sc}</span>`;
      }else{
        wordsHtml = '';
      }
    }
    // 关联词模式额外显示评分细节
    let metaExtra = '';
    if(isRelated && r.cooccur_groups != null){
      metaExtra = ` · 共现 ${r.cooccur_groups}/${d.groups.length} 组 · 关联分 ${fmt(r.related_score||0)}`;
    }
    // 大段模式（无 sub_text）：在元数据中标注总字数
    if(isSemantic && !r.sub_text && r.text_length){
      metaExtra += ` · 共 ${fmt(r.text_length)} 字`;
    }
    h += `<div class="result" id="res-${r.chunk_id.replace(/\//g,'_')}">
      <div class="result-head">
        <div>
          <span class="result-lib">${esc(r.library)}</span>
          <span class="result-file">${dispFile}</span>
        </div>
        <div class="result-meta">${r.chunk_id} · 偏移 ${fmt(r.text_offset)}${metaExtra}</div>
      </div>
      ${renderChunkMetadata(r.metadata)}
      <div class="result-words">${wordsHtml}</div>
      ${r.snippet?`<div class="result-snippet">${highlight(r.snippet, r.matched_words||[], colorMap)}</div>`:''}
      ${isSemantic && r.sub_text?`<div class="result-subtext" style="margin-top:6px;padding:6px 10px;background:var(--paper-2);border-left:3px solid var(--gold-2);border-radius:3px;font-size:12px;color:var(--ink-2);line-height:1.6"><div style="color:var(--gold-2);font-weight:600;font-size:11px;margin-bottom:3px">向量命中片段 ${esc(r.sub_id||'')}</div><span style="text-decoration:underline;text-decoration-color:var(--gold-2);text-decoration-thickness:1.5px;text-underline-offset:3px">${esc(r.sub_text)}</span></div>`:''}
      <div class="result-actions">
        <button class="btn-trace" onclick="toggleChunkText('${esc(r.library)}','${esc(r.chunk_id)}',this,${esc(JSON.stringify(r.matched_words||[]))},${esc(JSON.stringify(r.sub_text||''))})">展开原文</button>
        <button class="btn-trace" onclick="addToContext('${esc(r.library)}','${esc(r.chunk_id)}',${esc(JSON.stringify(r.heading||''))},${esc(JSON.stringify(fp||''))},this,${esc(JSON.stringify(r.matched_words||[]))})">加到上下文</button>
        ${fp?`<button class="btn-trace" onclick="openDoc('${encodeURIComponent(fp)}','${encodeURIComponent(r.library)}')">下载文档</button>`:''}
        ${fp?`<button class="btn-trace" onclick="copyChunkSnippet('${esc(r.library)}','${esc(r.chunk_id)}',this)">复制片段</button>`:''}
      </div>
      <div class="chunk-fulltext" style="display:none"></div>
    </div>`;
  }
  h += '</div>';
  out.innerHTML = h;
}

function downloadJSON(data, filename){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function exportSearchJSON(){
  if(!lastResults){ toast('无搜索结果','error'); return; }
  const ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  downloadJSON(lastResults, `search_${ts}.json`);
  toast('已导出搜索结果','success');
}
function downloadText(text, filename, mime){
  const blob = new Blob([text], {type: mime || 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// 导出段：对每个命中大段，按命中词位置切出 ±200 字的小片段
// 适合精准溯源，导出文件小、聚焦命中上下文
async function exportSearchMiniChunks(){
  if(!lastResults){ toast('无搜索结果','error'); return; }
  const d = lastResults;
  if(!d.results || !d.results.length){ toast('无命中结果','error'); return; }
  const WINDOW = 200;  // 命中位置前后各 200 字
  const lines = [];
  lines.push('# 检索结果（段模式）');
  lines.push(`查询词: ${d.query}`);
  lines.push(`命中总数: ${d.total_hits} 大段`);
  lines.push(`导出时间: ${new Date().toLocaleString('zh-CN')}`);
  lines.push(`窗口: 命中位置 ±${WINDOW} 字`);
  lines.push('');
  toast(`正在加载 ${d.results.length} 条大段原文...`,'info');
  let exported = 0, failed = 0;
  for(let i=0; i<d.results.length; i++){
    const r = d.results[i];
    let chunkData = null;
    try{
      chunkData = await fetchChunkText(r.library, r.chunk_id);
    }catch(e){}
    if(!chunkData || !chunkData.text){ failed++; continue; }
    const text = chunkData.text || '';
    const words = r.matched_words || [];
    // 找所有命中词在原文中的位置
    const positions = [];
    for(const w of words){
      let idx = 0;
      while((idx = text.indexOf(w, idx)) >= 0){
        positions.push(idx);
        idx += w.length;
      }
    }
    positions.sort((a,b)=>a-b);
    lines.push('');
    lines.push(`[${i+1}] [${r.library}] ${r.chunk_id}`);
    lines.push(`  源文件: ${r.source_file}${r.heading?' · '+r.heading:''}`);
    if(r.source_file_path) lines.push(`  路径: ${r.source_file_path}`);
    lines.push(`  命中词: ${words.join(', ')} (${r.hit_count} 处)`);
    lines.push(`  偏移: ${r.text_offset} · 大段长度 ${text.length}`);
    if(!positions.length){
      // 无命中位置（理论上不会），输出开头片段
      lines.push(`  段: ${text.slice(0, WINDOW*2)}`);
    }else{
      // 合并重叠窗口，避免重复输出
      const ranges = [];
      for(const p of positions){
        const s = Math.max(0, p - WINDOW);
        const e = Math.min(text.length, p + WINDOW);
        if(ranges.length && s <= ranges[ranges.length-1][1]){
          ranges[ranges.length-1][1] = Math.max(ranges[ranges.length-1][1], e);
        }else{
          ranges.push([s, e]);
        }
      }
      lines.push(`  段（${ranges.length} 段）:`);
      for(const [s, e] of ranges){
        let seg = text.slice(s, e);
        if(s > 0) seg = '...' + seg;
        if(e < text.length) seg = seg + '...';
        lines.push(`    [${s}-${e}] ${seg.replace(/\n/g, ' ')}`);
      }
    }
    exported++;
  }
  lines.push('');
  lines.push('---');
  lines.push(`导出 ${exported} 条 · 失败 ${failed} 条 · ${new Date().toISOString()}`);
  const ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  downloadText(lines.join('\n'), `search_minichunk_${ts}.txt`);
  toast(`已导出 ${exported} 条段（失败 ${failed}）`,'success');
}

function renderImportLibOptions(){
  const sel = document.getElementById('importLib');

      if(info && info.lib && Array.from(sel.options).some(o=>o.value === info.lib)){
        sel.value = info.lib;
      }
    }

function updateImportBtnState(){
  const sel = document.getElementById('importLib');

function buildGroupedLibOptions(labelFn){
  if(!libraries.length) return '<option value="">（无可用库）</option>';
  const tree = buildLibTree();
  const parts = [];
  // 扁平渲染：每个含直接库的文件夹一个 optgroup（用缩进标签表示层级，避免嵌套 optgroup 不被支持）
  function walk(node, depth){
    for(const child of node.children){
      if(child.libs.length){
        const label = '　'.repeat(depth) + child.name + ' (' + countLibsInFolder(child) + '库)';
        parts.push(`<optgroup label="${esc(label)}">`);
        for(const l of child.libs){
          parts.push(`<option value="${esc(l.name)}">${esc(labelFn(l))}</option>`);
        }
        parts.push('</optgroup>');
      }
      walk(child, depth+1);
    }
  }
  walk(tree, 0);
  // 根级库
  if(tree.libs.length){
    parts.push('<optgroup label="未分组">');
    for(const l of tree.libs){
      parts.push(`<option value="${esc(l.name)}">${esc(labelFn(l))}</option>`);
    }
    parts.push('</optgroup>');
  }
  return parts.join('');
}

  });
  document.getElementById('importUploadMode').classList.toggle('hidden', mode!=='upload');
  document.getElementById('importPathMode').classList.toggle('hidden', mode!=='path');
}
function _fileKey(f){
  // 优先用 webkitRelativePath（文件夹选择时），否则用 name
  const path = f.webkitRelativePath || f.name;
  return path + '|' + f.size;
}
function _fileDisplayPath(f){
  const path = f.webkitRelativePath || '';
  if(path && path !== f.name) return path;
  return '';
}
function bindFileInput(){
  const input = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const folderInput = document.getElementById('folderInput');
  if(input){
    input.onchange = (e)=>{
      addFiles(Array.from(e.target.files));
      input.value = '';
    };
  }
  if(folderInput){
    folderInput.onchange = (e)=>{
      // 文件夹选择：过滤出支持的扩展名
      const all = Array.from(e.target.files);
      const filtered = all.filter(f=>{
        const ext = f.name.split('.').pop().toLowerCase();
        return SUPPORTED_EXTS.includes(ext);
      });
      addFiles(filtered);
      folderInput.value = '';
    };
  }
  if(dropZone){
    ['dragenter','dragover'].forEach(ev=>{
      dropZone.addEventListener(ev, e=>{ e.preventDefault(); dropZone.classList.add('dragover'); });
    });
    ['dragleave','drop'].forEach(ev=>{
      dropZone.addEventListener(ev, e=>{ e.preventDefault(); dropZone.classList.remove('dragover'); });
    });
    dropZone.addEventListener('drop', e=>{
      const files = Array.from(e.dataTransfer.files).filter(f=>{
        const ext = f.name.split('.').pop().toLowerCase();
        return SUPPORTED_EXTS.includes(ext);
      });
      addFiles(files);
    });
  }
}
function addFiles(files){
  let added = 0;
  for(const f of files){
    const key = _fileKey(f);
    if(!selectedFiles.some(x=>_fileKey(x)===key)){
      selectedFiles.push(f);
      added++;
    }
  }
  if(added>0) renderFileList();
}
function removeFile(idx){
  selectedFiles.splice(idx, 1);
  renderFileList();
}
function clearAllFiles(){
  selectedFiles = [];
  renderFileList();
}
function renderFileList(){
  const el = document.getElementById('fileList');
  if(!el) return;
  if(!selectedFiles.length){ el.innerHTML=''; return; }
  let h = `<div class="file-list-h">
    <span>已选 ${selectedFiles.length} 个文件</span>
    <span class="clear-all" onclick="clearAllFiles()">全部清除</span>
  </div>`;
  h += selectedFiles.map((f,i)=>{
    const sz = f.size<1024 ? f.size+'B' : f.size<1024*1024 ? (f.size/1024).toFixed(1)+'KB' : (f.size/1024/1024).toFixed(1)+'MB';
    const path = _fileDisplayPath(f);
    return `<div class="file-item">
      <span class="fname">
        <span class="fn-main">${esc(f.name)}</span>
        ${path?`<span class="fn-path">${esc(path)}</span>`:''}
      </span>
      <span class="fsize">${sz}</span>
      <span class="fremove" onclick="removeFile(${i})">×</span>
    </div>`;
  }).join('');
  el.innerHTML = h;
}
async function doImport(){
  const lib = document.getElementById('importLib').value;
  const force = document.getElementById('importForce').checked;
  if(!lib){ toast('请选择目标库','error'); return; }
  const out = document.getElementById('importOutput');
  // 先校验，再显示 loading，避免空文件时 loading 不消失
  if(importMode==='upload'){
    if(!selectedFiles.length){ toast('请选择文件','error'); out.innerHTML=''; return; }
  }else{
    const paths = document.getElementById('importPaths').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!paths.length){ toast('请输入文件路径','error'); out.innerHTML=''; return; }
  }
  // path 模式用 SSE 流式导入（有进度 + 可撤销）；upload 模式保持原样
  if(importMode === 'path'){
    await doImportStream(lib, force, out, 'path');
    return;
  }
  // upload 模式也走 SSE 流式（有进度 + 可撤销）
  if(importMode === 'upload'){
    await doImportStream(lib, force, out, 'upload');
    return;
  }
  out.innerHTML = '<div class="loading-overlay"><span class="loader"></span> 导入中（可能需要一些时间）...</div>';
  try{
    let d;
    if(importMode==='upload'){
      const fd = new FormData();
      fd.append('library', lib);
      fd.append('force', force?'1':'0');
      for(const f of selectedFiles){
        const uploadName = f.webkitRelativePath || f.name;
        fd.append('files', f, uploadName);
      }
      const r = await fetch('/api/upload', {method:'POST', body:fd});
      d = await r.json();
      if(!d.ok) throw new Error(d.error);
      d = d.data;
    }
    renderImportResult(out, d, null);
    toast(`导入完成: 成功${d.ok} 跳过${d.skipped} 失败${d.fail}`, d.fail?'error':'success');
    if(d.ok>0){ selectedFiles = []; renderFileList(); }
    loadLibraries();
  }catch(e){ out.innerHTML = `<div class="empty"><div class="empty-text">${esc(e.message)}</div></div>`; }
}

// SSE 流式导入（path 和 upload 模式共用）：进度条 + 撤销按钮
async function doImportStream(lib, force, out, mode){
  const batchId = 'batch_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  // 持久化到 sessionStorage，刷新页面后可恢复进度
  sessionStorage.setItem('importBatch', JSON.stringify({batchId, total: 0, mode, lib}));
  // 同步记忆上次导入的库，确保导入完成后切回导入页时 select 仍选中该库
  sessionStorage.setItem('lastImportLib', lib);
  // 进度 UI
  out.innerHTML = `<div class="card" id="importProgressCard">
    <div class="section-h" style="font-size:16px;display:flex;justify-content:space-between;align-items:center">
      <span>导入中...</span>
      <button class="btn-export" style="background:var(--crimson)" id="importCancelBtn" onclick="cancelImport('${batchId}')">撤销导入</button>
    </div>
    <div style="background:var(--paper-3);border-radius:6px;height:24px;margin:10px 0;overflow:hidden">
      <div id="importProgressBar" style="background:var(--gold-2);height:100%;width:0%;transition:width 0.3s"></div>
    </div>
    <div id="importProgressText" style="font-size:13px;color:var(--muted);margin-bottom:8px">${mode==='upload'?'上传中...':'准备中...'}</div>
    <div id="importProgressFiles" style="max-height:200px;overflow-y:auto;font-size:12px"></div>
  </div>`;
  const barEl = document.getElementById('importProgressBar');
  const textEl = document.getElementById('importProgressText');
  const filesEl = document.getElementById('importProgressFiles');
  const cancelBtn = document.getElementById('importCancelBtn');
  let cancelled = false;
  let totalZones = 1;  // 用于二阶段进度条计算
  let lastFileProgress = {current: 0, total: 0};  // 跟踪一阶段进度
  window._importCancelFlag = false;

  try{
    let resp;
    if(mode === 'upload'){
      // upload 模式：POST multipart + SSE 响应
      const fd = new FormData();
      fd.append('library', lib);
      fd.append('force', force?'1':'0');
      fd.append('batch_id', batchId);
      for(const f of selectedFiles){
        const uploadName = f.webkitRelativePath || f.name;
        fd.append('files', f, uploadName);
      }
      resp = await fetch(API + '/api/upload/stream', {method:'POST', body:fd});
    }else{
      // path 模式：GET + SSE 响应
      const paths = document.getElementById('importPaths').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const params = new URLSearchParams({
        library: lib,
        force: force ? '1' : '0',
        files: JSON.stringify(paths),
        batch_id: batchId,
      });
      resp = await fetch(API + '/api/import/stream?' + params.toString());
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let finalData = null;
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: ')) continue;
        try{
          const ev = JSON.parse(line.slice(6));
          if(ev.phase === 'start'){
            lastFileProgress.total = ev.total;
            textEl.textContent = `共 ${ev.total} 个文件待导入`;
          }else if(ev.phase === 'progress'){
            lastFileProgress.current = ev.current;
            lastFileProgress.total = ev.total;
            // 一阶段：文件导入（占整体进度 0%~90%）
            const pct = Math.round(ev.current / Math.max(ev.total,1) * 90);
            barEl.style.width = pct + '%';
            barEl.style.background = 'var(--gold-2)';
            const statusIcon = ev.status==='ok'?'✓':ev.status==='skipped'?'○':ev.status==='fail'?'✗':'...';
            const statusColor = ev.status==='ok'?'var(--jade)':ev.status==='fail'?'var(--crimson)':'var(--muted)';
            textEl.innerHTML = `<span style="color:${statusColor}">${statusIcon}</span> [${ev.current}/${ev.total}] ${esc(ev.file)}${ev.chars?' · '+fmt(ev.chars)+'字':''}`;
            if(ev.status !== 'processing'){
              filesEl.innerHTML += `<div style="padding:2px 0"><span style="color:${statusColor}">${statusIcon}</span> ${esc(ev.file)} ${ev.status==='fail'?'<span style="color:var(--crimson)">'+esc(ev.error||'')+'</span>':''}</div>`;
              // 每导入成功一个文件，后端已更新 zone 元数据；节流刷新侧边栏字数/大段数
              if(ev.status === 'ok') refreshLibStatsThrottled();
            }
          }else if(ev.phase === 'merging'){
            totalZones = Math.max(ev.zones, 1);
            textEl.textContent = `正在构建索引（${ev.zones} 个存储区）...`;
            barEl.style.width = '90%';
            barEl.style.background = 'var(--brand)';
          }else if(ev.phase === 'merging_progress'){
            // 二阶段：索引构建（占整体进度 90%~100%）
            // zone_index 从 1 开始；每个 zone 内部按 current/total 计算
            const zoneFinished = (ev.zone_index - 1);
            const zoneInner = ev.total > 0 ? (ev.current / ev.total) : 0;
            const mergingPct = (zoneFinished + zoneInner) / totalZones;
            const pct = Math.round(90 + mergingPct * 10);  // 90%~100%
            if(barEl){ barEl.style.width = pct + '%'; barEl.style.background = 'var(--brand)'; }
            const stageText = ev.stage === 'indexing' ? '收集倒排' : '写入分桶';
            textEl.innerHTML = `<span style="color:var(--brand)">索引构建中</span> · 存储区 ${ev.zone_index}/${totalZones} · ${stageText} [${ev.current}/${ev.total}]`;
          }else if(ev.phase === 'merging_heartbeat'){
            // 心跳事件，保持 UI 活跃，不更新文本（避免闪烁）
          }else if(ev.phase === 'cancelled'){
            cancelled = true;
            textEl.innerHTML = '<span style="color:var(--crimson)">导入已撤销，正在清理已导入文件...</span>';
          }else if(ev.phase === 'done'){
            if(ev.cancelled){
              textEl.innerHTML = '<span style="color:var(--crimson)">导入已撤销，已清理 '+(ev.imported_shas||[]).length+' 个文件</span>';
              barEl.style.width = '0%';
              if(cancelBtn) cancelBtn.style.display = 'none';
              toast('导入已撤销','info');
            }else{
              // 即时更新 UI 为「完成」状态，避免停留在「索引构建中」
              if(barEl){ barEl.style.width = '100%'; barEl.style.background = 'var(--jade)'; }
              if(textEl){
                textEl.innerHTML = `<span style="color:var(--jade)">✓ 导入完成：成功 ${ev.ok} 跳过 ${ev.skipped} 失败 ${ev.fail}，正在加载结果...</span>`;
              }
              if(cancelBtn) cancelBtn.style.display = 'none';
              finalData = ev;
            }
          }else if(ev.phase === 'error'){
            throw new Error(ev.message);
          }
        }catch(_e){ /* ignore parse error */ }
      }
    }
    reader.cancel();
    // 清除 sessionStorage（导入已结束，无需恢复）
    sessionStorage.removeItem('importBatch');
    if(finalData){
      renderImportResult(out, finalData, batchId);
      toast(`导入完成: 成功${finalData.ok} 跳过${finalData.skipped} 失败${finalData.fail}`, finalData.fail?'error':'success');
      if(finalData.ok>0){ selectedFiles = []; renderFileList(); }
      loadLibraries();
    }else if(!cancelled){
      out.innerHTML = '<div class="empty"><div class="empty-text">导入未完成</div></div>';
    }
  }catch(e){
    sessionStorage.removeItem('importBatch');
    out.innerHTML = `<div class="empty"><div class="empty-text">${esc(e.message)}</div></div>`;
  }
}

// 检测刷新前是否有进行中的导入批次，若有则恢复进度显示并轮询
async function resumeImportIfNeeded(){
  const raw = sessionStorage.getItem('importBatch');
  if(!raw) return;
  let info;
  try{ info = JSON.parse(raw); }catch(_e){ sessionStorage.removeItem('importBatch'); return; }
  const out = document.getElementById('importOutput');
  if(!out) return;
  // 渲染进度卡片
  out.innerHTML = `<div class="card" id="importProgressCard">
    <div class="section-h" style="font-size:16px;display:flex;justify-content:space-between;align-items:center">
      <span>导入进行中（页面已刷新，恢复进度中...）</span>
      <button class="btn-export" style="background:var(--crimson)" id="importCancelBtn" onclick="cancelImport('${info.batchId}')">撤销导入</button>
    </div>
    <div style="background:var(--paper-3);border-radius:6px;height:24px;margin:10px 0;overflow:hidden">
      <div id="importProgressBar" style="background:var(--gold-2);height:100%;width:0%;transition:width 0.3s"></div>
    </div>
    <div id="importProgressText" style="font-size:13px;color:var(--muted);margin-bottom:8px">查询批次状态...</div>
  </div>`;
  const barEl = document.getElementById('importProgressBar');
  const textEl = document.getElementById('importProgressText');
  // 轮询批次状态
  let pollCount = 0;
  const maxPolls = 7200;  // 最多轮询 1 小时（每 500ms 一次）
  const poll = async () => {
    try{
      const d = await api('GET', '/api/import/batch', {batch_id: info.batchId});
      if(d.done){
        if(barEl){ barEl.style.width = '100%'; barEl.style.background = 'var(--jade)'; }
        if(textEl) textEl.innerHTML = `<span style="color:var(--jade)">✓ 导入已完成（共 ${d.shas_count} 个文件已导入），请刷新文件列表查看</span>`;
        sessionStorage.removeItem('importBatch');
        loadLibraries();
        toast('导入已完成','success');
        return;
      }
      if(d.cancelled){
        if(textEl) textEl.innerHTML = '<span style="color:var(--crimson)">导入已撤销</span>';
        sessionStorage.removeItem('importBatch');
        loadLibraries();
        return;
      }
      // 一阶段进度（文件导入占 0%~90%）；二阶段（索引合并）后端不暴露细节，按完成度估算
      const current = d.current || 0;
      const total = d.total || 0;
      // 简化：done=false 时仍在一阶段，按 current/total*90 计算
      // 如果 current === total 且未 done，说明在二阶段索引合并
      let pct;
      let statusText;
      if(total > 0 && current >= total){
        pct = 95;  // 二阶段进行中，停在 95%
        statusText = `索引构建中... [${current}/${total}]（此阶段无需逐文件进度）`;
        if(barEl){ barEl.style.background = 'var(--brand)'; }
      }else{
        pct = total > 0 ? Math.round(current / total * 90) : 0;
        statusText = `导入中... [${current}/${total}]`;
        if(barEl){ barEl.style.background = 'var(--gold-2)'; }
      }
      if(barEl) barEl.style.width = pct + '%';
      if(textEl) textEl.textContent = statusText;
      refreshLibStatsThrottled();  // 轮询期间同步刷新侧边栏字数/大段数（2s 节流）
      pollCount++;
      if(pollCount < maxPolls){
        setTimeout(poll, 500);
      }else{
        // 超时停止轮询
        if(textEl) textEl.textContent = '轮询超时，请刷新页面查看结果';
        sessionStorage.removeItem('importBatch');
      }
    }catch(e){
      // 批次不存在（已过期或服务器重启）
      sessionStorage.removeItem('importBatch');
      if(textEl) textEl.innerHTML = `<span style="color:var(--muted)">批次状态不可用（${esc(e.message)}），可能已过期</span>`;
    }
  };
  poll();
}

// 撤销导入
async function cancelImport(batchId){
  if(!confirm('确定撤销本次导入？已导入的文件将被删除。')) return;
  try{
    const d = await api('POST', '/api/import/cancel', null, {batch_id: batchId});
    toast(`已撤销，删除 ${d.removed_shas} 个文件`, 'info');
    window._importCancelFlag = true;
    loadLibraries();
  }catch(e){
    toast('撤销失败: ' + e.message, 'error');
  }
}

// 渲染导入结果（公共）
function renderImportResult(out, d, batchId){
  let cancelBtn = batchId ? `<button class="btn-export" style="background:var(--crimson);margin-left:8px" onclick="cancelImport('${batchId}')">撤销本次导入</button>` : '';
  let h = `<div class="card"><div class="section-h" style="font-size:16px;display:flex;justify-content:space-between;align-items:center">
    <span>导入完成</span><span>${cancelBtn}</span></div>
    <div class="search-stats">
      <div class="stat-item"><div class="stat-num" style="color:var(--jade)">${d.ok}</div><div class="stat-label">成功</div></div>
      <div class="stat-item"><div class="stat-num" style="color:var(--gold-2)">${d.skipped}</div><div class="stat-label">跳过</div></div>
      <div class="stat-item"><div class="stat-num" style="color:var(--crimson)">${d.fail}</div><div class="stat-label">失败</div></div>
      <div class="stat-item"><div class="stat-num">${d.total}</div><div class="stat-label">总计</div></div>
    </div>`;
  // 语义向量索引构建状态提示
  const sb = d.semantic_build;
  if(sb){
    if(sb.triggered){
      h += `<div style="margin:10px 0;padding:8px 12px;background:var(--paper-2);border-left:3px solid var(--gold-2);border-radius:4px;font-size:13px;color:var(--muted)">
        <span style="color:var(--gold-2)">● 向量索引后台构建中</span> —— 语义检索通道正在后台静默构建，构建完成（约 10~15 分钟）后自动生效。构建期间可正常使用关键词检索。
      </div>`;
    }else if(sb.reason && sb.reason.indexOf('关闭') >= 0){
      h += `<div style="margin:10px 0;padding:8px 12px;background:var(--paper-2);border-left:3px solid var(--gray);border-radius:4px;font-size:13px;color:var(--muted)">
        <span style="color:var(--gray)">向量索引未自动构建</span> —— ${esc(sb.reason)}。可在「设置 → 语义向量检索」中开启。
      </div>`;
    }else if(sb.reason && sb.reason.indexOf('未装') >= 0 || (sb.reason && sb.reason.indexOf('依赖') >= 0)){
      h += `<div style="margin:10px 0;padding:8px 12px;background:var(--paper-2);border-left:3px solid var(--crimson);border-radius:4px;font-size:13px;color:var(--muted)">
        <span style="color:var(--crimson)">向量索引不可用</span> —— ${esc(sb.reason)}。安装依赖后可在库管理页手动构建。
      </div>`;
    }else if(!sb.triggered){
      // 防御性 fallback：triggered=false 且 reason 不匹配上述分支时提示手动构建
      h += `<div style="margin:10px 0;padding:8px 12px;background:var(--paper-2);border-left:3px solid var(--gold-2);border-radius:4px;font-size:13px;color:var(--muted)">
        <span style="color:var(--gold-2)">向量索引未自动构建</span> —— ${esc(sb.reason||'未知原因')}。可在库管理页手动触发构建。
      </div>`;
    }
  }
  h += `<div class="import-list">`;
  for(const r of d.details){
    const cls = r.status==='ok'?'st-ok':r.status==='skipped'?'st-skip':'st-fail';
    h += `<div class="import-item"><span>${esc(r.file)}</span><span class="st ${cls}">${r.status}${r.chars?' · '+fmt(r.chars)+'字':''}</span></div>`;
  }
  h += '</div></div>';
  out.innerHTML = h;
}

function renderFilesExtStats(stats){

  if(!entries.length){ el.innerHTML=''; return; }
  const total = entries.reduce((s,[,n])=>s+n, 0);
  let h = `<span class="ext-chip${filesState.ext===''?' active':''}" onclick="setFilesExt('')">全部 (${total})</span>`;
  for(const [ext, n] of entries){
    h += `<span class="ext-chip${filesState.ext===ext?' active':''}" onclick="setFilesExt('${esc(ext)}')">${esc(ext||'(无)')} (${n})</span>`;
  }

function fmtBytes(n){
  // 字符数粗略换算（中文 1 字≈3字节，英文 1 字符≈1字节），这里按字符数显示
  if(n>=100000000) return (n/100000000).toFixed(2)+' 亿字';
  if(n>=40000000) return (n/40000000).toFixed(2)+' 千万字';
  if(n>=10000) return (n/10000).toFixed(1)+' 万字';
  return n + ' 字';
}

function renderFilesPager(d){
  const el = document.getElementById('filesPager');
  if(!el) return;
  if(d.total_pages<=1){ el.innerHTML=''; return; }
  let h = '<div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap">';
  const go = (p, label, disabled)=>`<button class="btn-pager${p===d.page?' active':''}" ${disabled?'disabled':''} onclick="goFilesPage(${p})">${label}</button>`;
  h += go(d.page-1, '上一页', d.page<=1);
  // 页码显示：首末 + 当前±2
  const pages = new Set([1, d.total_pages, d.page, d.page-1, d.page+1, d.page-2, d.page+2]);
  const sorted = [...pages].filter(p=>p>=1 && p<=d.total_pages).sort((a,b)=>a-b);
  let prev = 0;
  for(const p of sorted){
    if(p-prev>1) h += '<span class="pager-ellipsis">…</span>';
    h += go(p, p, false);
    prev = p;
  }
  h += go(d.page+1, '下一页', d.page>=d.total_pages);
  h += '</div>';
  el.innerHTML = h;
}

async function previewFile(sha, name, filePath){

  showModal(`<div class="modal-h"><span>📄 ${esc(name||'预览')}</span><span class="modal-close" onclick="closeModal()">×</span></div>

    </div>`);
  // 调整 Modal 尺寸
  const box = document.getElementById('modalBox');
  if(box){ box.style.maxWidth = '90vw'; box.style.maxHeight = '88vh'; }
  try{
    const params = new URLSearchParams({library: filesState.library, sha256: sha});
    if(filePath) params.set('file_path', filePath);
    const d = await api('GET', '/api/file-chunks?' + params.toString());
    const text = d.text || '';
    const meta = `${fmt(d.total_chars||0)} 字 · ${d.total_chunks||0} 个大段${d.sha256?' · '+esc(d.sha256.slice(0,12))+'...':''}`;
    // 大文档截断：超过 5 万字仅渲染前 5 万字，避免浏览器卡死
    const PREVIEW_LIMIT = 50000;
    let displayText = text;
    let truncHint = '';
    if(text.length > PREVIEW_LIMIT){
      displayText = text.slice(0, PREVIEW_LIMIT);
      truncHint = `<div class="hint" style="margin:8px 0;color:var(--crimson)">⚠ 文档过大（${fmt(text.length)} 字），仅显示前 ${fmt(PREVIEW_LIMIT)} 字。完整内容请点击「⬇ 下载源文件」。</div>`;
    }
    // 下载按钮：复用 /api/download 接口（按 file_path + library 下载源文件）
    const dlPath = d.file_path || filePath || '';
    const dlBtn = dlPath
      ? `<button class="btn-export" onclick="downloadPreviewFile(${esc(JSON.stringify(dlPath))},${esc(JSON.stringify(filesState.library))})">⬇ 下载源文件</button>`
      : '';
    const html = `<div class="modal-h">

        <div class="file-preview-text" id="filePreviewText">${esc(displayText)}</div>
      </div>
      <div class="modal-foot">
        <button class="btn-trace" onclick="copyPreviewText()">复制文本</button>
        ${dlBtn}
        <button class="btn-export" onclick="closeModal()">关闭</button>
      </div>`;
    showModal(html);
    const box2 = document.getElementById('modalBox');
    if(box2){ box2.style.maxWidth = '90vw'; box2.style.maxHeight = '88vh'; }
    // 缓存当前预览文本供复制用（保留完整文本）
    window._previewText = text;
  }catch(e){
    showModal(`<div class="modal-h"><span>📄 ${esc(name||'预览')}</span><span class="modal-close" onclick="closeModal()">×</span></div>
      <div class="modal-body"><div style="color:var(--crimson)">加载失败: ${esc(e.message)}</div></div>
      <div class="modal-foot"><button class="btn-export" onclick="closeModal()">关闭</button></div>`);

    </div>`);

  try{
    // 用 file_path 作为 file-chunks 接口的匹配条件；同时尝试 file_path 的多种变体（正反斜杠）
    let d = null;

      filePath,
      filePath.replace(/\\/g, '/'),
      filePath.replace(/\//g, '\\'),
    ];
    // 去重
    const tried = new Set();

      if(tried.has(fp)) continue;
      tried.add(fp);
      try{

      }

      // 还失败：尝试用文件名作为 sha256 反查（dedup 索引按 file_name 也能找到）
      try{
        const fileName = filePath.split(/[\\\/]/).pop();
        const params = new URLSearchParams({library, file_name: fileName});
        d = await api('GET', '/api/file-chunks?' + params.toString());
      }catch(e2){

    const meta = `${fmt(d.total_chars||0)} 字 · ${d.total_chunks||0} 个大段`;
    // 大文档截断：超过 5 万字仅渲染前 5 万字，避免浏览器卡死
    const PREVIEW_LIMIT = 50000;
    let displayText = text;

    if(text.length > PREVIEW_LIMIT){
      displayText = text.slice(0, PREVIEW_LIMIT);
      truncHint = `<div class="hint" style="margin:8px 0;color:var(--crimson)">⚠ 文档过大（${fmt(text.length)} 字），仅显示前 ${fmt(PREVIEW_LIMIT)} 字。完整内容请点击「⬇ 下载源文件」。</div>`;
    }
    const html = `<div class="modal-h">
        <span>📄 ${esc(d.file_name || '预览')}</span>
        <span class="modal-close" onclick="closeModal()">×</span>
      </div>

        <div class="hint" style="margin-bottom:8px">${meta}</div>
        ${truncHint}
        <div class="file-preview-text">${esc(displayText)}</div>
      </div>
      <div class="modal-foot">
        <button class="btn-trace" onclick="copyRefPreviewText()">复制文本</button>
        <button class="btn-export" onclick="downloadPreviewFile(${esc(JSON.stringify(filePath))},${esc(JSON.stringify(library))})">⬇ 下载源文件</button>
        <button class="btn-export" onclick="closeModal()">关闭</button>
      </div>`;
    showModal(html);
    const box2 = document.getElementById('modalBox');
    if(box2){ box2.style.maxWidth = '90vw'; box2.style.maxHeight = '88vh'; }
    window._previewText = text;
  }catch(e){
    showModal(`<div class="modal-h"><span>📄 预览源文件</span><span class="modal-close" onclick="closeModal()">×</span></div>
      <div class="modal-body"><div style="color:var(--crimson)">加载失败: ${esc(e.message)}</div></div>
      <div class="modal-foot"><button class="btn-export" onclick="closeModal()">关闭</button></div>`);
  }

async function deleteOneFile(sha, name){
  if(!confirm(`确定删除文件「${name}」？\n将删除该源文件对应的所有大段，并重建受影响 zone 的倒排索引。\n此操作不可撤销！`)) return;
  if(!filesState.library){ toast('未选择库','error'); return; }
  // 前端先即时从列表移除并重渲染（避免删除期间用户看到已删文件）
  _removeFilesFromLocalState([sha]);
  try{
    toast('正在删除...','info');
    const d = await api('DELETE','/api/files', {library:filesState.library, sha});
    toast(`已删除：${d.removed_chunks} 大段，${fmt(d.removed_chars)} 字`,'success');
  }catch(e){
    toast('删除失败: '+e.message,'error');
    // 失败时刷新以恢复真实状态
    await reloadFiles();
  }

async function deleteSelectedFiles(){
  const shas = Array.from(filesState.selected);
  if(!shas.length){ toast('未选中任何文件','error'); return; }
  if(!filesState.library){ toast('未选择库','error'); return; }
  // 优化：若选中数 === 当前库总文件数，走快速路径（删库重建）
  const total = filesState.data?.total || 0;
  if(total > 0 && shas.length >= total){
    if(!confirm(`检测到要删除全部 ${total} 个文件。\n\n采用「删库重建」快速模式：直接删除整个库再用同名同备注重建（比逐个删除快很多）。\n\n此操作不可撤销，是否继续？`)) return;
    return deleteAllFilesFast(filesState.library);
  }
  if(!confirm(`确定删除选中的 ${shas.length} 个文件？\n将逐个删除对应大段并重建索引。\n此操作不可撤销！`)) return;
  // 前端先即时移除全部选中文件并重渲染（用户立即看到效果，删除在后端进行）
  _removeFilesFromLocalState(shas);
  // 调用后端异步批量删除
  let batchId;
  try{
    const r = await api('POST','/api/files/batch-delete', null, {library: filesState.library, shas});
    batchId = r.batch_id;
  }catch(e){
    toast('启动批量删除失败: ' + e.message, 'error');
    await reloadFiles();
    return;
  }
  // 持久化到 sessionStorage（刷新页面后可恢复进度）
  sessionStorage.setItem('deleteBatch', JSON.stringify({
    batchId, library: filesState.library, total: shas.length, startedAt: Date.now()
  }));
  // 显示进度卡片并启动轮询
  _renderDeleteProgress(shas.length, 0, '正在删除...');
  _pollDeleteProgress(batchId, shas.length);
}

  }
}

// 轮询批量删除进度
async function _pollDeleteProgress(batchId, totalHint){
  let pollCount = 0;
  const maxPolls = 14400;  // 最多轮询 2 小时（每 500ms 一次）
  const poll = async () => {
    try{
      const d = await api('GET','/api/files/delete-status', {batch_id: batchId});
      const total = d.total || totalHint || 0;
      const current = d.current || 0;
      if(d.done){
        _renderDeleteProgress(total, total, '完成');
        sessionStorage.removeItem('deleteBatch');
        const msg = `完成：成功 ${d.ok_count} 个，失败 ${d.fail_count} 个；共删除 ${d.removed_chunks} chunk，${fmt(d.removed_chars||0)} 字`;
        toast(msg, d.fail_count > 0 ? 'info' : 'success', 6000);
        // 静默刷新一次，确保统计数据准确
        await reloadFiles();
        return;
      }
      if(d.cancelled){
        _renderDeleteProgress(total, current, '已取消');
        sessionStorage.removeItem('deleteBatch');
        toast('批量删除已取消', 'info');
        await reloadFiles();
        return;
      }
      _renderDeleteProgress(total, current, `删除中 [${current}/${total}] · 成功 ${d.ok_count} 失败 ${d.fail_count}`);
      pollCount++;
      if(pollCount < maxPolls){
        setTimeout(poll, 500);
      }else{
        sessionStorage.removeItem('deleteBatch');
        if(document.getElementById('deleteProgressCard')){
          document.getElementById('deleteProgressCard').remove();
        }
        toast('删除轮询超时，请刷新查看结果', 'info');
      }
    }catch(e){
      // 批次不存在（已过期或服务器重启）
      sessionStorage.removeItem('deleteBatch');
      const card = document.getElementById('deleteProgressCard');
      if(card){
        card.innerHTML = `<div style="color:var(--muted);font-size:12px">批次状态不可用（${esc(e.message)}），可能已过期；请刷新文件列表查看实际状态</div>`;
      }
      await reloadFiles();
    }
  };
  poll();
}

// 刷新页面后恢复删除进度显示
async function _restoreDeleteProgress(){
  const raw = sessionStorage.getItem('deleteBatch');
  if(!raw) return;
  let info;
  try{ info = JSON.parse(raw); }catch(_e){ sessionStorage.removeItem('deleteBatch'); return; }
  // 渲染进度卡片
  _renderDeleteProgress(info.total || 0, 0, '恢复进度中...');
  // 继续轮询
  _pollDeleteProgress(info.batchId, info.total || 0);
}

// 前端即时从 filesState.data 移除已删文件并重渲染（不等后端）
function _removeFilesFromLocalState(shas){
  if(!filesState.data || !filesState.data.files) return;
  const set = new Set(shas);
  filesState.data.files = filesState.data.files.filter(f => !set.has(f.sha256));
  filesState.data.total = Math.max(0, (filesState.data.total||0) - shas.length);
  for(const s of shas) filesState.selected.delete(s);
  // 重新计算 ext_stats
  const stats = {};
  for(const f of filesState.data.files){
    const e = f.ext || '';
    stats[e] = (stats[e]||0) + 1;
  }
  filesState.data.ext_stats = stats;
  renderFilesExtStats(stats);
  renderFilesTable(filesState.data);
  renderFilesPager(filesState.data);
  updateFilesSelectedCount();
}

// 批量删除进度卡片（在文件列表上方显示）
function _renderDeleteProgress(total, current, status){
  const out = document.getElementById('filesOutput');
  if(!out) return;
  // 已完成则移除进度卡片
  if(current >= total && total > 0){
    const card = document.getElementById('deleteProgressCard');
    if(card) card.remove();
    return;
  }
  const pct = total > 0 ? Math.round(current / total * 100) : 0;
  const existing = document.getElementById('deleteProgressCard');
  // 提取当前 batchId（用于取消按钮）
  let batchId = '';
  try{
    const info = JSON.parse(sessionStorage.getItem('deleteBatch') || '{}');

  const cancelBtn = batchId
    ? `<button class="btn-export" style="background:var(--crimson);margin-left:8px" onclick="cancelBatchDelete('${esc(batchId)}')">取消</button>`
    : '';

      <span style="font-size:13px;font-weight:500">${esc(status)}</span>

        <span style="font-size:12px;color:var(--muted)">${current}/${total}</span>

function verifyHTML(){

  <div id="verifyContent"><div class="loading-overlay"><span class="loader"></span> 校验中...</div></div>`;

let _verifyLoading = false;
let _verifyAbortCtrl = null;
async function loadVerify(){
  // 状态锁 + 取消旧请求：避免快速切换 tab/连续点击时旧响应覆盖新 UI、连接池耗尽
  if(_verifyLoading){
    if(_verifyAbortCtrl) _verifyAbortCtrl.abort();
  }
  _verifyLoading = true;
  _verifyAbortCtrl = new AbortController();
  const el = document.getElementById('verifyContent');
  if(!el){ _verifyLoading = false; return; }
  // 记录当前容器引用，避免响应返回时容器已被 innerHTML 整体替换（写入游离节点）
  const elRef = el;
  try{
    const d = await api('GET','/api/verify', null, null, _verifyAbortCtrl.signal);
    // 容器已被替换：丢弃本次响应
    const cur = document.getElementById('verifyContent');
    if(cur !== elRef) return;
    if(!d.libraries || !d.libraries.length){
      elRef.innerHTML = '<div class="empty"><div class="empty-icon">✓</div><div class="empty-text">暂无库</div></div>';
      return;
    }
    // 全局汇总
    let totalLibs = d.libraries.length;
    let healthyLibs = 0;
    let totalIssues = 0;
    for(const lib of d.libraries){
      const r = lib.result || {};
      const sum = r.summary || {};
      if(sum.healthy) healthyLibs++;
      const suggestions = r.fix_suggestions || [];
      totalIssues += suggestions.filter(s => s.needs_fix).length;
      totalIssues += (r.zones||[]).filter(z => z.chunk_ok!==z.chunk_total || !z.continuity_ok || !z.source_ok).length;
      if(r.zones){
        for(const z of r.zones){
          totalIssues += (z.chunk_bad||[]).length;
          totalIssues += (z.continuity_issues||[]).length;
          totalIssues += (z.source_issues||[]).length;
        }
      }
    }
    let summaryHtml = '';
    if(totalIssues === 0){
      summaryHtml = `<div class="verify-result verify-ok">✓ 全部 ${totalLibs} 个库数据健康，未发现问题</div>`;
    } else {
      summaryHtml = `<div class="verify-result verify-bad">⚠ ${healthyLibs}/${totalLibs} 个库健康，共发现 ${totalIssues} 个问题</div>`;
    }
    // 按 folder 分组（folder 为空 = 根级）
    const libsByFolder = {};
    for(const lib of d.libraries){
      const f = lib.folder || '';
      if(!libsByFolder[f]) libsByFolder[f] = [];
      libsByFolder[f].push(lib);
    }
    // 构建树形结构：根级文件夹 + 各路径
    // 直接按 folder 字段排序输出（含子文件夹紧跟父级）
    const folders = Object.keys(libsByFolder).sort((a,b)=>{
      if(a==='') return -1;
      if(b==='') return 1;
      return a.localeCompare(b);
    });
    let html = summaryHtml;
    for(const folder of folders){
      const libs = libsByFolder[folder];
      // 该分组汇总
      let grpIssues = 0, grpHealthy = 0;
      for(const lib of libs){
        const r = lib.result || {};
        const sum = r.summary || {};
        if(sum.healthy) grpHealthy++;
        const suggestions = r.fix_suggestions || [];
        grpIssues += suggestions.filter(s => s.needs_fix).length;
        if(r.zones){
          for(const z of r.zones){
            grpIssues += (z.chunk_bad||[]).length + (z.continuity_issues||[]).length + (z.source_issues||[]).length;
          }
        }
      }
      const grpLabel = folder ? esc(folder) : '根级';
      const grpStatus = grpIssues === 0
        ? `<span style="color:var(--jade);font-size:12px">✓ ${grpHealthy}/${libs.length} 健康</span>`
        : `<span style="color:var(--crimson);font-size:12px">⚠ ${grpIssues} 个问题</span>`;
      html += `<div class="folder-group" style="margin-bottom:18px">
        <div class="folder-head" style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-soft);border-radius:6px;margin-bottom:10px;cursor:pointer" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="folder-toggle" style="display:inline-block;transition:transform .15s">▾</span>
          <span style="font-size:14px">📁</span>
          <strong style="flex:1">${grpLabel}</strong>
          <span style="color:var(--muted);font-size:12px">${libs.length} 个库</span>
          ${grpStatus}
        </div>
        <div class="folder-body">
          <div class="stats-grid">${libs.map(lib => renderVerifyCard(lib)).join('')}</div>
        </div>
      </div>`;
    }
    elRef.innerHTML = html;
  }catch(e){
    if(e.name === 'AbortError') return;  // 主动取消的请求，不显示错误
    const cur = document.getElementById('verifyContent');
    if(cur !== elRef) return;
    elRef.innerHTML = `<div class="empty"><div class="empty-text">${esc(e.message)}</div></div>`;
  }finally{
    _verifyLoading = false;
  }
}
function renderVerifyCard(lib){
  const r = lib.result || {};
  const sum = r.summary || {};
  const zones = r.zones || [];
  const suggestions = r.fix_suggestions || [];
  const needFix = suggestions.filter(s => s.needs_fix);
  const optional = suggestions.filter(s => !s.needs_fix);
  // 统计该库的问题数
  let issueCount = needFix.length;
  for(const z of zones){
    issueCount += (z.chunk_bad||[]).length;
    issueCount += (z.continuity_issues||[]).length;
    issueCount += (z.source_issues||[]).length;
  }
  const healthy = sum.healthy;
  const headerColor = healthy ? 'var(--jade)' : 'var(--crimson)';
  const headerBg = healthy ? 'var(--jade-soft)' : 'var(--crimson-soft)';
  let h = `<div class="stat-card" style="border-top:3px solid ${headerColor}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div style="flex:1">
        <div class="stat-card-h">${esc(lib.name)}</div>
        <div class="stat-card-note">${esc(lib.note||'无备注')}</div>
      </div>
      <span style="font-size:12px;padding:2px 10px;border-radius:3px;background:${headerBg};color:${headerColor};font-weight:500">
        ${healthy?'✓ 健康':'⚠ '+issueCount+' 个问题'}
      </span>
    </div>
    <div class="stat-card-row"><span>总 chunk 数</span><span>${fmt(sum.total_chunks||0)}</span></div>
    <div class="stat-card-row"><span>Zone 数</span><span>${sum.total_zones||0}</span></div>`;
  // 数据完整性
  if(zones.length){
    h += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">';
    h += '<div class="stat-card-row" style="font-weight:600"><span>数据完整性</span><span></span></div>';
    for(const z of zones){
      const ok = z.chunk_ok===z.chunk_total && z.continuity_ok && z.source_ok;
      h += `<div class="stat-card-row"><span style="color:${ok?'var(--jade)':'var(--crimson)'}">${ok?'✓':'✗'} ${z.zone_id}</span><span style="font-size:12px">chunks ${z.chunk_ok}/${z.chunk_total} · 连续性 ${z.continuity_ok?'OK':'异常'} · 源文件 ${z.source_ok?'OK':'异常'}</span></div>`;
      // 展示具体问题
      if(!ok){
        if(z.chunk_bad && z.chunk_bad.length){
          h += `<div style="padding:2px 0 2px 16px;font-size:11px;color:var(--crimson)">${z.chunk_bad.slice(0,5).map(b => '· '+esc(b.chunk)+': '+esc(b.reason)).join('<br>')}${z.chunk_bad.length>5?`<br>· ...还有 ${z.chunk_bad.length-5} 个`:''}</div>`;
        }
        if(z.continuity_issues && z.continuity_issues.length){
          h += `<div style="padding:2px 0 2px 16px;font-size:11px;color:var(--crimson)">${z.continuity_issues.slice(0,3).map(i => '· '+esc(i)).join('<br>')}${z.continuity_issues.length>3?`<br>· ...还有 ${z.continuity_issues.length-3} 个`:''}</div>`;
        }
        if(z.source_issues && z.source_issues.length){
          h += `<div style="padding:2px 0 2px 16px;font-size:11px;color:var(--crimson)">${z.source_issues.slice(0,3).map(i => '· '+esc(i)).join('<br>')}</div>`;
        }
      }
    }
    h += '</div>';
  }
  // 维护操作区（带勾选框 + 一键修复 + 单项执行）
  if(suggestions.length){
    const sevColors = {high:'#e74c3c', medium:'#f39c12', low:'#3498db', info:'#95a5a6'};
    const sevLabels = {high:'高', medium:'中', low:'低', info:'可选'};
    h += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">';
    h += '<div class="stat-card-row" style="font-weight:600"><span>维护操作</span><span></span></div>';
    h += `<div style="margin-bottom:10px">`;
    h += `<button class="btn btn-primary" style="margin-right:8px;padding:4px 12px;font-size:12px" onclick="fixAll('${esc(lib.name)}')">一键修复</button>`;
    h += `<span style="color:var(--muted);font-size:11px">默认勾选需修复项，可选其他项后点击</span>`;
    h += `</div>`;
    for(const s of suggestions){
      const sc = sevColors[s.severity]||'#999';
      const sl = sevLabels[s.severity]||'';
      const isChecked = s.needs_fix ? 'checked' : '';
      const statusIcon = s.needs_fix ? '⚠' : '✓';
      const statusColor = s.needs_fix ? 'var(--crimson)' : 'var(--jade)';
      const actionLabel = s.needs_fix ? '修复' : '执行';
      h += `<div class="verify-fix-item" style="display:flex;align-items:flex-start;padding:8px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;${s.needs_fix?'':'opacity:0.85'}">
