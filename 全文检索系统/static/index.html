  if(body.querySelector('.ai-chat-msg-actions')) return;
  const mid = esc(messageId);
  const actionsDiv = document.createElement('div');
  actionsDiv.className = 'ai-chat-msg-actions';
  actionsDiv.innerHTML =
    `<button class="ai-chat-msg-act" onclick="copyMsgContent(this,'${mid}')">复制答案</button>`
    + `<button class="ai-chat-msg-act" onclick="exportSingleMessage('${mid}')">导出此回答</button>`
    + `<button class="ai-chat-msg-act" onclick="rollbackToMessage('${mid}')" title="删除此消息及之后所有消息，回到此点重新提问">↩ 回退到此</button>`;
  const refsWrap = document.getElementById('chat-refs-wrap');
  if(refsWrap && refsWrap.parentNode === body){
    body.insertBefore(actionsDiv, refsWrap);
  }else{
    const answerEl = document.getElementById('chat-answer');
    if(answerEl && answerEl.parentNode === body){
      answerEl.after(actionsDiv);
    }else{
      body.appendChild(actionsDiv);
    }
  }
}

// 复制消息内容（user/assistant 通用）
function copyMsgContent(btn, msgId){
  const m = _findMessage(msgId);
  if(!m){ toast('消息不存在','error'); return; }
  copyTextToClipboard(btn, m.content || '');
}

// chat 引用：展开/收起原文（复用 fetchChunkText 缓存）
async function toggleChatRefText(library, chunkId, btn, words){
  const refEl = btn.closest('.ai-chat-msg-ref');
  const ftEl = refEl.querySelector('.chunk-fulltext');
  if(!ftEl) return;
  if(ftEl.style.display === 'block'){
    ftEl.style.display = 'none';
    btn.textContent = '展开原文';
    return;
  }
  btn.textContent = '加载中...';
  const d = await fetchChunkText(library, chunkId);
  if(!d){ btn.textContent = '展开原文'; return; }
  const meta = `<div class="ft-meta">${esc(d.chunk_id)} · ${fmt(d.text_length)} 字${d.heading?' · '+esc(d.heading):''} · 偏移 ${fmt(d.text_offset)} · ${esc(d.source && d.source.file_path || '')}</div>`;
  const text = d.text || '';
  const body = (words && words.length) ? highlight(text, words) : esc(text);
  ftEl.innerHTML = meta + body;
  ftEl.style.display = 'block';
  btn.textContent = '收起原文';
}

// chat 引用：复制片段
async function copyChatRefSnippet(library, chunkId, btn){
  const d = await fetchChunkText(library, chunkId);
  if(!d) return;
  await copyTextToClipboard(btn, d.text || '');
}

// 复制全部引用列表（按 msgId 从消息取 references，避免内联 JSON 转义问题）
function copyAllRefs(btn, msgId){
  const m = _findMessage(msgId);
  if(!m){ toast('消息不存在','error'); return; }
  const refs = m.references || [];
  if(!refs.length){ toast('无引用','info'); return; }
  const lines = [];
  lines.push(`# 引用来源（${refs.length} 条）`);
  lines.push('');
  for(const r of refs){
    lines.push(`[${r.index}] ${r.library} · ${r.source_file||''}${r.heading?' · '+r.heading:''}`);
    if(r.source_file_path) lines.push(`  路径: ${r.source_file_path}`);
    lines.push(`  chunk: ${r.chunk_id} · 命中 ${r.hit_count||0} 处 · 词: ${(r.matched_words||[]).join(', ')}`);
    if(r.snippet) lines.push(`  片段: ${r.snippet}`);
    lines.push('');
  }
  copyTextToClipboard(btn, lines.join('\n'));
}

// 引用多选：checkbox 状态变化时更新"加入选中到上下文"按钮文案
function onRefSelectChange(cb){
  // 找到所在的 refs 容器
  const refsBody = cb.closest('.ai-refs-body');
  if(!refsBody) return;
  const checked = refsBody.querySelectorAll('.ref-select-cb:checked');
  const btn = refsBody.parentElement.querySelector('.ai-chat-msg-refs-h .ai-chat-msg-act[onclick*="addSelectedRefsToContext"]');
  if(btn){
    btn.textContent = checked.length > 0 ? `加入选中到上下文(${checked.length})` : '加入选中到上下文';
  }
}

// 把选中的历史引用加入当前问题上下文（复用 contextChunks 机制）
async function addSelectedRefsToContext(btn){
  const refsBody = btn.closest('.ai-chat-msg-refs').querySelector('.ai-refs-body');
  if(!refsBody){ toast('未找到引用列表','error'); return; }
  const checked = refsBody.querySelectorAll('.ref-select-cb:checked');
  if(checked.length === 0){ toast('请先勾选要加入的引用','info'); return; }
  // 逐个加入上下文（复用 addToContext，会自动去重和获取前后 chunk）
  let added = 0;
  if(btn){ btn.disabled = true; btn.textContent = '加入中...'; }
  for(const cb of checked){
    const refDiv = cb.closest('.ai-chat-msg-ref');
    if(!refDiv) continue;
    const library = refDiv.getAttribute('data-library') || '';
    const chunkId = refDiv.getAttribute('data-chunk-id') || '';
    const heading = refDiv.getAttribute('data-heading') || '';
    const sourceFile = refDiv.getAttribute('data-source-file') || '';
    if(!library || !chunkId) continue;
    // 若已存在则跳过
    if(contextChunks.some(c => c.chunk_id === chunkId && c.is_center)){
      continue;
    }
    try{
      const qp = {library, chunk_id: chunkId, around: 0};
      if(ctxWindow > 0) qp.window = ctxWindow;
      const mw = refDiv.getAttribute('data-matched-words');
      if(mw) qp.matched_words = mw;
      const d = await api('GET', '/api/chunks-around', qp);
      for(const c of (d.chunks||[])){
        if(contextChunks.some(x => x.chunk_id === c.chunk_id)) continue;
        contextChunks.push({
          chunk_id: c.chunk_id,
          library,
          heading: c.heading || heading,
          file_path: sourceFile,
          text: c.text || '',
          is_center: !!c.is_center,
          chunk_seq: c.chunk_seq,
          hit_positions: c.hit_positions || [],
          eff_window: c.window || 0,
        });
        added++;
      }
    }catch(e){
      console.error('加入上下文失败:', e);
    }
  }
  // 刷新上下文栏（与 addToContext 一致：发送前才同步到后端会话）
  renderContextBar();
  if(btn){ btn.disabled = false; btn.textContent = '加入选中到上下文'; }
  if(added > 0) toast(`已加入 ${added} 个 chunk（共 ${contextChunks.length} 个）`, 'success');
  else toast('所选引用已在上下文中', 'info');
  // 取消勾选
  checked.forEach(cb => cb.checked = false);
  onRefSelectChange(checked[0]);
}

// 导出单条消息为 Markdown
async function exportSingleMessage(msgId){
  if(!currentChatSession || !msgId){ toast('无消息','info'); return; }
  try{
    const url = '/api/chat/sessions/' + encodeURIComponent(currentChatSession.id)
              + '/messages/' + encodeURIComponent(msgId) + '/export';
    const d = await api('GET', url);
    const blob = new Blob([d.markdown], {type:'text/markdown;charset=utf-8'});
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = u; a.download = d.filename || 'message.md';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(u);
    toast('已导出: ' + (d.filename || 'message.md'),'success');
  }catch(e){
    toast('导出失败: '+e.message,'error');
  }
}

// 回退到某条消息：删除该消息及之后所有消息
async function rollbackToMessage(msgId){
  if(!currentChatSession || !msgId){ toast('无消息','info'); return; }
  _cancelChatStream();
  if(!confirm('确定回退？将删除此消息及之后所有消息，可从该点重新提问。')) return;
  try{
    const url = '/api/chat/sessions/' + encodeURIComponent(currentChatSession.id)
              + '/messages/' + encodeURIComponent(msgId);
    const d = await api('DELETE', url);
    currentChatSession = d;
    renderChatMessages();
    await loadChatSessions();
    toast('已回退，可重新提问','success');
    document.getElementById('chatInput').focus();
  }catch(e){
    toast('回退失败: '+e.message,'error');
  }
}

async function doAiSearch(){
  const q = document.getElementById('aiQuestionInput').value.trim();
  if(!q){ toast('请输入问题','error'); return; }
  if(aiStreaming){ toast('正在生成中，请稍候','info'); return; }
  if(!settingsData || !settingsData.configured){
    toast('请先在「设置」页配置 DeepSeek API Key','error');
    return;
  }
  const parallel = document.getElementById('aiParallelInput').value || 4;
  const top = document.getElementById('aiTopInput').value || 8;
  const libs = aiSelectedLibs.size ? Array.from(aiSelectedLibs).join(',') : '';
  // 走 SSE 流式
  aiStreaming = true;
  const btn = document.getElementById('aiAskBtn');
  btn.disabled = true; btn.textContent = aiMode==='agent' ? 'Agent 执行中...' : '生成中...';
  const out = document.getElementById('aiOutput');
  // Agent 模式额外渲染流程面板
  const _isAwf = (aiMode==='agent' && aiSubmode==='agent_workflow');
  const agentPanelHtml = aiMode==='agent'
    ? (_isAwf
      ? `<div class="ai-agent-panel show" id="aiAgentPanel">
         <div class="ai-agent-step" id="step-plan">
           <div class="step-icon pending">1</div>
           <div class="step-body">
             <div class="step-title">智能体工具调用</div>
             <div class="step-detail" id="step-plan-detail">等待 LLM 决策...</div>
           </div>
         </div>
         <div class="ai-agent-step" id="step-gen">
           <div class="step-icon pending">2</div>
           <div class="step-body">
             <div class="step-title">生成答案</div>
             <div class="step-detail" id="step-gen-detail">等待...</div>
           </div>
         </div>
       </div>`
      : `<div class="ai-agent-panel show" id="aiAgentPanel">
         <div class="ai-agent-step" id="step-plan">
           <div class="step-icon pending">1</div>
           <div class="step-body">
             <div class="step-title">规划查询词</div>
             <div class="step-detail" id="step-plan-detail">等待开始...</div>
           </div>
         </div>
         <div class="ai-agent-step" id="step-search">
           <div class="step-icon pending">2</div>
           <div class="step-body">
             <div class="step-title">多轮检索</div>
             <div class="step-detail" id="step-search-detail">等待开始...</div>
           </div>
         </div>
         <div class="ai-agent-step" id="step-eval">
           <div class="step-icon pending">3</div>
           <div class="step-body">
             <div class="step-title">评估结果</div>
             <div class="step-detail" id="step-eval-detail">等待开始...</div>
           </div>
         </div>
         <div class="ai-agent-step" id="step-gen">
           <div class="step-icon pending">4</div>
           <div class="step-body">
             <div class="step-title">生成答案</div>
             <div class="step-detail" id="step-gen-detail">等待开始...</div>
           </div>
         </div>
       </div>`)
    : '';
  out.innerHTML = `
    ${agentPanelHtml}
    <div class="ai-retrieval" id="aiRetrieval" style="display:none"></div>
    <div class="ai-answer reasoning" id="aiReasoning" style="display:none"></div>
    <div class="ai-answer md-host ai-typing" id="aiAnswer"></div>
    <div id="aiRefsWrap" style="display:none">
      <div class="ai-refs-h" onclick="toggleRefsCollapse(this)" style="cursor:pointer;user-select:none">
        <span class="refs-toggle-icon">▶</span> 引用来源
      </div>
      <div class="ai-refs-body" id="aiRefs" style="display:none"></div>
    </div>`;

  const params = new URLSearchParams({question:q, parallel, top_k:top});
  if(libs) params.set('libraries', libs);
  // agent 模式参数
  if(aiMode === 'agent'){
    // 最大轮次已移至设置页（agent_workflow_max_rounds），后端从 settings 读取
    // 语义检索开关
    const semCheckbox = document.getElementById('aiSemanticCheckbox');
    if(semCheckbox && semCheckbox.checked) params.set('semantic', '1');
  }
  // 清除分块模式标志（每次新请求都是干净的）
  window._partitionAnswers = null;
  const endpoint = aiMode==='agent' ? '/api/ai-search/agent/stream' : '/api/ai-search/stream';
  const url = API + endpoint + '?' + params.toString();

  let answerEl = document.getElementById('aiAnswer');
  let reasoningEl = document.getElementById('aiReasoning');
  let answerText = '';
  let reasoningText = '';
  let reader = null;  // 提到 try 外面，方便 finally 和 done 事件清理
  let streamFinished = false;  // 收到 done/error 事件后置 true
  // Agent 状态
  let agentState = {
    queries: [],        // 本轮查询词
    usedQueries: [],    // 所有已用查询词
    hitQueries: new Set(),  // 有命中的查询词
    round: 0,
  };

  try{
    const resp = await fetch(url, {method:'GET'});
    if(!resp.ok){
      const d = await resp.json().catch(()=>({error:'HTTP '+resp.status}));
      throw new Error(d.error || ('HTTP '+resp.status));
    }
    reader = resp.body.getReader();
    const dec = new TextDecoder('utf-8');
    let buf = '';
    while(!streamFinished){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      // SSE 事件以 \n\n 分隔
      let idx;
      while((idx = buf.indexOf('\n\n')) >= 0){
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const line = block.split('\n').find(l=>l.startsWith('data:'));
        if(!line) continue;
        const dataStr = line.slice(5).trim();
        if(!dataStr) continue;
        let ev;
        try{ ev = JSON.parse(dataStr); }catch{ continue; }
        handleAiEvent(ev);
        // done/error 事件后主动关闭流，不等服务器关闭连接
        if(streamFinished && reader){
          try{ reader.cancel(); }catch(e){}
          break;
        }
      }
    }
  }catch(e){
    answerEl = document.getElementById('aiAnswer');
    answerEl.classList.remove('ai-typing');
    answerEl.innerHTML = '<span style="color:var(--crimson)">✗ ' + esc(e.message) + '</span>';
    toast('生成失败: '+e.message,'error');
  }finally{
    // 确保 reader 被取消（防止任何路径遗漏）
    if(reader){
      try{ reader.cancel(); }catch(e){}
    }
    aiStreaming = false;
    btn.disabled = false; btn.textContent = '提问';
    const aEl = document.getElementById('aiAnswer');
    if(aEl) aEl.classList.remove('ai-typing');
    // Agent 模式：把所有步骤的 active 状态清掉
    if(aiMode==='agent'){
      document.querySelectorAll('.ai-agent-step .step-icon.active').forEach(el=>{
        el.classList.remove('active'); el.classList.add('done');
      });
    }
  }

  // ============ Agent 步骤渲染辅助 ============
  function setStepIcon(stepId, state){
    // state: 'pending' | 'active' | 'done'
    const el = document.querySelector(`#step-${stepId} .step-icon`);
    if(!el) return;
    el.classList.remove('pending','active','done');
    el.classList.add(state);
  }
  function setStepDetail(stepId, html){
    const el = document.getElementById(`step-${stepId}-detail`);
    if(el) el.innerHTML = html;
  }
  // 分块流程指示条状态更新
  function _setPartFlow(step, state){
    const bar = document.getElementById('partFlowBar');
    if(!bar) return;
    const node = bar.querySelector(`.part-flow-step[data-fs="${step}"]`);
    if(!node) return;
    node.classList.remove('active','done','skip','pending');
    node.classList.add(state);
    if(window._partFlowState) window._partFlowState[step] = state;
  }
  function renderQueryChips(queries, hitSet){
    if(!queries || !queries.length) return '';
    return '<div class="ai-agent-queries">' + queries.map(q=>{
      const hit = hitSet.has(q);
      return `<span class="ai-agent-query-chip ${hit?'hit':''}">${esc(q)}${hit?' ✓':''}</span>`;
    }).join('') + '</div>';
  }

  function handleAiEvent(ev){
    const ph = ev.phase;
    // ============ 智能体工作流模式事件 ============
    if(aiMode==='agent' && aiSubmode==='agent_workflow'){
      // 思考过程事件：仅调试模式显示（工具循环中模型的 content/reasoning）
      if(ph === 'thinking'){
        const dbgCb = document.getElementById('aiDebugCheckbox');
        if(!dbgCb || !dbgCb.checked) return;
        if(typeof out !== 'undefined' && out){
          let thinkWrap = document.getElementById('ai-thinking-wrap');
          if(!thinkWrap){
            thinkWrap = document.createElement('div');
            thinkWrap.id = 'ai-thinking-wrap';
            thinkWrap.style.cssText = 'margin-top:8px;padding:8px 12px;background:var(--panel-2);border-left:3px solid var(--muted);border-radius:4px;font-size:12px;color:var(--muted);max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all';
            const title = document.createElement('div');
            title.style.cssText = 'font-weight:600;color:var(--muted);margin-bottom:4px;font-size:11px';
            title.textContent = '💭 思考过程（调试）';
            thinkWrap.appendChild(title);
            const body = document.createElement('div');
            body.id = 'ai-thinking-body';
            thinkWrap.appendChild(body);
            out.appendChild(thinkWrap);
          }
          const body = document.getElementById('ai-thinking-body');
          if(body){
            const kind = ev.kind || 'content';
            const delta = ev.delta || '';
            if(kind === 'reasoning'){
              const span = document.createElement('span');
              span.style.cssText = 'font-style:italic;opacity:0.7';
              span.textContent = delta;
              body.appendChild(span);
            }else{
              body.appendChild(document.createTextNode(delta));
            }
            thinkWrap.scrollTop = thinkWrap.scrollHeight;
          }
        }
        return;
      }
      // DSML 伪标签自动恢复事件：仅调试模式显示
      if(ph === 'dsml_recovered'){
        const dbgCb = document.getElementById('aiDebugCheckbox');
        if(!dbgCb || !dbgCb.checked) return;
        if(typeof out !== 'undefined' && out){
          let fbWrap = document.getElementById('ai-feedback-wrap');
          if(!fbWrap){
            fbWrap = document.createElement('div');
            fbWrap.id = 'ai-feedback-wrap';
            fbWrap.style.cssText = 'margin-top:8px;display:flex;flex-direction:column;gap:6px';
            out.appendChild(fbWrap);
          }
          const count = ev.recovered_count || 0;
          const names = (ev.tool_names||[]).join(', ');
          const round = ev.round || 0;
          const card = document.createElement('div');
          card.style.cssText = 'padding:8px 12px;background:linear-gradient(135deg,var(--panel-2),var(--panel-1));border:1px solid var(--crimson);border-radius:6px;font-size:13px';
          card.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
            <span style="color:var(--crimson);font-weight:700">🛠 DSML 自动恢复</span>
            <span style="color:var(--muted);font-size:11px">第${round}轮 · 已解析 ${count} 个工具调用: ${esc(names)}</span>
          </div>
          <div style="color:var(--muted);margin-top:4px;font-size:12px">模型以文本标签输出工具调用，已自动解析为标准 function-calling 执行</div>`;
          fbWrap.appendChild(card);
        }
        return;
      }
      // DSML 强制收尾事件：仅调试模式显示
      if(ph === 'dsml_force_finish'){
        const dbgCb = document.getElementById('aiDebugCheckbox');
        if(!dbgCb || !dbgCb.checked) return;
        if(typeof out !== 'undefined' && out){
          let fbWrap = document.getElementById('ai-feedback-wrap');
          if(!fbWrap){
            fbWrap = document.createElement('div');
            fbWrap.id = 'ai-feedback-wrap';
            fbWrap.style.cssText = 'margin-top:8px;display:flex;flex-direction:column;gap:6px';
            out.appendChild(fbWrap);
          }
          const round = ev.round || 0;
          const wc = ev.warn_count || 0;
          const card = document.createElement('div');
          card.style.cssText = 'padding:8px 12px;background:linear-gradient(135deg,var(--panel-2),var(--panel-1));border:1px solid var(--crimson);border-radius:6px;font-size:13px';
          card.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
            <span style="color:var(--crimson);font-weight:700">⚠ DSML 强制收尾</span>
            <span style="color:var(--muted);font-size:11px">第${round}轮 · 已警告 ${wc} 次仍未纠正，强制进入最终生成</span>
          </div>`;
          fbWrap.appendChild(card);
        }
        return;
      }
      // 上下文压缩事件：仅调试模式显示
      if(ph === 'compress'){
        const dbgCb = document.getElementById('aiDebugCheckbox');
        if(!dbgCb || !dbgCb.checked) return;
        if(typeof out !== 'undefined' && out){
          let fbWrap = document.getElementById('ai-feedback-wrap');
          if(!fbWrap){
            fbWrap = document.createElement('div');
            fbWrap.id = 'ai-feedback-wrap';
            fbWrap.style.cssText = 'margin-top:8px;display:flex;flex-direction:column;gap:6px';
            out.appendChild(fbWrap);
          }
          const card = document.createElement('div');
          card.style.cssText = 'padding:8px 12px;background:linear-gradient(135deg,var(--panel-2),var(--panel-1));border:1px solid var(--gold);border-radius:6px;font-size:13px';
          if(ev.error){
            card.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
              <span style="color:var(--crimson);font-weight:700">⚡ 上下文压缩失败</span>
              <span style="color:var(--muted);font-size:11px">第${ev.round||0}轮</span>
            </div>
            <div style="color:var(--crimson);margin-top:4px;white-space:pre-wrap">${esc(ev.error)}</div>`;
          }else{
            const before = ev.before_tokens || 0;
            const after = ev.after_tokens || 0;
            const saved = ev.saved_tokens || 0;
            const pct = before > 0 ? Math.round(saved * 100 / before) : 0;
            const preview = ev.summary_preview || '';
            card.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
              <span style="color:var(--gold);font-weight:700">⚡ 上下文压缩</span>
              <span style="color:var(--muted);font-size:11px">第${ev.round||0}轮 · ${before}→${after} tokens（省 ${saved}，${pct}%）</span>
            </div>
            ${preview?`<div style="color:var(--text);white-space:pre-wrap;word-break:break-all;line-height:1.6;font-size:12px;max-height:120px;overflow:auto;border-top:1px solid var(--line);padding-top:4px;margin-top:4px">${esc(preview)}${preview.length>=500?'…':''}</div>`:''}`;
          }
          fbWrap.appendChild(card);
        }
        return;
      }
      // 反馈卡片：仅调试模式开启时显示
      if(ph === 'feedback'){
        const dbgCb = document.getElementById('aiDebugCheckbox');
        if(!dbgCb || !dbgCb.checked) return;
        const cat = ev.category || 'other';
        const tool = ev.related_tool || '';
        const sug = ev.suggestion || '';
        const round = ev.round || 0;
        const catLabel = ({new_tool:'新工具建议',tool_param:'工具参数',result_format:'返回格式',result_quality:'结果质量',workflow:'工作流',other:'其他'})[cat] || cat;
        if(typeof out !== 'undefined' && out){
          let fbWrap = document.getElementById('ai-feedback-wrap');
          if(!fbWrap){
            fbWrap = document.createElement('div');
            fbWrap.id = 'ai-feedback-wrap';
            fbWrap.style.cssText = 'margin-top:8px;display:flex;flex-direction:column;gap:6px';
            out.appendChild(fbWrap);
          }
          const card = document.createElement('div');
          card.style.cssText = 'padding:8px 12px;background:linear-gradient(135deg,var(--panel-2),var(--panel-1));border:1px solid var(--gold-2);border-radius:6px;font-size:13px';
          card.innerHTML = `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
              <span style="color:var(--gold-2);font-weight:700">💡 改进建议</span>
              <span style="color:var(--muted);font-size:11px">第${round}轮 · ${esc(catLabel)}</span>
              ${tool?`<span style="color:var(--muted);font-size:11px">· 相关: ${esc(tool)}</span>`:''}
            </div>
            <div style="color:var(--text);white-space:pre-wrap;word-break:break-all;line-height:1.6">${esc(sug)}</div>`;
          fbWrap.appendChild(card);
        }
        return;
      }
      if(ph === 'tool_call'){
        setStepIcon('plan','active');
        const name = ev.name || '';
        const args = ev.arguments || {};
        let argsStr = '';
        if(name === 'list_libraries'){
          argsStr = '（列出所有库）';
        }else if(name === 'list_chunk_titles'){
          argsStr = `库="${esc(args.library||'')}"${args.keyword?' · 关键词="'+esc(args.keyword)+'"':''}`;
        }else if(name === 'get_chunk'){
          argsStr = `库="${esc(args.library||'')}" · chunk="${esc(args.chunk_id||'')}"${args.length?' · '+args.length+'字':''}`;
        }else if(name === 'search'){
          argsStr = `查询="${esc(args.query||'')}" · 模式=${esc(args.mode||'keyword')}${args.libraries&&args.libraries.length?' · 库='+esc(args.libraries.join(',')):''}${args.top_k?' · top_k='+args.top_k:''}`;
        }else if(name === 'finish'){
          argsStr = '（完成检索，开始生成答案）';
        }else if(name === 'feedback'){
          argsStr = `类别=${esc(args.category||'')}${args.related_tool?' · 相关工具='+esc(args.related_tool):''}`;
        }else if(name === 'search_titles'){
          argsStr = `查询="${esc(args.query||'')}"${args.libraries&&args.libraries.length?' · 库='+esc(args.libraries.join(',')):''}${args.top_k?' · top_k='+args.top_k:''}`;
        }
        const detail = document.getElementById('step-plan-detail');
        if(detail){
          if(detail.textContent === '等待 LLM 决策...' || detail.textContent === '等待开始...') detail.innerHTML = '';
          detail.insertAdjacentHTML('beforeend',
            `<div style="margin:3px 0;padding:4px 8px;background:var(--panel-2);border-left:2px solid var(--gold-2)">
              <span style="color:var(--gold-2);font-weight:600">⟐ ${esc(name)}</span>
              <span style="color:var(--muted);margin-left:6px;font-size:12px">${argsStr}</span>
            </div>`);
        }
        if(name === 'finish'){
          setStepIcon('plan','done');
          setStepIcon('gen','active');
          setStepDetail('gen','生成中...');
        }
      }else if(ph === 'tool_result'){
        const result = ev.result || '';
        const preview = result.length > 300 ? esc(result.slice(0,300)) + ' ……' : esc(result);
        const detail = document.getElementById('step-plan-detail');
        if(detail){
          detail.insertAdjacentHTML('beforeend',
            `<div style="margin:2px 0 6px 0;padding:4px 8px;font-size:11px;color:var(--muted);border-left:2px solid var(--muted);background:var(--panel-1);white-space:pre-wrap;word-break:break-all">↳ ${preview}</div>`);
        }
      }else if(ph === 'data_issue_reported'){
        // AI 在检索中发现数据问题并写入质询报告
        const sev = ev.severity || 'info';
        const sevLabel = {info:'提示',warning:'警告',error:'严重'}[sev] || sev;
        const sevColor = sev === 'error' ? 'var(--crimson)' : (sev === 'warning' ? 'var(--gold-2)' : 'var(--muted)');
        toast(`AI 报告数据问题：${ev.issue_type}（${sevLabel}）`, sev === 'error' ? 'error' : 'warn');
        if(typeof out !== 'undefined' && out){
          let issueWrap = document.getElementById('ai-data-issues-wrap');
          if(!issueWrap){
            issueWrap = document.createElement('div');
            issueWrap.id = 'ai-data-issues-wrap';
            issueWrap.style.cssText = 'margin-top:8px;display:flex;flex-direction:column;gap:6px';
            out.appendChild(issueWrap);
          }
          const card = document.createElement('div');
          card.style.cssText = 'padding:8px 12px;background:var(--crimson-soft);border-left:3px solid var(--crimson);border-radius:4px;font-size:13px';
          const chunkIds = (ev.chunk_ids||[]).map(esc).join(', ');
          card.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span style="color:var(--crimson);font-weight:700">⚠ 数据问题报告</span>
            <span style="color:${sevColor};font-size:11px;font-weight:600">${esc(ev.issue_type||'')} · ${esc(sevLabel)}</span>
            ${ev.library?`<span style="color:var(--muted);font-size:11px">· 库: ${esc(ev.library)}</span>`:''}
          </div>
          <div style="color:var(--ink);white-space:pre-wrap;word-break:break-all;line-height:1.6">${esc(ev.description||'')}</div>
          ${chunkIds?`<div style="color:var(--muted);font-size:11px;margin-top:4px">相关 chunk: ${chunkIds}</div>`:''}`;
          issueWrap.appendChild(card);
        }
      }else if(ph === 'subagent_dispatched'){
        // 主智能体派遣子智能体处理 chunk（智能检索页）
        if(typeof out !== 'undefined' && out){
          let saWrap = document.getElementById('ai-subagent-wrap');
          if(!saWrap){
            saWrap = document.createElement('div');
            saWrap.id = 'ai-subagent-wrap';
            saWrap.style.cssText = 'margin-top:8px;display:flex;flex-direction:column;gap:6px';
            out.appendChild(saWrap);
          }
          const card = document.createElement('div');
          card.style.cssText = 'padding:8px 12px;background:var(--brand-soft);border-left:3px solid var(--brand);border-radius:4px;font-size:13px';
          const chunkList = (ev.chunks||[]).map(esc).join('、');
          card.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span style="color:var(--brand);font-weight:700">⟡ 子智能体已派遣</span>
            <span style="color:var(--muted);font-size:11px">已加载 ${ev.loaded_count}/${(ev.chunks||[]).length} 个 chunk · 回答 ${ev.answer_length} 字</span>
          </div>
          <div style="color:var(--ink);font-weight:500;margin-bottom:2px">子任务：${esc(ev.subtask||'')}</div>
          ${chunkList?`<div style="color:var(--muted);font-size:11px">chunk: ${chunkList}</div>`:''}`;
          saWrap.appendChild(card);
        }
      }else if(ph === 'reasoning'){
        setStepDetail('gen','思考中...');
        const rEl = document.getElementById('aiReasoning');
        if(rEl){ rEl.style.display = 'block'; reasoningText += ev.delta || ''; _reasoningRenderTick('aiReasoning', reasoningText); }
      }else if(ph === 'content'){
        setStepIcon('gen','active');
        const aEl = document.getElementById('aiAnswer');
        if(aEl){ aEl.classList.remove('ai-typing'); answerText += ev.delta || ''; _streamRenderTick('aiAnswer', answerText); }
      }else if(ph === 'done'){
        _streamRenderFlush(answerText);
        _reasoningRenderFlush(reasoningText);
        setStepIcon('gen','done');
        setStepDetail('gen','完成');
        streamFinished = true;
      }else if(ph === 'error'){
        streamFinished = true;
        const aEl = document.getElementById('aiAnswer');
        if(aEl){ aEl.classList.remove('ai-typing'); aEl.innerHTML = '<span style="color:var(--crimson)">✗ ' + esc(ev.error||'未知错误') + (ev.stage?'（阶段: '+esc(ev.stage)+'）':'') + '</span>'; }
      }
      return;
    }
    // ============ 分块检索工作流事件 ============
    if(ph === 'partitions'){
      // 分块信息：把 agent 步骤 UI 适配为分块模式
      aiMode = 'agent';  // 确保是 agent 模式
      // 在面板顶部插入流程指示条
      const panel = document.getElementById('aiAgentPanel');
      if(panel && !document.getElementById('partFlowBar')){
        const flowHtml = `<div class="part-flow" id="partFlowBar">
          <div class="part-flow-step active" data-fs="partition">分块</div>
          <span class="part-flow-arrow">→</span>
          <div class="part-flow-step" data-fs="retrieve">检索</div>
          <span class="part-flow-arrow">→</span>
          <div class="part-flow-step" data-fs="summary">合成</div>
        </div>`;
        panel.insertAdjacentHTML('afterbegin', flowHtml);
        window._partFlowState = {partition:'active', retrieve:'pending', summary:'pending'};
      }
      // step-plan → 分块信息
      const planTitle = document.querySelector('#step-plan .step-title');
      if(planTitle) planTitle.textContent = '分块检索';
      setStepIcon('plan','active');
      const parts = ev.partitions || [];
      let html = parts.map(p=>{
        const sizes = (p.partition_sizes||[]).join('/');
        const needPart = p.partition_count > 1;
        return `<div>${esc(p.library)}：${p.total_chunks} chunk → ${needPart?`${p.partition_count}块（${sizes}）`:'不分块'}</div>`;
      }).join('');
      setStepDetail('plan', html);
      setStepIcon('plan','done');
      _setPartFlow('partition','done');
      _setPartFlow('retrieve','active');
      setStepIcon('search','active');
      const searchTitle = document.querySelector('#step-search .step-title');
      if(searchTitle) searchTitle.textContent = '各块检索智能体';
      // 初始化分块回答累积区
      window._partitionAnswers = [];
    }else if(ph === 'block_answer'){
      // 各块检索智能体的回答
      const blockId = ev.block_id || '';
      const lib = ev.library || '';
      const answer = ev.answer || '';
      const irrelevant = ev.irrelevant;
      const hits = ev.hits || 0;
      const elapsed = ev.elapsed_ms || 0;
      const tag = irrelevant ? '<span style="color:var(--muted)">（不相干）</span>' : '';
      const entry = `<div style="padding:4px 0;border-bottom:1px dashed var(--line)">
        <div><strong>${esc(blockId)}</strong> ${tag} <span class="hint">${hits}命中 ${elapsed}ms</span></div>
        <div style="font-size:12px;color:var(--ink-2);white-space:pre-wrap">${esc(answer)}</div>
      </div>`;
      window._partitionAnswers.push(entry);
      setStepDetail('search', window._partitionAnswers.join(''));
    }else if(ph === 'retrieval' && window._partitionAnswers){
      // 分块模式的 retrieval 事件（检索汇总）
      setStepIcon('search','done');
      _setPartFlow('retrieve','done');
      setStepIcon('eval','active');
      const evalTitle = document.querySelector('#step-eval .step-title');
      if(evalTitle) evalTitle.textContent = '总结合成';
      const r = ev.retrieval || {};
      setStepDetail('eval',
        `<div>共 ${r.total_blocks||0} 块，相关 ${r.relevant_blocks||0} 块，不相干 ${r.irrelevant_blocks||0} 块</div>`);
      // 质询模式已移除：直接进入合成阶段
      _setPartFlow('summary','active');
    }else if(ph === 'generating' && window._partitionAnswers){
      // 分块模式的 generating 事件
      setStepIcon('eval','done');
      _setPartFlow('summary','active');
      setStepIcon('gen','active');
      setStepDetail('gen','<div>总结智能体流式生成中...</div>');
    }else if(ph === 'reasoning' && window._partitionAnswers){
      // 分块模式的 reasoning 事件
      setStepDetail('gen','<div>总结智能体思考中...</div>');
      reasoningEl = document.getElementById('aiReasoning');
      reasoningEl.style.display = 'block';
      reasoningText += ev.delta || '';
      reasoningEl.textContent = reasoningText;
    }else if(ph === 'content' && window._partitionAnswers){
      // 分块模式的 content 事件（流式追加 + 节流渲染）
      answerEl = document.getElementById('aiAnswer');
      answerEl.classList.remove('empty');
      answerText += ev.delta || '';
      _streamRenderTick('aiAnswer', answerText);
    }else if(ph === 'done' && window._partitionAnswers){
      // 分块模式的 done 事件
      _streamRenderFlush(answerText);
      setStepIcon('gen','done');
      _setPartFlow('summary','done');
      setStepDetail('gen','<div>生成完成</div>');
      streamFinished = true;
    }else
    // ============ Agent 阶段事件 ============
    if(ph === 'plan'){
      setStepIcon('plan','active');
      const queries = ev.queries || [];
      agentState.queries = queries;
      const rationale = ev.rationale ? esc(ev.rationale) : '';
      const semanticTag = ev.semantic_mode ? '<span style="color:var(--gold-2);font-size:11px;margin-left:6px">[语义检索]</span>' : '';
      // 显示 title_filter 信息（朝代/文献限定）
      let tfTag = '';
      if(ev.title_filter){
        const tf = ev.title_filter;
        let tfParts = [];
        if(tf.contains) tfParts.push(`含: ${tf.contains.join(' / ')}`);
        if(tf.contains_all) tfParts.push(`同时含: ${tf.contains_all.join(' + ')}`);
        if(tf.excludes) tfParts.push(`排除: ${tf.excludes.join(' / ')}`);
        if(tfParts.length){
          tfTag = `<div style="color:var(--gold-2);margin-bottom:4px;font-size:11px">🏷 标题过滤：${tfParts.join(' · ')}</div>`;
        }
      }
      setStepDetail('plan',
        tfTag +
        (rationale ? `<div style="margin-bottom:4px">${rationale}${semanticTag}</div>` : (semanticTag ? `<div>${semanticTag}</div>` : '')) +
        renderQueryChips(queries, agentState.hitQueries));
    }else if(ph === 'semantic_plan' || ph === 'semantic_searching' || ph === 'semantic_round_done' || ph === 'semantic_done'){
      // 语义检索事件：在 plan 步骤展示同义词组规划（含 must/should 标记、多轮累积）
      setStepIcon('plan','active');
      if(ph === 'semantic_plan'){
        const groups = ev.groups || [];
        const round = ev.round || 1;
        const shouldContinue = ev.should_continue;
        const rationale = ev.rationale ? `<div style="margin-bottom:4px;color:var(--muted);font-size:12px">${esc(ev.rationale)}</div>` : '';
        // 兼容旧格式（g 为字符串数组）和新格式（g 为 {words, required, label}）
        const groupsHtml = groups.map((g,i)=>{
          let words, required, label;
          if(Array.isArray(g)){ words = g; required = false; label = ''; }
          else { words = g.words || []; required = !!g.required; label = g.label || ''; }
          const tag = required
            ? '<span style="color:var(--crimson);font-size:10px;border:1px solid var(--crimson);padding:0 4px;border-radius:3px;margin-right:4px">必需</span>'
            : '<span style="color:var(--muted);font-size:10px;border:1px solid var(--muted);padding:0 4px;border-radius:3px;margin-right:4px">加分</span>';
          const labelStr = label ? `<span style="color:var(--muted);font-size:10px;margin-right:4px">${esc(label)}</span>` : '';
          const inner = words.map(s=>`<span class="word-tag" style="margin:0 2px;background:var(--gold-soft);color:var(--gold-2)">${esc(s)}</span>`).join('');
          return `<div style="margin:3px 0;padding:3px 6px;background:var(--panel-2);border-left:2px solid ${required?'var(--crimson)':'var(--muted)'}">${tag}${labelStr}${inner}</div>`;
        }).join('');
        const contTag = shouldContinue === false
          ? '<span style="color:var(--muted);font-size:11px;margin-left:6px">[LLM 建议结束]</span>'
          : (round >= 2 ? '<span style="color:var(--jade);font-size:11px;margin-left:6px">[继续检索]</span>' : '');
        setStepDetail('plan',
          `<div style="color:var(--gold-2);font-weight:600">语义检索 · 第 ${round} 轮规划${contTag}</div>` +
          rationale + groupsHtml);
      }else if(ph === 'semantic_searching'){
        const round = ev.round || 1;
        const cooccur = ev.cooccur_max || 0;
        const newHits = ev.new_hits || 0;
        const filtered = ev.filtered_by_required || 0;
        const reqRate = ev.required_hit_rate || 0;
        const filterStr = filtered > 0
          ? `<span style="color:var(--muted);margin-left:6px">必需组过滤 ${filtered} 条</span>` : '';
        const reqStr = reqRate > 0
          ? `<span style="color:var(--muted);margin-left:6px">必需命中率 ${Math.round(reqRate*100)}%</span>` : '';
        setStepDetail('plan',
          `<div>语义检索第 ${round} 轮完成：命中 ${ev.total_hits||0} 条，新增 ${newHits} 条，should共现 ${cooccur} 组${filterStr}${reqStr}</div>`);
      }else if(ph === 'semantic_round_done'){
        const round = ev.round || 1;
        const skipped = ev.skipped ? `（跳过：${esc(ev.reason||'与上轮相同')}）` : '';
        const reason = ev.reason ? `<span style="color:var(--muted);margin-left:6px">${esc(ev.reason)}</span>` : '';
        setStepDetail('plan',
          `<div>第 ${round} 轮结束${skipped}：累计去重 ${ev.total_unique||0} 条，should共现 ${ev.cooccur_max||0} 组${reason}</div>`);
      }else if(ph === 'semantic_done'){
        setStepIcon('plan','done');
        const rounds = ev.rounds || 0;
        setStepDetail('plan',
          `<div style="color:var(--jade)">语义检索完成：共 ${rounds} 轮，累计 ${ev.total_unique||0} 条</div>`);
      }
    }else if(ph === 'round_start'){
      // 第一轮开始时把 plan 标记为 done，search 标记为 active
      if(ev.round === 1){
        setStepIcon('plan','done');
        setStepIcon('search','active');
      }
      agentState.round = ev.round;
      const qs = ev.queries || [];
      const usedLine = agentState.usedQueries.length
        ? `<div>已用查询词：${esc(agentState.usedQueries.join('、'))}</div>` : '';
      setStepDetail('search',
        `<div>第 ${ev.round} 轮检索</div>` + usedLine + renderQueryChips(qs, agentState.hitQueries));
    }else if(ph === 'searching'){
      const q = ev.query || '';
      if(ev.error){
        setStepDetail('search', `<div style="color:var(--crimson)">查询「${esc(q)}」失败：${esc(ev.error)}</div>`);
      }else{
        if(q && !agentState.usedQueries.includes(q)) agentState.usedQueries.push(q);
        if((ev.new_hits||0) > 0) agentState.hitQueries.add(q);
        const repeat = ev.repeat_hits || 0;
        const repeatTag = repeat > 0 ? `，重复 ${repeat} 条` : '';
        setStepDetail('search',
          `<div>第 ${ev.round||agentState.round} 轮 · 查询「<strong>${esc(q)}</strong>」：命中 ${ev.total_hits||0} 条，新增 ${ev.new_hits||0} 条${repeatTag}</div>` +
          renderQueryChips(agentState.queries, agentState.hitQueries));
      }
    }else if(ph === 'vector_recall'){
      // 向量召回事件：暂存状态，待 retrieval 事件时一并展示
      agentState.vectorRecall = ev;
    }else if(ph === 'retrieval'){
      // 直接模式与 Agent 模式共用：渲染检索统计 + 引用列表
      if(aiMode==='agent'){
        // Agent retrieval 事件结构略有不同（无 retrieval 子对象，用 references/total_unique）
        const refs = ev.references || [];
        const totalUnique = ev.total_unique || 0;
        const usedQ = ev.used_queries || agentState.usedQueries;
        let summary = `<div>第 ${ev.round} 轮结束 · 累计去重 ${totalUnique} 条 · 引用 ${refs.length} 条</div>`;
        // 追加向量召回状态
        const vr = agentState.vectorRecall;
        if(vr){
          if(vr.available){
            summary += `<div style="color:var(--gold-2);margin-top:2px">向量召回：新增 ${vr.new_hits||0} 条，共 ${vr.total_hits||0} 条（双通道命中优先）</div>`;
          }else if(vr.reason){
            summary += `<div style="color:var(--muted);margin-top:2px">向量召回未生效：${esc(vr.reason)}</div>`;
          }
          agentState.vectorRecall = null;
        }
        setStepDetail('search', summary + renderQueryChips(usedQ, agentState.hitQueries));
      }
      renderRetrievalAndRefs(ev);
    }else if(ph === 'evaluating'){
      if(aiMode==='agent'){
        setStepIcon('search','done');
        setStepIcon('eval','active');
        setStepDetail('eval','<div>正在评估资料是否足够回答...</div>');
      }
    }else if(ph === 'evaluated'){
      if(aiMode==='agent'){
        const ev_ = ev.evaluation || {};
        const ok = !!ev_.sufficient;
        const cls = ok ? 'ok' : 'no';
        const icon = ok ? '✓' : '✗';
        const conf = (ev_.confidence != null) ? `（置信度 ${(ev_.confidence*100).toFixed(0)}%）` : '';
        let html = `<div class="ai-agent-eval ${cls}">${icon} ${ok?'资料足够，开始生成答案':'资料不足'}${conf}</div>`;
        if(!ok && ev_.missing_aspect){
          html += `<div class="ai-agent-eval no">缺失：${esc(ev_.missing_aspect)}</div>`;
        }
        if(!ok && ev_.next_queries && ev_.next_queries.length){
          html += '<div class="ai-agent-queries" style="margin-top:4px"><span class="hint">下一轮查询词：</span>'
                + ev_.next_queries.map(q=>`<span class="ai-agent-query-chip">${esc(q)}</span>`).join('')
                + '</div>';
        }
        setStepDetail('eval', html);
        if(ok){
          setStepIcon('eval','done');
        }
      }
    }else if(ph === 'generating'){
      if(aiMode==='agent'){
        setStepIcon('eval','done');
        setStepIcon('gen','active');
        setStepDetail('gen','<div>DeepSeek 流式生成中...</div>');
      }
    }else if(ph === 'reasoning'){
      if(aiMode==='agent') setStepDetail('gen','<div>思考中...</div>');
      reasoningEl = document.getElementById('aiReasoning');
      reasoningEl.style.display = 'block';
      reasoningText += ev.delta || '';
      reasoningEl.textContent = reasoningText;
    }else if(ph === 'content'){
      answerEl = document.getElementById('aiAnswer');
      answerEl.classList.remove('empty');
      answerText += ev.delta || '';
      _streamRenderTick('aiAnswer', answerText);
    }else if(ph === 'refs_update'){
      // 流结束后端按答案中实际 [n] 引用过滤后的引用列表，覆盖之前渲染的全部引用
      const refs = ev.references || [];
      const refsEl = document.getElementById('aiRefs');
      if(refsEl){
        if(refs.length){
          refsEl.innerHTML = refs.map(ref=>{
            const fp = ref.source_file_path || '';
            const dispFile = ref.heading ? `${esc(ref.source_file||'未知')} · ${esc(ref.heading)}` : esc(ref.source_file||'未知');
            return `
            <div class="ai-ref" id="airef-${ref.chunk_id.replace(/\//g,'_')}">
              <div class="ai-ref-idx">[${ref.index}]</div>
              <div class="ai-ref-body">
                <div class="ai-ref-file">${dispFile}</div>
                <div class="ai-ref-meta">${esc(ref.library)} · ${ref.hit_count} 处命中 · ${esc(ref.chunk_id)}</div>
                ${renderChunkMetadata(ref.metadata)}
                ${ref.snippet ? '<div class="ai-ref-snippet">'+esc(ref.snippet)+'</div>' : ''}
                <div class="result-actions">
                  <button class="btn-trace" onclick="toggleAiRefText('${esc(ref.library)}','${esc(ref.chunk_id)}',this,${esc(JSON.stringify(ref.matched_words||[]))})">展开原文</button>
                  ${fp?`<button class="btn-trace" onclick="previewRefFile(${esc(JSON.stringify(fp))},${esc(JSON.stringify(ref.library))})">预览源文件</button>`:''}
                  ${fp?`<button class="btn-trace" onclick="openDoc('${encodeURIComponent(fp)}','${encodeURIComponent(ref.library)}')">下载文档</button>`:''}
                </div>
                <div class="chunk-fulltext" style="display:none"></div>
              </div>
            </div>`;
          }).join('');
        }else{
          refsEl.innerHTML = '';
          const wrap = document.getElementById('aiRefsWrap');
          if(wrap) wrap.style.display = 'none';
        }
      }
    }else if(ph === 'done'){
      _streamRenderFlush(answerText);
      // 主动结束流，不依赖服务器关闭连接
      if(aiMode==='agent'){
        setStepIcon('gen','done');
        setStepDetail('gen','<div>生成完成</div>');
      }
      streamFinished = true;
    }else if(ph === 'error'){
      streamFinished = true;
      if(aiMode==='agent'){
        const stage = ev.stage || '';
        const stepMap = {retrieval:'search', agent:'search', generation:'gen'};
        const sid = stepMap[stage] || 'gen';
        setStepIcon(sid,'active');
        setStepDetail(sid, `<div style="color:var(--crimson)">✗ ${esc(ev.error||'未知错误')}</div>`);
      }
      answerEl = document.getElementById('aiAnswer');
      answerEl.classList.remove('ai-typing');
      answerEl.innerHTML = '<span style="color:var(--crimson)">✗ ' + esc(ev.error||'未知错误') + '</span>';
    }
  }

  // ============ 检索结果 + 引用渲染（直接模式 & Agent 共用） ============
  function renderRetrievalAndRefs(ev){
    const r = ev.retrieval || {};
    const refs = ev.references || [];
    const retEl = document.getElementById('aiRetrieval');
    retEl.style.display = 'block';
    // 兼容两种事件结构
    const totalHits = r.total_hits != null ? r.total_hits : (ev.total_unique || 0);
    const usedHits = r.used_hits != null ? r.used_hits : refs.length;
    const libStats = (r.searched_libraries||[]).map(l=>`${esc(l.name)}:${l.hits}`).join(' · ') || '';
    const roundTag = aiMode==='agent' && ev.round ? `第 ${ev.round} 轮 · ` : '';
    retEl.innerHTML = `
      <div class="ai-retrieval-h">${roundTag}检索阶段</div>
      <div class="ai-retrieval-stats">
        <div class="ai-retrieval-stat"><span class="n">${totalHits}</span><span class="l">${aiMode==='agent'?'累计去重':'总命中'}</span></div>
        <div class="ai-retrieval-stat"><span class="n">${usedHits}</span><span class="l">引用数</span></div>
        ${libStats ? `<div class="ai-retrieval-stat" style="min-width:200px"><span class="n" style="font-size:12px;font-family:var(--mono)">${libStats}</span><span class="l">各库命中</span></div>` : ''}
      </div>`;
    // 渲染引用（每次 retrieval 事件都覆盖更新，确保展示最新一轮的 top 结果）
    if(refs.length){
      const wrap = document.getElementById('aiRefsWrap');
      wrap.style.display = 'block';
      document.getElementById('aiRefs').innerHTML = refs.map(ref=>{
        const fp = ref.source_file_path || '';
        const dispFile = ref.heading ? `${esc(ref.source_file||'未知')} · ${esc(ref.heading)}` : esc(ref.source_file||'未知');
        const mq = ref.matched_queries || [];
        const mqTag = mq.length ? `<span class="ai-agent-query-chip hit" style="margin-left:6px">命中 ${mq.length} 个查询</span>` : '';
        return `
        <div class="ai-ref" id="airef-${ref.chunk_id.replace(/\//g,'_')}">
          <div class="ai-ref-idx">[${ref.index}]</div>
          <div class="ai-ref-body">
            <div class="ai-ref-file">${dispFile}${mqTag}</div>
            <div class="ai-ref-meta">${esc(ref.library)} · ${ref.hit_count} 处命中 · ${esc(ref.chunk_id)}</div>
            ${ref.snippet ? '<div class="ai-ref-snippet">'+esc(ref.snippet)+'</div>' : ''}
            <div class="result-actions">
              <button class="btn-trace" onclick="toggleAiRefText('${esc(ref.library)}','${esc(ref.chunk_id)}',this,${esc(JSON.stringify(ref.matched_words||[]))})">展开原文</button>
              ${fp?`<button class="btn-trace" onclick="previewRefFile(${esc(JSON.stringify(fp))},${esc(JSON.stringify(ref.library))})">预览源文件</button>`:''}
              ${fp?`<button class="btn-trace" onclick="openDoc('${encodeURIComponent(fp)}','${encodeURIComponent(ref.library)}')">下载文档</button>`:''}
              ${fp?`<button class="btn-trace" onclick="copyChunkSnippet('${esc(ref.library)}','${esc(ref.chunk_id)}',this)">复制片段</button>`:''}
            </div>
            <div class="chunk-fulltext" style="display:none"></div>
          </div>
        </div>`;
      }).join('');
    }
  }
}

// ============ 溯源：展开原文 + 下载文档 + 复制片段 ============
let _chunkTextCache = {};  // key: library|chunk_id -> text

async function fetchChunkText(library, chunkId){
  const key = library + '|' + chunkId;
  if(_chunkTextCache[key]) return _chunkTextCache[key];
  try{
    const params = new URLSearchParams({library, chunk_id: chunkId});
    const d = await api('GET', '/api/chunk?' + params.toString());
    _chunkTextCache[key] = d;
    return d;
  }catch(e){
    toast('读取原文失败: '+e.message,'error');
    return null;
  }
}

async function toggleChunkText(library, chunkId, btn, words, subText){
  const resultEl = btn.closest('.result');
  const ftEl = resultEl.querySelector('.chunk-fulltext');
  if(ftEl.style.display === 'block'){
    ftEl.style.display = 'none';
    btn.textContent = '展开原文';
    return;
  }
  btn.textContent = '加载中...';
  const d = await fetchChunkText(library, chunkId);
  if(!d){ btn.textContent = '展开原文'; return; }
  const meta = `<div class="ft-meta">${esc(d.chunk_id)} · ${fmt(d.text_length)} 字${d.heading?' · '+esc(d.heading):''} · ${esc(d.source && d.source.file_path || '')}</div>`;
  const text = d.text || '';
  // 优先用 highlightWithSubtext：既高亮关键词，又给向量命中子片段加下划线
  const body = subText
    ? highlightWithSubtext(text, words, lastColorMap, subText)
    : ((words && words.length) ? highlight(text, words, lastColorMap) : esc(text));
  ftEl.innerHTML = meta + body;
  ftEl.style.display = 'block';
  btn.textContent = '收起原文';
}

async function toggleAiRefText(library, chunkId, btn, words){
  const refEl = btn.closest('.ai-ref');
  const ftEl = refEl.querySelector('.chunk-fulltext');
  if(ftEl.style.display === 'block'){
    ftEl.style.display = 'none';
    btn.textContent = '展开原文';
    return;
  }
  btn.textContent = '加载中...';
  const d = await fetchChunkText(library, chunkId);
  if(!d){ btn.textContent = '展开原文'; return; }
  const meta = `<div class="ft-meta">${esc(d.chunk_id)} · ${fmt(d.text_length)} 字${d.heading?' · '+esc(d.heading):''} · ${esc(d.source && d.source.file_path || '')}</div>`;
  const text = d.text || '';
  const body = (words && words.length) ? highlight(text, words) : esc(text);
  ftEl.innerHTML = meta + body;
  ftEl.style.display = 'block';
  btn.textContent = '收起原文';
}

async function openDoc(filePath, library){
  // 服务器-客户端模式下改为下载文件到客户端浏览器
  try{
    // 参数经 encodeURIComponent 编码（避免反斜杠在 JS 字符串中被转义），此处解码还原
    filePath = decodeURIComponent(filePath);
    if(library) library = decodeURIComponent(library);
    const params = new URLSearchParams();
    params.set('file_path', filePath);
    if(library) params.set('library', library);
    const resp = await fetch('/api/download?' + params.toString());
    if(!resp.ok){
      let msg = '下载失败 (' + resp.status + ')';
      try{ const j = await resp.json(); if(j.error) msg = j.error; }catch(_){}
      toast(msg,'error');
      return;
    }
    // 从响应头提取文件名，回退到路径 basename
    const cd = resp.headers.get('Content-Disposition') || '';
    let fname = '';
    const mStar = cd.match(/filename\*=UTF-8''([^;]+)/i);
    if(mStar){ try{ fname = decodeURIComponent(mStar[1]); }catch(_){ fname = mStar[1]; } }
    if(!fname){
      const mPlain = cd.match(/filename="([^"]+)"/i);
      if(mPlain) fname = mPlain[1];
    }
    if(!fname){
      fname = filePath.replace(/[\\\/]/,'/').split('/').pop() || 'download';
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('已下载: ' + fname,'success');
  }catch(e){
    toast('下载文档失败: '+e.message,'error');
  }
}

async function copyChunkSnippet(library, chunkId, btn){
  const d = await fetchChunkText(library, chunkId);
  if(!d) return;
  const text = d.text || '';
  try{
    await navigator.clipboard.writeText(text);
    const orig = btn.textContent;
    btn.textContent = '已复制 ✓';
    toast(`已复制 ${text.length} 字到剪贴板，可在 Word 中 Ctrl+F 粘贴搜索`,'success');
    setTimeout(()=>{ btn.textContent = orig; }, 2000);
  }catch(e){
    // 降级：用临时 textarea
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{
      document.execCommand('copy');
      toast(`已复制 ${text.length} 字到剪贴板`,'success');
    }catch(err){
      toast('复制失败: '+err.message,'error');
    }
    document.body.removeChild(ta);
  }
}

  try{
    await api('GET','/api/libraries');
    setServiceStatus(true);
  }catch(e){ setServiceStatus(false); }
}
setInterval(checkServiceHealth, 15000);
