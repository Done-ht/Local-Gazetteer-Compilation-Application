<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全文检索系统 · 档案库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1d23; --ink-2:#252932; --ink-3:#2f343f;
  --paper:#faf7f0; --paper-2:#f3eee2; --paper-3:#e8e0cc;
  --gold:#c9a961; --gold-2:#a8893f; --gold-soft:rgba(201,169,97,.15);
  --crimson:#8b2c2c; --crimson-soft:rgba(139,44,44,.12);
  --jade:#3d6b54; --jade-soft:rgba(61,107,84,.12);
  --muted:#8a7e6a; --line:rgba(26,29,35,.12); --line-dark:rgba(250,247,240,.12);
  --serif:'Noto Serif SC',Georgia,serif;
  --sans:'Noto Sans SC',system-ui,sans-serif;
  --mono:'JetBrains Mono',Consolas,monospace;
  /* 关键词彩色高亮调色板（8 种，古纸风格协调色，色相差异大）
     每种含前景色（文字）和背景色（高亮底） */
  --hl-1-fg:#a8893f; --hl-1-bg:rgba(201,169,97,.18);   /* 金 */
  --hl-2-fg:#3d6b54; --hl-2-bg:rgba(61,107,84,.16);    /* 玉绿 */
  --hl-3-fg:#8b2c2c; --hl-3-bg:rgba(139,44,44,.14);    /* 朱红 */
  --hl-4-fg:#2d5a8a; --hl-4-bg:rgba(45,90,138,.14);    /* 靛蓝 */
  --hl-5-fg:#7a4a8a; --hl-5-bg:rgba(122,74,138,.14);   /* 紫 */
  --hl-6-fg:#b85c2e; --hl-6-bg:rgba(184,92,46,.14);    /* 赭橙 */
  --hl-7-fg:#1f6b6b; --hl-7-bg:rgba(31,107,107,.14);   /* 青 */
  --hl-8-fg:#6b4a2d; --hl-8-bg:rgba(107,74,45,.16);    /* 褐 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);overflow:hidden;
  -webkit-font-smoothing:antialiased}

/* 纹理背景 */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;
  background-image:radial-gradient(circle at 20% 30%,rgba(201,169,97,.06) 0,transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(139,44,44,.04) 0,transparent 40%)}

.app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:64px 1fr;
  grid-template-areas:"head head" "side main";height:100vh;position:relative;z-index:1}

/* 顶部栏 */
header{grid-area:head;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;padding:0 28px;gap:16px;
  border-bottom:2px solid var(--gold);position:relative}
header::after{content:"";position:absolute;bottom:-2px;left:0;width:120px;height:2px;
  background:var(--crimson)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:32px;height:32px;border:1.5px solid var(--gold);border-radius:50%;
  display:grid;place-items:center;font-family:var(--serif);font-weight:900;
  color:var(--gold);font-size:18px}
.brand-title{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:2px}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:1px}
.head-spacer{flex:1}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--jade);
  box-shadow:0 0 8px var(--jade);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.status-text{font-size:12px;color:var(--muted);font-family:var(--mono)}

/* 侧边栏 */
aside{grid-area:side;background:var(--ink-2);color:var(--paper);
  border-right:1px solid var(--line-dark);display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:20px 22px 14px;border-bottom:1px solid var(--line-dark);
  display:flex;justify-content:space-between;align-items:center}
.side-title{font-family:var(--serif);font-size:14px;letter-spacing:2px;color:var(--gold)}
.side-count{font-family:var(--mono);font-size:11px;color:var(--muted);
  background:var(--ink-3);padding:2px 8px;border-radius:10px}
.lib-list{flex:1;overflow-y:auto;padding:10px 0}
.lib-list::-webkit-scrollbar{width:6px}
.lib-list::-webkit-scrollbar-thumb{background:var(--ink-3);border-radius:3px}
.lib-item{padding:12px 22px;cursor:pointer;border-left:3px solid transparent;
  transition:all .2s;display:flex;flex-direction:column;gap:3px}
.lib-item:hover{background:var(--ink-3)}
.lib-item.active{background:var(--ink-3);border-left-color:var(--gold)}
.lib-item.dragging{opacity:.4}
.lib-item.drop-into{background:var(--gold-soft);border-left-color:var(--gold)}
/* 文件夹分组 */
.folder-group{margin:2px 0}
.folder-head{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 12px;
  cursor:pointer;user-select:none;border-left:3px solid transparent;transition:all .15s}
.folder-head:hover{background:var(--ink-3)}
.folder-head.drop-target{background:var(--gold-soft);border-left-color:var(--gold)}
.folder-toggle{display:inline-flex;align-items:center;justify-content:center;
  width:14px;height:14px;color:var(--muted);font-size:10px;transition:transform .2s;flex-shrink:0}
.folder-head.collapsed .folder-toggle{transform:rotate(-90deg)}
.folder-icon{color:var(--gold-2);font-size:14px;flex-shrink:0}
.folder-name{font-family:var(--serif);font-size:13px;letter-spacing:1px;color:var(--paper);
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-count{font-family:var(--mono);font-size:10px;color:var(--muted);
  background:var(--ink-3);padding:1px 6px;border-radius:8px;flex-shrink:0}
.folder-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s;flex-shrink:0}
.folder-head:hover .folder-actions{opacity:1}
.folder-body{padding-left:6px}
.folder-group.collapsed .folder-body{display:none}
.folder-act{background:transparent;border:1px solid var(--line-dark);color:var(--muted);
  padding:1px 6px;border-radius:3px;font-size:10px;cursor:pointer;transition:all .15s}
.folder-act:hover{color:var(--gold);border-color:var(--gold)}
.folder-act.danger:hover{color:var(--crimson);border-color:var(--crimson)}
/* 库树搜索框 */
.lib-search-wrap{padding:6px 8px;border-bottom:1px solid var(--line-dark)}
.lib-search-wrap input{
  width:100%;box-sizing:border-box;padding:6px 10px;border-radius:6px;
  border:1px solid var(--line-dark);background:var(--ink);color:var(--paper);
  font-size:12px}
.lib-search-wrap input:focus{outline:none;border-color:var(--gold-2)}
.lib-tree{max-height:calc(100vh - 220px);overflow-y:auto}
.lib-tree::-webkit-scrollbar{width:6px}
.lib-tree::-webkit-scrollbar-thumb{background:var(--ink-3);border-radius:3px}
.folder-check{display:inline-block;width:16px;text-align:center;cursor:pointer;
  font-size:14px;user-select:none;color:var(--paper);flex-shrink:0}
.folder-check:hover{color:var(--gold-2)}
/* 树形 chip（检索/AI 页文件夹全选） */
.chip-folder{background:var(--gold-soft);font-size:11px;cursor:pointer;
  border-color:var(--gold-2);user-select:none}
.chip-folder:hover{background:rgba(201,169,97,.25)}
.chip-folder.partial{background:rgba(201,169,97,.3)}
.chip-folder.active{background:var(--gold-2);color:var(--paper);border-color:var(--gold-2)}
.chip-group-label{font-size:10px;color:var(--muted);margin:0 4px;
  font-family:var(--serif);letter-spacing:1px;flex-shrink:0;user-select:none}
/* 根级区域（拖出文件夹后的放置点） */
.root-drop{height:6px;margin:0 12px;border-radius:3px;transition:all .15s}
.root-drop.drop-target{background:var(--gold-soft);height:24px}
.root-drop.drop-target::after{content:'移到根级';display:block;text-align:center;
  font-size:10px;color:var(--gold);line-height:24px}
.side-actions{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--line-dark)}
.side-actions .btn-new{flex:1}
.lib-name{font-weight:500;font-size:14px;color:var(--paper)}
.lib-note{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.lib-meta{font-family:var(--mono);font-size:10px;color:var(--gold-2);margin-top:2px}
.lib-actions{display:flex;gap:6px;margin-top:4px;opacity:0;transition:opacity .2s}
.lib-item:hover .lib-actions{opacity:1}
/* 迁移按钮：常显（不依赖悬停），登录用户对公共库可见 */
.lib-clone-btn{display:inline-block;margin-top:5px;padding:3px 10px;font-size:11.5px;
  background:linear-gradient(135deg,var(--crimson),var(--gold-2));color:#fff;border:none;
  border-radius:12px;cursor:pointer;font-family:var(--sans);font-weight:600;
  box-shadow:0 1px 4px rgba(0,0,0,.25);transition:all .15s;letter-spacing:.5px}
.lib-clone-btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.lib-clone-btn:active{transform:translateY(0)}
.lib-migrate-tip{margin:2px 6px 10px;padding:8px 10px;font-size:11px;line-height:1.7;
  background:rgba(201,165,95,.12);border:1px dashed rgba(201,165,95,.45);border-radius:6px;
  color:rgba(250,247,240,.88);display:none}
.lib-migrate-tip b{color:var(--gold)}
.lib-act{background:transparent;border:1px solid var(--line-dark);color:var(--muted);
  padding:2px 8px;border-radius:3px;font-size:10px;cursor:pointer;transition:all .15s}
.lib-act:hover{color:var(--gold);border-color:var(--gold)}
.lib-act.danger:hover{color:var(--crimson);border-color:var(--crimson)}
.side-foot{padding:14px 22px;border-top:1px solid var(--line-dark)}
.btn-new{width:100%;padding:10px;background:transparent;border:1px dashed var(--gold-2);
  color:var(--gold);font-family:var(--serif);font-size:13px;letter-spacing:1px;
  cursor:pointer;transition:all .2s;border-radius:4px}
.btn-new:hover{background:var(--gold-soft);border-style:solid}

/* 主区 */
main{grid-area:main;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--paper-2);padding:0 24px}
.tab{padding:14px 22px;cursor:pointer;font-family:var(--serif);font-size:14px;
  font-weight:500;color:var(--muted);border-bottom:2px solid transparent;
  transition:all .2s;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--gold)}
.tab-icon{width:16px;height:16px;opacity:.7}
.content{flex:1;overflow-y:auto;padding:28px 32px}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-thumb{background:var(--paper-3);border-radius:4px}

/* 通用 */
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;
  padding:20px 24px;margin-bottom:16px;transition:box-shadow .2s}
.card:hover{box-shadow:0 2px 12px rgba(26,29,35,.06)}
.section-h{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink);
  margin-bottom:16px;display:flex;align-items:center;gap:10px}
.section-h::before{content:"";width:4px;height:18px;background:var(--gold);border-radius:2px}
.hint{font-size:12px;color:var(--muted);font-family:var(--mono)}
input[type=text],input[type=number],select,textarea{
  font-family:var(--sans);font-size:14px;padding:10px 14px;background:var(--paper);
  border:1px solid var(--line);border-radius:5px;color:var(--ink);outline:none;
  transition:border .2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=checkbox]{accent-color:var(--gold)}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.btn{padding:10px 22px;border:none;border-radius:5px;font-family:var(--serif);
  font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;letter-spacing:1px}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{background:var(--ink-3);transform:translateY(-1px)}
.btn-secondary{background:var(--paper);color:var(--gold-2);border:1px solid var(--gold-2)}
.btn-secondary:hover{background:var(--gold-soft);transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:var(--gold-2);color:var(--paper)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-2)}
.btn-danger{background:transparent;border:1px solid var(--crimson);color:var(--crimson)}
.btn-danger:hover{background:var(--crimson);color:var(--paper)}
.row{display:flex;gap:12px;align-items:flex-end}
.row>div{flex:1}
.mt{margin-top:16px}.mt-lg{margin-top:24px}
.hidden{display:none!important}

/* 搜索 */
.search-bar{display:grid;grid-template-columns:1fr 140px 100px 120px auto;gap:12px;align-items:end;
  margin-bottom:20px}
.search-input-wrap{position:relative}
.search-input-wrap input{padding-left:38px;font-size:15px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted)}
.lib-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;min-height:32px}
.chip{padding:6px 14px;border:1px solid var(--line);border-radius:20px;font-size:13px;
  cursor:pointer;transition:all .2s;background:var(--paper);user-select:none}
.chip:hover{border-color:var(--gold)}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.active::after{content:" ✓"}
/* 分组 chip */
.chip-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip-group-label{font-family:var(--serif);font-size:11px;letter-spacing:1px;
  color:var(--gold);background:var(--gold-soft);padding:3px 10px;border-radius:10px;
  border:1px dashed var(--gold-2);margin-right:4px;flex-shrink:0;user-select:none}
.chip-sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.chip-root-label{font-size:11px;color:var(--muted);margin-right:4px;flex-shrink:0;user-select:none}
.search-stats{display:flex;gap:24px;margin-bottom:16px;padding:14px 20px;
  background:var(--paper-2);border-radius:6px;border-left:3px solid var(--gold)}
.stat-item{display:flex;flex-direction:column;gap:2px}
.stat-num{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--ink)}
.stat-label{font-size:11px;color:var(--muted);letter-spacing:1px}
.results{display:flex;flex-direction:column;gap:10px}
.result{background:var(--paper);border:1px solid var(--line);border-radius:6px;
  padding:16px 20px;transition:all .2s;cursor:pointer;position:relative}
.result:hover{border-color:var(--gold);box-shadow:0 2px 10px rgba(201,169,97,.1)}
.result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.result-lib{font-family:var(--mono);font-size:11px;color:var(--gold-2);
  background:var(--gold-soft);padding:2px 8px;border-radius:3px}
.result-file{font-family:var(--serif);font-size:15px;font-weight:500;color:var(--ink)}
.result-meta{font-size:11px;color:var(--muted);font-family:var(--mono)}
.result-snippet{font-size:14px;line-height:1.7;color:var(--ink-2);margin-top:8px;
  padding:10px 14px;background:var(--paper-2);border-radius:4px;border-left:2px solid var(--gold-2)}
mark{background:var(--gold);color:var(--ink);padding:0 3px;border-radius:2px;font-weight:500}
.result-words{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.word-tag{font-size:11px;padding:2px 8px;background:var(--crimson-soft);
  color:var(--crimson);border-radius:3px;font-family:var(--mono)}

/* 统计 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;
  padding:20px;position:relative;overflow:hidden}
.stat-card::before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--crimson))}
.stat-card-h{font-family:var(--serif);font-size:16px;font-weight:700;margin-bottom:4px}
.stat-card-note{font-size:12px;color:var(--muted);margin-bottom:14px}
.stat-card-row{display:flex;justify-content:space-between;padding:6px 0;
  border-bottom:1px dashed var(--line);font-size:13px}
.stat-card-row:last-child{border-bottom:none}
.stat-card-row span:first-child{color:var(--muted)}
.stat-card-row span:last-child{font-family:var(--mono);font-weight:500;color:var(--ink)}
.progress{height:6px;background:var(--paper-3);border-radius:3px;margin-top:10px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--jade),var(--gold));
  border-radius:3px;transition:width .6s}

/* 导入 */
.import-zone{border:2px dashed var(--paper-3);border-radius:8px;padding:32px;
  text-align:center;transition:all .2s;cursor:pointer;position:relative}
.import-zone:hover{border-color:var(--gold);background:var(--gold-soft)}
.import-zone.dragover{border-color:var(--gold);background:var(--gold-soft);transform:scale(1.01)}
.import-zone-icon{font-size:36px;margin-bottom:8px;opacity:.5}
.import-zone-text{font-family:var(--serif);font-size:15px;color:var(--ink)}
.import-zone-hint{font-size:12px;color:var(--muted);margin-top:6px}
.file-input{position:absolute;inset:0;opacity:0;cursor:pointer}
.file-list{margin-top:14px;max-height:240px;overflow-y:auto}
.file-item{display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;background:var(--paper-2);border-radius:4px;margin-bottom:6px;font-size:13px}
.file-item .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin-right:10px;
  display:flex;flex-direction:column;gap:1px;min-width:0}
.file-item .fname .fn-main{font-weight:500;color:var(--ink)}
.file-item .fname .fn-path{font-size:10px;color:var(--muted);font-family:var(--mono);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .fsize{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.file-item .fremove{cursor:pointer;color:var(--crimson);margin-left:8px;font-size:16px}
.file-item .fremove:hover{color:var(--ink)}
.file-list-h{font-size:12px;color:var(--muted);margin:10px 0 6px;display:flex;
  justify-content:space-between;align-items:center}
.file-list-h .clear-all{cursor:pointer;color:var(--crimson);font-size:11px}
.file-list-h .clear-all:hover{text-decoration:underline}
.import-modes{display:flex;gap:10px;margin-bottom:14px}
.import-mode{flex:1;border:2px dashed var(--paper-3);border-radius:8px;padding:20px;
  text-align:center;transition:all .2s;cursor:pointer;position:relative}
.import-mode:hover{border-color:var(--gold);background:var(--gold-soft)}
.import-mode.dragover{border-color:var(--gold);background:var(--gold-soft);transform:scale(1.01)}
.import-mode-icon{font-size:28px;margin-bottom:6px;opacity:.6}
.import-mode-text{font-family:var(--serif);font-size:14px;color:var(--ink)}
.import-mode-hint{font-size:11px;color:var(--muted);margin-top:4px}
.import-tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:1px solid var(--line)}
.import-tab{padding:8px 16px;cursor:pointer;font-size:13px;color:var(--muted);
  border-bottom:2px solid transparent;transition:all .2s}
.import-tab.active{color:var(--ink);border-bottom-color:var(--gold)}
.import-list{text-align:left;margin-top:16px;max-height:200px;overflow-y:auto}
.import-item{display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;background:var(--paper-2);border-radius:4px;margin-bottom:6px;font-size:13px}
.import-item .st{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:3px}
.st-ok{background:var(--jade-soft);color:var(--jade)}
.st-skip{background:var(--gold-soft);color:var(--gold-2)}
.st-fail{background:var(--crimson-soft);color:var(--crimson)}
/* 导出按钮 */
.btn-export{padding:8px 16px;background:transparent;border:1px solid var(--gold-2);
  color:var(--gold-2);border-radius:5px;font-size:13px;cursor:pointer;
  transition:all .2s;display:inline-flex;align-items:center;gap:6px;font-family:var(--sans)}
.btn-export:hover{background:var(--gold);color:var(--ink)}

/* 校验 */
.verify-result{padding:16px 20px;border-radius:6px;margin-bottom:10px;font-family:var(--mono)}
.verify-ok{background:var(--jade-soft);border-left:3px solid var(--jade);color:var(--jade)}
.verify-bad{background:var(--crimson-soft);border-left:3px solid var(--crimson);color:var(--crimson)}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(26,29,35,.5);backdrop-filter:blur(4px);
  z-index:100;display:none;align-items:center;justify-content:center}
.modal-mask.show{display:flex}
.modal{background:var(--paper);border-radius:10px;padding:28px;min-width:400px;
  max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--gold-2)}
.modal-h{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:18px;
  display:flex;justify-content:space-between;align-items:center}
.modal-close{cursor:pointer;color:var(--muted);font-size:20px}
.modal-close:hover{color:var(--crimson)}
.modal-body{margin-bottom:20px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px}

/* toast */
.toast-wrap{position:fixed;top:80px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{padding:12px 20px;border-radius:6px;font-size:13px;color:var(--paper);
  box-shadow:0 4px 16px rgba(0,0,0,.2);animation:slidein .3s;min-width:240px}
.toast.success{background:var(--jade)}
.toast.error{background:var(--crimson)}
.toast.info{background:var(--ink)}
@keyframes slidein{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* 空状态 */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.4}
.empty-text{font-family:var(--serif);font-size:16px}

/* 加载 */
.loader{display:inline-block;width:14px;height:14px;border:2px solid var(--paper-3);
  border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}

/* 设置页 */
.settings-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;
  padding:24px 28px;margin-bottom:16px;max-width:680px}
.settings-row{margin-bottom:18px}
.settings-row label{font-size:13px;color:var(--ink);font-weight:500;margin-bottom:6px}
.settings-row .hint{margin-top:4px;font-size:11px;color:var(--muted)}
.param-tip{display:inline-flex;align-items:center;justify-content:center;
  width:14px;height:14px;border-radius:50%;background:var(--gold-soft);
  color:var(--gold-2);font-size:10px;font-weight:700;cursor:help;
  margin-left:4px;vertical-align:middle;font-family:var(--sans)}
.param-tip:hover{background:var(--gold);color:var(--paper)}
.settings-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;
  padding:4px 12px;border-radius:12px;font-family:var(--mono)}
.settings-status.ok{background:var(--jade-soft);color:var(--jade)}
.settings-status.no{background:var(--crimson-soft);color:var(--crimson)}
.model-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.model-opt{padding:14px;border:1px solid var(--line);border-radius:6px;cursor:pointer;
  transition:all .2s;background:var(--paper)}
.model-opt:hover{border-color:var(--gold)}
.model-opt.active{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 1px var(--gold)}
.model-opt-name{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--ink)}
.model-opt-desc{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.test-result{margin-top:12px;padding:10px 14px;border-radius:5px;font-family:var(--mono);
  font-size:12px;display:none}
.test-result.show{display:block}
.test-result.ok{background:var(--jade-soft);color:var(--jade);border-left:3px solid var(--jade)}
.test-result.err{background:var(--crimson-soft);color:var(--crimson);border-left:3px solid var(--crimson)}

/* 智能问答 */
.ai-bar{display:grid;grid-template-columns:1fr 100px 110px auto;gap:12px;align-items:end;margin-bottom:16px}
.ai-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:32px}
.ai-output{display:flex;flex-direction:column;gap:16px}
.ai-retrieval{background:var(--paper-2);border-radius:6px;padding:14px 18px;border-left:3px solid var(--gold-2)}
.ai-retrieval-h{font-size:12px;color:var(--muted);font-family:var(--mono);margin-bottom:8px;
  letter-spacing:1px;text-transform:uppercase}
.ai-retrieval-stats{display:flex;gap:20px;flex-wrap:wrap}
.ai-retrieval-stat{display:flex;flex-direction:column;gap:2px}
.ai-retrieval-stat .n{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink)}
.ai-retrieval-stat .l{font-size:10px;color:var(--muted);letter-spacing:1px}
.ai-answer{background:var(--paper);border:1px solid var(--line);border-radius:8px;
  padding:20px 24px;min-height:80px;line-height:1.85;font-size:14px;color:var(--ink-2);
  white-space:pre-wrap;word-break:break-word}
.ai-answer.reasoning{background:var(--paper-2);border-color:var(--paper-3);color:var(--muted);
  font-size:13px;font-style:italic}
.ai-answer.empty{color:var(--muted);font-style:italic;text-align:center;padding:40px}
.ai-refs-h{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px}
.ai-refs{display:flex;flex-direction:column;gap:8px}
.ai-ref{display:flex;gap:10px;padding:10px 14px;background:var(--paper);border:1px solid var(--line);
  border-radius:5px;font-size:13px;cursor:pointer;transition:all .2s}
.ai-ref:hover{border-color:var(--gold);box-shadow:0 2px 8px rgba(201,169,97,.1)}
.ai-ref-idx{font-family:var(--serif);font-weight:700;color:var(--gold-2);min-width:24px}
.ai-ref-body{flex:1;min-width:0}
.ai-ref-file{font-weight:500;color:var(--ink);margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-ref-meta{font-size:11px;color:var(--muted);font-family:var(--mono)}
.ai-ref-snippet{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.5;
  background:var(--paper-2);padding:6px 10px;border-radius:3px;border-left:2px solid var(--gold-2)}
.ai-typing::after{content:"▋";animation:blink 1s infinite;color:var(--gold)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Agent 模式相关 */
.ai-submode-switch{display:flex;gap:0;margin-bottom:12px;border:1px solid var(--gold-2);border-radius:5px;overflow:hidden;width:fit-content}
.ai-submode{padding:5px 14px;cursor:pointer;font-size:12px;color:var(--gold-2);background:var(--paper);
  border:none;transition:all .2s;font-family:var(--sans)}
.ai-submode:hover{color:var(--ink)}
.ai-submode.active{background:var(--gold-2);color:var(--paper)}
/* 检索引擎切换滑块（关键词 ←→ 语义） */
.engine-slider-wrap{display:inline-flex;align-items:center;gap:8px;margin-left:16px;
  padding:2px 10px;background:var(--paper);border:1px solid var(--gold-2);border-radius:14px}
.engine-slider-wrap .engine-label{font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none;
  transition:color .15s}
.engine-slider-wrap .engine-label.active{color:var(--gold-2);font-weight:600}
.engine-slider{position:relative;width:36px;height:18px;background:var(--paper-2);
  border:1px solid var(--gold-2);border-radius:10px;cursor:pointer;transition:background .2s}
.engine-slider .engine-knob{position:absolute;top:1px;left:1px;width:14px;height:14px;
  background:var(--gold-2);border-radius:50%;transition:left .2s}
.engine-slider.is-semantic{background:var(--gold-2)}
.engine-slider.is-semantic .engine-knob{left:19px;background:var(--paper)}
/* 帮助页折叠面板 */
.help-accordion{margin-top:8px}
.help-sec{background:var(--paper);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;overflow:hidden}
.help-sec-h{padding:10px 14px;cursor:pointer;font-weight:500;color:var(--ink);
  background:var(--paper-2);user-select:none;display:flex;align-items:center;gap:8px;transition:background .15s}
.help-sec-h:hover{background:var(--paper-3)}
.help-sec-body{max-height:0;overflow:hidden;transition:max-height .25s ease;padding:0 14px}
.help-sec.open .help-sec-body{max-height:6000px;padding:10px 14px}
.help-sec.open .help-arrow{transform:rotate(90deg)}
.help-arrow{display:inline-block;transition:transform .2s;color:var(--muted);font-size:11px}
.help-item{margin:6px 0;border-left:2px solid var(--line);padding-left:10px}
.help-item-h{padding:6px 10px;cursor:pointer;color:var(--ink-2);user-select:none;
  display:flex;align-items:center;gap:6px;border-radius:4px;transition:background .15s}
.help-item-h:hover{background:var(--paper-2)}
.help-item-body{max-height:0;overflow:hidden;transition:max-height .25s ease;padding:0 10px;
  font-size:13px;color:var(--ink-2);line-height:1.7}
.help-item.open .help-item-body{max-height:2000px;padding:8px 10px}
.help-item.open .help-arrow{transform:rotate(90deg)}
.help-item-h .help-arrow{font-size:10px}
.help-tbl{width:100%;border-collapse:collapse;margin:6px 0;font-size:12px}
.help-tbl th,.help-tbl td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.help-tbl th{background:var(--paper-2);color:var(--ink);font-weight:500}
.help-tbl code{background:var(--paper-3);padding:1px 5px;border-radius:3px;font-family:var(--mono)}
.help-pre{background:var(--paper-2);border:1px solid var(--line);border-radius:4px;
  padding:8px 12px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--ink-2);margin:6px 0}
.help-item-body p{margin:4px 0}
.help-item-body b{color:var(--ink)}
.ai-agent-panel{background:var(--paper-2);border-radius:6px;padding:14px 18px;margin-bottom:16px;
  border-left:3px solid var(--jade);font-size:13px;color:var(--ink-2);display:none}
.ai-agent-panel.show{display:block}
/* 分块工作流顶部流程指示条 */
.part-flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  padding:8px 10px;background:var(--paper);border:1px solid var(--line);
  border-radius:5px;margin-bottom:12px;font-size:12px}
.part-flow-step{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:3px;
  background:var(--paper-3);color:var(--muted);transition:all .2s}
.part-flow-step.active{background:var(--gold);color:var(--ink);font-weight:500}
.part-flow-step.done{background:var(--jade);color:var(--paper)}
.part-flow-step.skip{background:var(--paper-3);color:var(--muted);opacity:.6;text-decoration:line-through}
.part-flow-arrow{color:var(--muted);font-size:11px}
.ai-agent-step{padding:6px 0;display:flex;gap:10px;align-items:flex-start;line-height:1.6}
.ai-agent-step .step-icon{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;flex-shrink:0;margin-top:2px}
.ai-agent-step .step-icon.done{background:var(--jade);color:var(--paper)}
.ai-agent-step .step-icon.active{background:var(--gold);color:var(--ink);animation:pulse 1.5s infinite}
.ai-agent-step .step-icon.pending{background:var(--paper-3);color:var(--muted)}
.ai-agent-step .step-body{flex:1;min-width:0}
.ai-agent-step .step-title{font-weight:500;color:var(--ink)}
.ai-agent-step .step-detail{font-size:12px;color:var(--ink-3);font-family:var(--mono);margin-top:2px;
  word-break:break-all;background:var(--paper-2);padding:4px 8px;border-radius:3px;border-left:2px solid var(--gold)}
.ai-agent-queries{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ai-agent-query-chip{font-size:11px;padding:2px 8px;background:var(--gold-soft);color:var(--gold-2);
  border-radius:3px;font-family:var(--mono)}
.ai-agent-query-chip.hit{background:var(--jade-soft);color:var(--jade)}
.ai-agent-eval{margin-top:6px;padding:6px 10px;background:var(--paper);border-radius:4px;
  border-left:2px solid var(--gold-2);font-size:12px;color:var(--ink-2)}
.ai-agent-eval.ok{border-left-color:var(--jade)}
.ai-agent-eval.no{border-left-color:var(--crimson)}

/* 会话管理 */
.ai-chat-layout{display:grid;grid-template-columns:240px 1fr;gap:16px;height:calc(100vh - 220px);min-height:400px}
.ai-chat-sidebar{background:var(--paper);border:1px solid var(--line);border-radius:8px;
  display:flex;flex-direction:column;overflow:hidden}
.ai-chat-side-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:center;gap:8px}
.ai-chat-side-title{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--ink)}
.ai-chat-side-actions{display:flex;gap:4px}
.ai-chat-side-act{background:transparent;border:1px solid var(--line);color:var(--muted);
  padding:2px 8px;border-radius:3px;font-size:11px;cursor:pointer;transition:all .15s}
.ai-chat-side-act:hover{color:var(--gold);border-color:var(--gold)}
.ai-chat-list{flex:1;overflow-y:auto;padding:6px 0}
.ai-chat-list::-webkit-scrollbar{width:5px}
.ai-chat-list::-webkit-scrollbar-thumb{background:var(--paper-3);border-radius:3px}
.ai-chat-item{padding:10px 14px;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.ai-chat-item:hover{background:var(--paper-2)}
.ai-chat-item.active{background:var(--gold-soft);border-left-color:var(--gold)}
.ai-chat-item-title{font-size:13px;font-weight:500;color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ai-chat-item-meta{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px;
  display:flex;justify-content:space-between;align-items:center}
.ai-chat-item-del{color:var(--crimson);opacity:0;transition:opacity .15s;font-size:11px;
  background:none;border:none;cursor:pointer;padding:0 4px}
.ai-chat-item:hover .ai-chat-item-del{opacity:.7}
.ai-chat-item-del:hover{opacity:1}
.ai-chat-empty{padding:24px 14px;text-align:center;color:var(--muted);font-size:12px}
.ai-chat-main{display:flex;flex-direction:column;background:var(--paper);
  border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ai-chat-msgs{flex:1;overflow-y:auto;padding:20px 24px}
.ai-chat-msgs::-webkit-scrollbar{width:6px}
.ai-chat-msgs::-webkit-scrollbar-thumb{background:var(--paper-3);border-radius:3px}
.ai-chat-msg{margin-bottom:20px;display:flex;gap:12px}
.ai-chat-msg.user{flex-direction:row-reverse}
.ai-chat-msg-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-size:14px;flex-shrink:0}
.ai-chat-msg.user .ai-chat-msg-avatar{background:var(--ink);color:var(--paper)}
.ai-chat-msg.assistant .ai-chat-msg-avatar{background:var(--gold);color:var(--ink)}
.ai-chat-msg-body{max-width:90%;min-width:0}
.ai-chat-msg.user .ai-chat-msg-body{margin-right:auto}
.ai-chat-msg-content{padding:12px 16px;border-radius:8px;font-size:14px;line-height:1.7;
  white-space:pre-wrap;word-break:break-word}
.ai-chat-msg.user .ai-chat-msg-content{background:var(--ink);color:var(--paper)}
.ai-chat-msg.assistant .ai-chat-msg-content{background:var(--paper-2);color:var(--ink)}
.ai-chat-msg-reasoning{font-size:12px;color:var(--muted);background:var(--paper-3);
  padding:8px 12px;border-radius:4px;margin-bottom:6px;max-height:120px;overflow-y:auto;
  white-space:pre-wrap}
.ai-chat-msg-refs{margin-top:8px;font-size:12px}
.ai-chat-msg-refs-h{color:var(--muted);margin-bottom:4px}
.ai-chat-msg-ref{padding:4px 8px;background:var(--paper-2);border-radius:3px;margin-bottom:3px;
  border-left:2px solid var(--gold-2)}
/* 答案中 [n] 引用标记的样式 */
.ref-cite{color:var(--gold-2);cursor:pointer;border-bottom:1px dotted var(--gold-2);
  padding:0 1px;font-weight:600;text-decoration:none;white-space:nowrap}
.ref-cite:hover{color:var(--ink);background:var(--paper-2);border-bottom-style:solid}
.ai-chat-input-bar{padding:12px 16px;border-top:1px solid var(--line);background:var(--paper-2);
  display:flex;gap:10px;align-items:flex-end}
.ai-chat-input-bar input{flex:1}
/* 对话上下文栏 */
.ai-chat-context-bar{border-top:1px solid var(--line);background:var(--paper-2);font-size:12px}
.ctx-bar-head{display:flex;justify-content:space-between;align-items:center;
  padding:6px 16px;gap:10px}
.ctx-bar-title{cursor:pointer;user-select:none;color:var(--ink-2);display:flex;
  align-items:center;gap:6px}
.ctx-bar-title:hover{color:var(--gold-2)}
.ctx-toggle-icon{display:inline-block;width:10px;font-size:10px;color:var(--muted)}
.ctx-bar-count{background:var(--gold-2);color:#fff;border-radius:10px;
  padding:0 7px;font-size:11px;min-width:18px;text-align:center;line-height:16px}
.ctx-bar-actions{display:flex;align-items:center;gap:8px;color:var(--muted)}
.ctx-around-label{display:flex;align-items:center;gap:4px}
.ctx-around-label input{padding:2px 4px;border:1px solid var(--line);border-radius:3px;
  font-size:12px;text-align:center}
.ctx-bar-btn{padding:2px 8px;background:transparent;border:1px solid var(--line);
  color:var(--muted);border-radius:3px;cursor:pointer;font-size:11px}
.ctx-bar-btn:hover{color:var(--crimson);border-color:var(--crimson)}
.ctx-bar-list{padding:4px 16px 8px;max-height:160px;overflow-y:auto;
  border-top:1px dashed var(--line)}
.ctx-item{display:flex;justify-content:space-between;align-items:flex-start;
  gap:8px;padding:4px 0;border-bottom:1px dotted var(--line)}
.ctx-item:last-child{border-bottom:none}
.ctx-item-info{flex:1;min-width:0;font-size:11px;color:var(--ink-2)}
.ctx-item-lib{color:var(--gold-2);margin-right:4px}
.ctx-item-text{color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx-item-center{background:var(--gold-2);color:#fff;padding:0 4px;border-radius:2px;
  font-size:10px;margin-left:4px}
.ctx-item-remove{padding:2px 6px;background:transparent;border:none;
  color:var(--muted);cursor:pointer;font-size:11px}
.ctx-item-remove:hover{color:var(--crimson)}
.ai-chat-welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted);gap:8px;text-align:center}
.ai-chat-welcome-icon{font-size:42px;opacity:.4}
.ai-chat-msg-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.ai-chat-msg-act{font-size:11px;padding:2px 8px;background:transparent;border:1px solid var(--line);
  color:var(--muted);border-radius:3px;cursor:pointer;transition:all .15s}
.ai-chat-msg-act:hover{color:var(--gold);border-color:var(--gold)}

/* 溯源按钮 + 展开原文 */
.result-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chunk-metadata{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.md-tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;
  line-height:1.5;white-space:nowrap;background:var(--bg-2,#f5f5f5);color:var(--ink-2,#666)}
.md-dynasty{background:#e8f4fd;color:#1a73e8}
.md-cross-era{background:#fce8e6;color:#c5221f;font-weight:600}
.md-era{background:#fef7e0;color:#b06000}
.md-topic{background:#e6f4ea;color:#137333}
.md-entity{background:#f3e8fd;color:#8430ce}
/* 元数据折叠区 */
.md-details{margin-top:6px;border:none}
.md-details>summary{cursor:pointer;font-size:11px;color:var(--muted);
  user-select:none;list-style:none;display:inline-flex;align-items:center;gap:3px}
.md-details>summary::-webkit-details-marker{display:none}
.md-details>summary::before{content:'▸';font-size:10px;transition:transform .15s}
.md-details[open]>summary::before{transform:rotate(90deg)}
.md-details>summary:hover{color:var(--gold-2,#b8860b)}
.md-detail-body{margin-top:6px;padding:6px 8px;background:var(--bg-2,#f9f9f7);
  border-radius:4px;font-size:11px;line-height:1.6}
.md-detail-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:4px}
.md-detail-row:last-child{margin-bottom:0}
.md-detail-label{color:var(--muted);min-width:64px;flex-shrink:0}
.md-detail-val{color:var(--ink-2,#555);flex:1}
.md-person-list{display:flex;flex-wrap:wrap;gap:4px}
.md-person{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;

<!-- toast -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
const API = '';
let libraries = [];
let libraryFolders = [];          // 所有文件夹名（来自后端 _folders + 库 folder 字段聚合）
let collapsedFolders = new Set(['__public__']);// 折叠状态（公共库分组默认折叠）
let activeTab = 'search';
let selectedLibs = new Set(); // 搜索时选中的库
let libSearchQuery = '';      // 库列表搜索关键词
let lastResults = null;
// 当前登录用户（未登录 = 游客）。refreshAuth() 启动时从 /api/auth/me 拉取。
let currentUser = {username:'guest', role:'guest', is_admin:false, is_guest:true,
                   user_count:0, has_admin:false};

// ============ 对话上下文管理（检索结果 → 加到上下文 → Agent 注入 / 导出资料包） ============
// contextChunks: 已加入上下文的 chunk 集合，按 chunk_id 去重
// 每项: {chunk_id, library, heading, file_path, text, is_center, chunk_seq}
let contextChunks = [];  // 选中的 chunk 列表（含扩展的文本）
// 加到上下文时携带的前后相邻片段数（全局状态，默认 0=只带选中片段本身；
// 输入框在智能问答页，检索页加片段时该输入框不在 DOM 中，故必须走全局变量）
let ctxAround = 0;
function setCtxAround(v){
  const n = parseInt(v, 10);
  ctxAround = isNaN(n) ? 0 : Math.max(0, Math.min(10, n));
}
// 每个加入上下文的 chunk 的"命中点前后 N 字"窗口（默认 0 = 带整块；
// >0 时只取命中点附近片段，颗粒更细、省 token）
let ctxWindow = 0;
function setCtxWindow(v){
  const n = parseInt(v, 10);
  ctxWindow = isNaN(n) ? 0 : Math.max(0, Math.min(2000, n));
}

// 把检索结果加入对话上下文（含前后 ctxAround 个同文件 chunk，去重）
async function addToContext(library, chunkId, heading, filePath, btnEl, matchedWords){
  const around = ctxAround;
  const windowChars = ctxWindow;
  // 若已经全选了同文件的 chunk，直接提示
  if(contextChunks.some(c => c.chunk_id === chunkId && c.is_center)){
    toast('该 chunk 已加入上下文','info');
    return;
  }
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = '加载中...'; }
  try{
    const qp = {library, chunk_id: chunkId, around};
    if(windowChars > 0) qp.window = windowChars;
    if(matchedWords && matchedWords.length) qp.matched_words = matchedWords.join(' ');
    const d = await api('GET', '/api/chunks-around', qp);
    let added = 0;
    for(const c of (d.chunks||[])){
      // 去重：按 chunk_id
      if(contextChunks.some(x => x.chunk_id === c.chunk_id)) continue;
      contextChunks.push({
        chunk_id: c.chunk_id,
        library,
        heading: c.heading || heading,
        file_path: filePath,
        text: c.text || '',
        is_center: !!c.is_center,
        chunk_seq: c.chunk_seq,
        hit_positions: c.hit_positions || [],
        eff_window: c.window || 0,
      });
      added++;
    }
    renderContextBar();
    toast(`已加入 ${added} 个 chunk（共 ${contextChunks.length} 个）${windowChars>0?`，每块取命中点±${windowChars}字`:''}`, 'success');
    if(btnEl){
      btnEl.disabled = false;
      btnEl.textContent = '已加入✓';
      btnEl.style.color = 'var(--jade)';
      btnEl.style.borderColor = 'var(--jade)';
    }
  }catch(e){
    toast('加载失败: ' + e.message, 'error');
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = '加到上下文'; }
  }
}

// 渲染对话上下文栏
function renderContextBar(){
  const bar = document.getElementById('chatContextBar');
  const cnt = document.getElementById('ctxBarCount');
  const list = document.getElementById('ctxBarList');
  if(!bar) return;
  // 栏常显：它是「导出资料包」的唯一入口，空上下文时也保留
  // （导出/复制在空状态下会 toast 提示先收集片段）
  bar.style.display = 'block';
  if(cnt) cnt.textContent = contextChunks.length;
  if(!list) return;
  if(contextChunks.length === 0){
    list.innerHTML = '<div class="hint" style="padding:8px 4px">暂无片段：在「全文检索」结果中点击「加到上下文」，或勾选 Agent 回答的引用条目「加入选中到上下文」。</div>';
    return;
  }
  // 按 library + file_path 分组、按 chunk_seq 排序展示更清晰
  const sorted = [...contextChunks].sort((a,b)=>{
    if(a.library !== b.library) return a.library.localeCompare(b.library);
    if(a.file_path !== b.file_path) return (a.file_path||'').localeCompare(b.file_path||'');
    return (a.chunk_seq||0) - (b.chunk_seq||0);
  });
  list.innerHTML = sorted.map(c => {
    const fname = c.file_path ? c.file_path.split(/[\\\/]/).pop() : '';
    const center = c.is_center ? '<span class="ctx-item-center">选</span>' : '';
    const preview = (c.text||'').slice(0, 60).replace(/\n/g, ' ');
    return `<div class="ctx-item">
      <div class="ctx-item-info">
        <div><span class="ctx-item-lib">${esc(c.library)}</span>${esc(fname)}${center}</div>
        <div class="ctx-item-text">${esc(preview)}${c.text.length>60?'...':''}</div>
      </div>
      <button class="ctx-item-remove" onclick="removeContextChunk('${esc(c.chunk_id)}')">✕</button>
    </div>`;
  }).join('');
}

// 切换上下文列表展开/收起
function toggleCtxList(){
  const list = document.getElementById('ctxBarList');
  const icon = document.getElementById('ctxToggleIcon');
  if(!list) return;
  const open = list.style.display !== 'none';
  list.style.display = open ? 'none' : 'block';
  if(icon) icon.textContent = open ? '▶' : '▼';
}

// 移除单个上下文 chunk
function removeContextChunk(chunkId){
  contextChunks = contextChunks.filter(c => c.chunk_id !== chunkId);
  renderContextBar();
}

// 清空全部上下文
function clearContextChunks(){
  if(contextChunks.length === 0) return;
  if(!confirm('确定清空全部对话上下文？')) return;
  contextChunks = [];
  renderContextBar();
  toast('已清空对话上下文','info');
}

// 将 contextChunks 融合序列化为 Markdown 资料包（纯资料，供上传/粘贴给网页模型）
function buildContextMarkdown(){
  const sorted = [...contextChunks].sort((a,b)=>{
    if(a.library !== b.library) return a.library.localeCompare(b.library);
    if(a.file_path !== b.file_path) return (a.file_path||'').localeCompare(b.file_path||'');
    return (a.chunk_seq||0) - (b.chunk_seq||0);
  });
  const libs = [...new Set(sorted.map(c=>c.library))];
  const totalChars = sorted.reduce((s,c)=>s+(c.text||'').length,0);
  const lines = [];
  lines.push('# 参考资料包');
  lines.push('');
  lines.push(`导出于 ${new Date().toLocaleString('zh-CN')} · 来源库：${libs.join('、')} · ${sorted.length} 个片段 · 约 ${totalChars} 字`);
  sorted.forEach((c,i)=>{
    const fname = c.file_path ? c.file_path.split(/[\\\/]/).pop() : '';
    lines.push('');
    lines.push('---');
    lines.push('');
    lines.push(`## [${i+1}] ${c.heading || fname || c.chunk_id}`);
    lines.push(`**来源**：${c.library}${fname ? ' / ' + fname : ''} / ${c.chunk_id}`);
    lines.push('');
    lines.push((c.text||'').trim());
  });
  lines.push('');
  return lines.join('\n');
}

function exportContextMarkdown(){
  if(contextChunks.length === 0){ toast('上下文为空，请先在检索结果中「加到上下文」','error'); return; }
  const ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  downloadText(buildContextMarkdown(), `context_${ts}.txt`);
  toast(`已导出资料包（${contextChunks.length} 个片段）`,'success');
}

async function copyContextMarkdown(btn){
  if(contextChunks.length === 0){ toast('上下文为空，请先在检索结果中「加到上下文」','error'); return; }
  const text = buildContextMarkdown();
  try{
    await navigator.clipboard.writeText(text);
    const orig = btn.textContent;
    btn.textContent = '已复制 ✓';
    toast(`已复制资料包（${contextChunks.length} 个片段，约 ${text.length} 字）`,'success');
    setTimeout(()=>{ btn.textContent = orig; }, 2000);
  }catch(e){
    // 降级：用临时 textarea
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{
      document.execCommand('copy');
      toast(`已复制资料包（${contextChunks.length} 个片段）`,'success');
    }catch(err){
      toast('复制失败: '+err.message,'error');
    }
    document.body.removeChild(ta);
  }
}

// 把 contextChunks 同步到当前会话（发送前调用）
async function syncContextToSession(){
  if(!currentChatSession) return;
  try{
    if(contextChunks.length === 0){
      await api('DELETE', '/api/chat/sessions/' + encodeURIComponent(currentChatSession.id) + '/context');
    }else{
      await api('POST', '/api/chat/sessions/' + encodeURIComponent(currentChatSession.id) + '/context',
        null, {chunks: contextChunks});
    }
  }catch(e){
    console.warn('[上下文同步] 失败:', e.message);
  }
}


// ============ 工具 ============
async function api(method, path, params, body, signal){
  let url = API + path;
  if(params){
    const qs = new URLSearchParams();
    for(const k in params) if(params[k]!==undefined && params[k]!=='') qs.append(k, params[k]);
    const s = qs.toString();
    if(s) url += '?' + s;
  }
  const opt = {method, headers:{}};
  if(signal) opt.signal = signal;
  if(body){ opt.body = JSON.stringify(body); opt.headers['Content-Type']='application/json'; }
  const r = await fetch(url, opt);
  const d = await r.json();
  if(!d.ok) throw new Error(d.error || '请求失败');
  return d.data;
}

// ============ 多用户身份：登录 / 注册 / 退出 ============
async function refreshAuth(){
  try{
    const d = await api('GET','/api/auth/me');
    currentUser = {
      username: d.username || 'guest',
      role: d.role || 'guest',
      is_admin: !!d.is_admin,
      is_guest: !!d.is_guest,
      user_count: d.user_count || 0,
      has_admin: !!d.has_admin,
    };
  }catch(e){
    currentUser = {username:'guest', role:'guest', is_admin:false, is_guest:true,
                   user_count:0, has_admin:false};
  }
  renderUserArea();
  const usersTab = document.getElementById('usersTab');
  if(usersTab) usersTab.style.display = currentUser.is_admin ? '' : 'none';
  // 非管理员切到用户管理页时退回
  if(!currentUser.is_admin && activeTab === 'users'){
    activeTab = 'help';
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab==='help'));
    renderTab();
  }
}
function renderUserArea(){
  const el = document.getElementById('userArea');
  if(!el) return;
  const u = currentUser;
  let html = '';
  if(u.is_guest){
    html += `<span class="user-badge guest"><span class="user-name">游客</span><span class="user-role">公共库模式</span></span>`;
    if(u.user_count === 0){
      html += `<button class="user-btn primary" onclick="showRegisterModal()">注册（首个用户=管理员）</button>`;
    }else{
      html += `<button class="user-btn" onclick="showLoginModal()">登录</button>`;
      html += `<button class="user-btn" onclick="showRegisterModal()">注册</button>`;
    }
  }else{
    html += `<span class="user-badge ${u.is_admin?'admin':''}"><span class="user-name">${esc(u.username)}</span><span class="user-role">${u.is_admin?'管理员':'用户'}</span></span>`;
    html += `<button class="user-btn danger" onclick="doLogout()">退出</button>`;
  }
  el.innerHTML = html;
}
function showLoginModal(){
  showModal(`<div class="modal-h">登录 <span class="modal-close" onclick="closeModal()">×</span></div>
    <div class="modal-body">
      <label>用户名</label>
      <input type="text" id="loginName" placeholder="用户名" style="margin-bottom:10px">
      <label>密码</label>
      <input type="password" id="loginPwd" placeholder="密码" style="margin-bottom:6px" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-gold" onclick="doLogin()">登录</button>
    </div>`);
  setTimeout(()=>document.getElementById('loginName').focus(),100);

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// 渲染 chunk 元数据（朝代/年号/主题/实体密度），用于检索结果和引用列表
// metadata 结构：{dynasty, topic, era_names:[], entity_density:{person,place,org,other}, relative_dir}
function renderChunkMetadata(metadata){
  if(!metadata) return '';
  const parts = [];
  // 时代字段：跨时代用特殊样式，古代显示朝代，现代显示时期+年代范围，或显示主年代
  if(metadata.time_span){
    // 跨时代文档：纵贯多个时代，用醒目样式标识
    parts.push(`<span class="md-tag md-cross-era">时代:${esc(metadata.time_span)}</span>`);
  } else if(metadata.era){
    parts.push(`<span class="md-tag md-dynasty">时代:${esc(metadata.era)}</span>`);
  }
  if(metadata.era_names && metadata.era_names.length){
    parts.push(`<span class="md-tag md-era">年号:${metadata.era_names.map(esc).join('/')}</span>`);
  }
  if(metadata.topic) parts.push(`<span class="md-tag md-topic">主题:${esc(metadata.topic)}</span>`);
  // 主标签行
  let html = parts.length ? `<div class="chunk-metadata">${parts.join(' ')}</div>` : '';
  // 折叠区：实体密度 + top10 人物 + 年代分布
  const ent = metadata.entity_density || {};
  const entParts = [];
  if(ent.person) entParts.push(`人名:${(ent.person*1000).toFixed(1)}‰`);
  if(ent.place) entParts.push(`地名:${(ent.place*1000).toFixed(1)}‰`);
  if(ent.org) entParts.push(`机构:${(ent.org*1000).toFixed(1)}‰`);
  if(ent.other) entParts.push(`专名:${(ent.other*1000).toFixed(1)}‰`);
  const topPersons = (metadata.top_persons || []).filter(p => p && p.name);
  if(entParts.length || topPersons.length){
    let detailHtml = '';
    if(entParts.length){
      detailHtml += `<div class="md-detail-row"><span class="md-detail-label">实体密度</span><span class="md-detail-val">${entParts.join(' · ')}</span></div>`;
    }
    if(topPersons.length){
      const personTags = topPersons.map(p => `<span class="md-person">${esc(p.name)}<span class="md-person-cnt">${p.count}</span></span>`).join('');
      detailHtml += `<div class="md-detail-row"><span class="md-detail-label">Top${topPersons.length}人物</span><span class="md-detail-val md-person-list">${personTags}</span></div>`;
    }
    html += `<details class="md-details"><summary>更多元数据</summary><div class="md-detail-body">${detailHtml}</div></details>`;
  }
  return html;
}
// 渲染 markdown：marked 解析 + DOMPurify 防 XSS，库未加载时回退转义
function renderMd(text){
  text = String(text == null ? '' : text);
  if(typeof marked === 'undefined' || typeof DOMPurify === 'undefined'){
    // 库未加载（离线场景）回退到转义 + 换行保留
    return '<div class="md-body" style="white-space:pre-wrap">'+esc(text)+'</div>';
  }
  try{
    marked.setOptions({gfm:true, breaks:true});
    const raw = marked.parse(text);
    return '<div class="md-body">'+DOMPurify.sanitize(raw, {ADD_ATTR:['target']})+'</div>';
  }catch(e){
    return '<div class="md-body" style="white-space:pre-wrap">'+esc(text)+'</div>';
  }
}
// 流式渲染节流：累积 delta，100ms 内最多渲染一次；结束/强制刷新时立即渲染
let _streamRenderTimer = null;
let _streamRenderTargetId = null;
let _streamRenderOnRender = null;
let _streamRenderPendingText = '';
function _streamRenderTick(targetId, text, onRender){
  // 兼容：未指定 targetId 时使用 aiAnswer
  const tid = targetId || 'aiAnswer';
  _streamRenderTargetId = tid;
  _streamRenderOnRender = onRender || null;
  _streamRenderPendingText = text;  // 存最新的 text
  if(_streamRenderTimer) return;  // 已在排队中
  _streamRenderTimer = setTimeout(()=>{
    _streamRenderTimer = null;
    const el = document.getElementById(_streamRenderTargetId);
    if(el) el.innerHTML = renderMd(_streamRenderPendingText);
    if(_streamRenderOnRender) try{_streamRenderOnRender();}catch(e){}
  }, 30);
}
function _streamRenderFlush(text){
  if(_streamRenderTimer){ clearTimeout(_streamRenderTimer); _streamRenderTimer = null; }
  if(_streamRenderTargetId){
    const el = document.getElementById(_streamRenderTargetId);
    if(el) el.innerHTML = renderMd(text !== undefined ? text : _streamRenderPendingText);
    if(_streamRenderOnRender) try{_streamRenderOnRender();}catch(e){}
  }
}

function postProcessRefCites(targetElement, refs){
  // 扫描 targetElement（默认 #chat-answer）内的文本节点，把 [n] 包装成可点击元素
  // n 必须在 refs（默认 currentAnswerRefs）的 index 范围内，否则视为原文注解号（如 [91]）忽略
  const el = targetElement || document.getElementById('chat-answer');
  if(!el) return;
  const refList = refs || currentAnswerRefs;
  const validIdx = new Set(refList.map(r => r.index));
  if(!validIdx.size) return;

  // 用 TreeWalker 遍历文本节点，找 [n] 模式
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  const toReplace = [];
  let node;
  while((node = walker.nextNode())){
    const txt = node.nodeValue;
    if(!txt || txt.indexOf('[') === -1) continue;
    // 跳过 <code> / <pre> 内的文本（不处理代码块中的 [n]）
    let p = node.parentNode;
    let inCode = false;
    while(p && p !== el){
      if(p.tagName === 'CODE' || p.tagName === 'PRE'){ inCode = true; break; }
      p = p.parentNode;
    }
    if(inCode) continue;

    const re = /\[(\d+)\]/g;
    let m;
    const segs = [];
    let last = 0;
    let found = false;
    while((m = re.exec(txt)) !== null){
      const n = parseInt(m[1], 10);
      if(!validIdx.has(n)){
        // 不在引用列表中的编号（如原文注解 [91] 或模型幻觉编号 [100]）
        // 去掉方括号，仅保留数字，避免与引用列表的 [n] 标记混淆
        found = true;
        if(m.index > last) segs.push({type:'text', value:txt.slice(last, m.index)});
        segs.push({type:'text', value:String(n)});
        last = m.index + m[0].length;
        continue;
      }
      found = true;
      if(m.index > last) segs.push({type:'text', value:txt.slice(last, m.index)});
      segs.push({type:'cite', n:n});
      last = m.index + m[0].length;
    }
    if(!found) continue;
    if(last < txt.length) segs.push({type:'text', value:txt.slice(last)});

    toReplace.push({node, segs});
  }

  // 替换文本节点
  for(const {node, segs} of toReplace){
    const frag = document.createDocumentFragment();
    for(const seg of segs){
      if(seg.type === 'text'){
        frag.appendChild(document.createTextNode(seg.value));
      }else{
        const a = document.createElement('a');
        a.className = 'ref-cite';
        a.textContent = '[' + seg.n + ']';
        a.dataset.refIdx = String(seg.n);
        a.addEventListener('click', function(ev){
          ev.preventDefault();
          ev.stopPropagation();
          showRefPopup(seg.n, ev, refList);
        });
        frag.appendChild(a);
      }
    }
    node.parentNode.replaceChild(frag, node);
  }
}

function showRefPopup(n, ev, refs){
  // 弹出来源信息卡片
  const refList = refs || currentAnswerRefs;
  const ref = refList.find(r => r.index === n);
  if(!ref) return;

  // 移除已存在的弹窗
  const old = document.getElementById('ref-popup');
  if(old) old.remove();

  const pop = document.createElement('div');
  pop.id = 'ref-popup';
  pop.style.cssText = 'position:fixed;z-index:9999;max-width:380px;min-width:260px;'
    + 'background:var(--panel-1,#fff);border:1px solid var(--line,#ddd);'
    + 'border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,0.18);'
    + 'padding:12px 14px;font-size:13px;color:var(--ink,#333);'
    + 'font-family:inherit;line-height:1.55';

  const lines = [];
  lines.push(`<div style="font-weight:600;margin-bottom:6px;color:var(--gold-2,#b8860b)">引用 [${n}] 来源</div>`);

  if(ref.source_file) lines.push(`<div><span style="color:var(--muted,#888)">源文件：</span>${esc(ref.source_file)}</div>`);
  if(ref.heading) lines.push(`<div><span style="color:var(--muted,#888)">章节：</span>${esc(ref.heading)}</div>`);
  if(ref.chunk_id) lines.push(`<div><span style="color:var(--muted,#888)">大段ID：</span><code style="font-size:11px">${esc(ref.chunk_id)}</code></div>`);
  if(ref.hit_count != null) lines.push(`<div><span style="color:var(--muted,#888)">命中次数：</span>${ref.hit_count}</div>`);
  // 元数据（朝代/年号/主题/实体密度）
  const md = ref.metadata;
  if(md){
    const mdParts = [];
    if(md.dynasty) mdParts.push(`朝代:${esc(md.dynasty)}`);
    if(md.era_names && md.era_names.length) mdParts.push(`年号:${md.era_names.map(esc).join('/')}`);
    if(md.topic) mdParts.push(`主题:${esc(md.topic)}`);
    const ent = md.entity_density || {};
    const entParts = [];
    if(ent.person) entParts.push(`人名:${(ent.person*1000).toFixed(1)}‰`);
    if(ent.place) entParts.push(`地名:${(ent.place*1000).toFixed(1)}‰`);
    if(ent.org) entParts.push(`机构:${(ent.org*1000).toFixed(1)}‰`);
    if(ent.other) entParts.push(`专名:${(ent.other*1000).toFixed(1)}‰`);
    if(entParts.length) mdParts.push(entParts.join(' '));
    if(mdParts.length) lines.push(`<div style="margin-top:4px;padding:6px 8px;background:var(--panel-2,#f7f7f8);border-radius:4px;font-size:12px">${mdParts.join(' | ')}</div>`);
  }
  // 显示内容预览片段（提升引用颗粒度，让用户快速了解 chunk 内容，命中词高亮）
  if(ref.snippet){
    const snipHtml = highlight(ref.snippet, ref.matched_words||[]);
    lines.push(`<div style="margin-top:8px;padding:8px;background:var(--panel-2,#f7f7f8);border-radius:4px;border-left:3px solid var(--gold-2,#b8860b)"><div style="color:var(--muted,#888);font-size:11px;margin-bottom:4px">内容预览：</div><div style="white-space:pre-wrap;font-size:12px;line-height:1.5">${snipHtml}</div></div>`);
  }

  // 操作按钮
  const btns = [];
  if(ref.source_file_path){
    btns.push(`<button class="ai-chat-msg-act" style="margin-top:8px;margin-right:6px" onclick="previewRefFile(${esc(JSON.stringify(ref.source_file_path))},${esc(JSON.stringify(ref.library||''))})">预览源文件</button>`);
    btns.push(`<button class="ai-chat-msg-act" style="margin-top:8px" onclick="openDoc('${encodeURIComponent(ref.source_file_path)}','${encodeURIComponent(ref.library||'')}')">下载</button>`);
  }

  pop.innerHTML = lines.join('') + (btns.length ? '<div>' + btns.join('') + '</div>' : '')
    + '<div style="margin-top:8px;text-align:right"><button class="ai-chat-msg-act" onclick="document.getElementById(\'ref-popup\').remove()">关闭</button></div>';

  document.body.appendChild(pop);

  // 定位：尽量放在 [n] 点击位置附近，避免越界
  const x = ev.clientX != null ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 100);
  const y = ev.clientY != null ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 100);
  const rect = pop.getBoundingClientRect();
  let left = x + 8;
  let top = y + 16;
  if(left + rect.width > window.innerWidth - 8) left = window.innerWidth - rect.width - 8;
  if(top + rect.height > window.innerHeight - 8) top = y - rect.height - 8;
  if(top < 8) top = 8;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';

  // 点击外部关闭
  setTimeout(function(){
    document.addEventListener('click', _closeRefPopupOnOutside, true);
  }, 0);
}

function _closeRefPopupOnOutside(ev){
  const pop = document.getElementById('ref-popup');
  if(!pop){ document.removeEventListener('click', _closeRefPopupOnOutside, true); return; }
  // 点击弹窗内部不关闭；点击另一个 [n] 引用标记也不关闭（由 showRefPopup 处理重新定位）
  const isInsidePopup = pop.contains(ev.target);
  const isRefCite = ev.target.classList && ev.target.classList.contains('ref-cite');
  if(!isInsidePopup && !isRefCite){
    pop.remove();
    document.removeEventListener('click', _closeRefPopupOnOutside, true);
  }
}

// 彩色高亮调色板（与 :root 中 --hl-N-fg/bg 一一对应）
const HIGHLIGHT_COLORS = [
  {fg:'var(--hl-1-fg)', bg:'var(--hl-1-bg)'},
  {fg:'var(--hl-2-fg)', bg:'var(--hl-2-bg)'},
  {fg:'var(--hl-3-fg)', bg:'var(--hl-3-bg)'},
  {fg:'var(--hl-4-fg)', bg:'var(--hl-4-bg)'},
  {fg:'var(--hl-5-fg)', bg:'var(--hl-5-bg)'},
  {fg:'var(--hl-6-fg)', bg:'var(--hl-6-bg)'},
  {fg:'var(--hl-7-fg)', bg:'var(--hl-7-bg)'},
  {fg:'var(--hl-8-fg)', bg:'var(--hl-8-bg)'},
];
// 全局颜色映射缓存：renderSearchResults 设置，toggleChunkText 读取
// 这样"展开原文"时也能用相同的颜色高亮
let lastColorMap = null;

// 为关键词分配颜色映射：word -> {fg, bg}
// 策略：
//   1. 词数 ≤ 颜色数（8）：每个词独占一个颜色
//   2. 词数 > 颜色数：按命中次数降序排，前 N 个独占颜色，剩余词轮流复用
//      这样"匹配结果多的词"优先独占颜色，便于区分
// hitCounts: 可选，word -> number（该词在所有结果中的总命中次数）
function buildWordColorMap(words, hitCounts){
  if(!words || !words.length) return {};
  const wordList = Array.from(new Set(words.filter(w=>w && w.length)));
  if(!wordList.length) return {};
  const counts = hitCounts || {};
  // 按命中次数降序（次数相同的按词长降序，再按字典序）
  const sorted = wordList.slice().sort((a,b)=>{
    const ca = counts[a]||0, cb = counts[b]||0;
    if(ca !== cb) return cb - ca;
    if(a.length !== b.length) return b.length - a.length;
    return a.localeCompare(b);
  });
  const map = {};
  const N = HIGHLIGHT_COLORS.length;
  if(sorted.length <= N){
    // 每个词独占颜色
    sorted.forEach((w, i) => { map[w] = HIGHLIGHT_COLORS[i]; });
  }else{
    // 前 N 个独占，剩余轮流复用（从第 1 个颜色开始轮）
    sorted.forEach((w, i) => {
      if(i < N){
        map[w] = HIGHLIGHT_COLORS[i];
      }else{
        map[w] = HIGHLIGHT_COLORS[i % N];
      }
    });
  }
  return map;
}

// 高亮文本中的关键词
// colorMap: 可选，word -> {fg, bg}，若提供则按颜色高亮；否则统一用 <mark>
function highlight(text, words, colorMap){
  if(!words || !words.length) return esc(text);
  // 按词长降序，避免短词先匹配破坏长词（如"刘备"先于"刘"）
  const sortedWords = Array.from(new Set(words.filter(w=>w&&w.length)))
    .sort((a,b)=>b.length - a.length);
  if(!sortedWords.length) return esc(text);
  // 在原文上定位命中再逐段转义，避免命中词/正文含 & < > ' " 时
  // 转义后的实体被原始词替换破坏（如 A&B → A<mark>&</mark>amp;B）
  const alt = sortedWords.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  const re = new RegExp('('+alt+')','gi');
  // 按小写查色，与 gi 大小写不敏感匹配行为一致
  const colorByLower = {};
  if(colorMap) for(const k in colorMap) colorByLower[String(k).toLowerCase()] = colorMap[k];
  const mark = (w)=>{
    const c = colorByLower[w.toLowerCase()];
    if(c) return `<mark style="background:${c.bg};color:${c.fg};padding:0 2px;border-radius:2px;font-weight:600">${esc(w)}</mark>`;
    return '<mark>'+esc(w)+'</mark>';
  };
  let out = '', last = 0, m;
  while((m = re.exec(text)) !== null){
    out += esc(text.slice(last, m.index)) + mark(m[0]);
    last = m.index + m[0].length;
  }
  out += esc(text.slice(last));
  return out;
}

// 高亮文本中的关键词，同时对 subText 子片段加下划线
// 用于"展开原文"时把向量命中的子片段在原文中划出来
// 实现：先按 subText 把原文切成多段，对每段分别做关键词高亮，
//       subText 段外套 <u> 标签；这样避免关键词高亮插入 <mark> 后
//       再找 subText 会因 HTML 标签切断而失败
function highlightWithSubtext(text, words, colorMap, subText){
  if(!subText || !text) return highlight(text, words, colorMap);
  // 在原文中查找 subText 的所有出现位置（可能多次出现，全部下划线）
  const parts = [];
  let pos = 0;
  let idx;
  const subEsc = esc(subText);
  while((idx = text.indexOf(subText, pos)) >= 0){
    if(idx > pos) parts.push({type:'text', text: text.slice(pos, idx)});
    parts.push({type:'sub', text: subText});
    pos = idx + subText.length;
    // 防止死循环（subText 为空时）
    if(subText.length === 0) break;
  }
  if(pos < text.length) parts.push({type:'text', text: text.slice(pos)});
  // 没有匹配到 subText（可能 sub_text 与原文有细微差异），退化为普通高亮
  if(parts.length === 1 && parts[0].type === 'text'){
    return highlight(text, words, colorMap);
  }
  // 对每段分别高亮，sub 段外套下划线
  return parts.map(p => {
    const inner = highlight(p.text, words, colorMap);
    if(p.type === 'sub'){
      return `<u style="text-decoration:underline;text-decoration-color:var(--gold-2);text-decoration-thickness:1.5px;text-underline-offset:3px;background:var(--gold-soft);padding:0 1px;border-radius:2px">${inner}</u>`;
    }
    return inner;
  }).join('');
}

// 轻量刷新侧边栏各库的字数/大段数：只就地更新 .lib-meta 文本，
// 不整树重渲染（避免导入进行中打断库搜索框输入/折叠状态）。
// 若库集合发生变化（新增/删除），回退到整树重渲染。
async function refreshLibStats(){
  try{
    const d = await api('GET','/api/libraries');
    const fresh = d.libraries || [];
    const structureChanged = fresh.length !== libraries.length
      || fresh.some(f => !libraries.some(l => l.name === f.name));
    if(structureChanged){
      libraries = fresh;
      libraryFolders = d.folders || [];
      renderLibList();
      renderLibChips();
      renderAiLibChips();
      return;
    }
    for(const f of fresh){
      const old = libraries.find(l => l.name === f.name);
      if(old) old.stats = f.stats;
      const item = document.querySelector(`.lib-item[data-name="${CSS.escape(f.name)}"] .lib-meta`);
      if(item){
        const s = f.stats || {};
        item.textContent = `${fmt(s.chars||0)} 字 · ${s.chunks||0} 大段`;
      }
    }
  }catch(e){ /* 静默失败，下次进度事件再试 */ }
}
let _lastLibStatsRefresh = 0;  // refreshLibStats 节流时间戳
function refreshLibStatsThrottled(){
  const now = Date.now();
  if(now - _lastLibStatsRefresh < 2000) return;
  _lastLibStatsRefresh = now;
  refreshLibStats();
}
// ============ 语义向量索引状态 ============
let _semStatusTimer = null;
async function loadSemanticStatus(){
  try{
    const d = await api('GET','/api/semantic/status');
    const avail = d.available;
    const reason = d.fail_reason || '';
    const libs = d.libraries || [];
    for(const l of libraries){
      const el = document.getElementById('semStatus_' + l.name);
      if(!el) continue;
      const info = libs.find(x => x.library === l.name);
      if(!avail){
        el.innerHTML = '<span style="color:var(--gray)">向量索引：未启用' +
          (reason ? '（' + esc(reason) + '）' : '') + '</span>';
        continue;
      }
      if(!info){
        el.innerHTML = '<span style="color:var(--gray)">向量索引：未构建</span>';
        continue;
      }
      const st = info.status;
      const vc = info.vector_count || 0;
      if(st === 'ready'){
        el.innerHTML = '<span style="color:var(--jade)">● 向量索引就绪（' + vc + ' 条向量）</span>';
      }else if(st === 'building'){
        const p = info.progress || {};
        const cur = p.current || 0;
        const tot = p.total || '?';
        const stage = p.stage || '';
        let stageText = '';
        if(stage === 'embedding') stageText = '生成向量中';
        else if(stage === 'building') stageText = '构建索引中';
        else if(stage === 'saving') stageText = '保存中';
        else stageText = '构建中';
        el.innerHTML = '<span style="color:var(--gold-2)">● 向量索引构建中（' + stageText + ' ' + cur + '/' + tot + '）</span>';
      }else if(st === 'failed'){
        el.innerHTML = '<span style="color:var(--crimson)">● 向量索引构建失败（' + esc(info.fail_reason || '未知错误') + '）</span>';
      }else if(st === 'unavailable'){
        el.innerHTML = '<span style="color:var(--gray)">● 向量索引不可用（' + esc(info.fail_reason || reason || '依赖未安装') + '）</span>';
      }else{
        el.innerHTML = '<span style="color:var(--gray)">● 向量索引未构建</span>';
      }
    }
    // 若有库正在构建，启动轮询
    const hasBuilding = libs.some(x => x.status === 'building');
    if(hasBuilding){
      if(!_semStatusTimer) _semStatusTimer = setTimeout(()=>{ _semStatusTimer = null; loadSemanticStatus(); }, 3000);
    }
  }catch(e){
    // 静默失败，不影响主流程
    console.error('loadSemanticStatus 失败:', e);
  }
}

// 补抽 chunk 标签（为旧库回填 tags 字段）
async function backfillTags(libName){
  if(!confirm(`确定为库「${libName}」补抽大段标签？\n\n`+
      `仅处理 tags 字段缺失的大段（已有标签的跳过）。\n`+
      `如需强制覆盖所有标签，请按住 Shift 再点确认。`)) return;
  const force = event && event.shiftKey;
  const params = new URLSearchParams({
    library: libName,
    force: force ? '1' : '0',
  });
  // 显示进度浮层
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:9999;display:flex;align-items:center;justify-content:center';
  overlay.innerHTML = `
    <div class="card" style="width:480px;max-width:90vw;padding:20px">
      <div style="font-weight:600;margin-bottom:10px;color:var(--ink)">补抽标签 · ${esc(libName)}${force?'（强制覆盖）':''}</div>
      <div id="tagPbBar" style="height:8px;background:var(--bg-2);border-radius:4px;overflow:hidden;margin-bottom:8px">
        <div id="tagPbFill" style="height:100%;width:0%;background:var(--gold-2);transition:width 0.2s"></div>
      </div>
      <div id="tagPbText" style="font-size:12px;color:var(--ink-2);margin-bottom:8px">准备中…</div>
      <div id="tagPbDetail" style="font-size:11px;color:var(--muted);max-height:200px;overflow-y:auto;white-space:pre-wrap"></div>
      <div style="text-align:right;margin-top:10px">
        <button class="btn btn-sm" id="tagPbCloseBtn">关闭</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const barEl = overlay.querySelector('#tagPbFill');
  const textEl = overlay.querySelector('#tagPbText');
  const detailEl = overlay.querySelector('#tagPbDetail');
  const closeBtn = overlay.querySelector('#tagPbCloseBtn');

  // 关闭浮层（点击关闭按钮或遮罩区域）
  let streamClosed = false;
  const closeOverlay = () => {
    streamClosed = true;
    if (overlay.parentElement) overlay.parentElement.removeChild(overlay);
  };
  closeBtn.addEventListener('click', closeOverlay);

  try{
    const resp = await fetch(API + '/api/backfill-tags/stream?' + params.toString());
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while(true){
      if(streamClosed){ try{ reader.cancel(); }catch(e){} break; }
      const {done, value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: ')) continue;
        try{
          const ev = JSON.parse(line.slice(6));
          if(ev.phase === 'start'){
            textEl.textContent = `共 ${ev.total} 个大段待处理`;
          }else if(ev.phase === 'progress'){
            const pct = Math.round(ev.current / Math.max(ev.total,1) * 100);
            barEl.style.width = pct + '%';
            const icon = ev.skipped ? '○' : '✓';
            const color = ev.skipped ? 'var(--muted)' : 'var(--jade)';
            textEl.innerHTML = `<span style="color:${color}">${icon}</span> [${ev.current}/${ev.total}] ${esc(ev.chunk_id||'')} · ${ev.tags_count} 个标签${ev.error?' · <span style="color:var(--crimson)">'+esc(ev.error)+'</span>':''}`;
            if(ev.current % 50 === 0 || ev.current === ev.total){
              detailEl.textContent += `${icon} [${ev.current}/${ev.total}] ${ev.chunk_id||'(skip)'} · ${ev.tags_count} 标签\n`;
              detailEl.scrollTop = detailEl.scrollHeight;
            }
          }else if(ev.phase === 'done'){
            barEl.style.width = '100%';
            barEl.style.background = 'var(--jade)';
            textEl.innerHTML = `<span style="color:var(--jade)">✓ 完成：更新 ${ev.updated} 个，跳过 ${ev.skipped} 个，共 ${ev.total} 个</span>`;
            toast(`补抽标签完成：更新 ${ev.updated}，跳过 ${ev.skipped}`,'success');
          }else if(ev.phase === 'error'){
            textEl.innerHTML = `<span style="color:var(--crimson)">✗ ${esc(ev.error||ev.message||'错误')}</span>`;
            toast('补抽标签失败: '+(ev.error||ev.message),'error');
          }
        }catch(e){}
      }
    }
  }catch(e){
    if(!streamClosed){
      textEl.innerHTML = `<span style="color:var(--crimson)">✗ ${esc(e.message)}</span>`;
      toast('补抽标签失败: '+e.message,'error');
    }
  }
}

    ? `<button class="lib-clone-btn" onclick="event.stopPropagation();cloneLibToMe('${esc(l.name)}')" title="把公共库深拷贝一份到你的名下（含向量索引）">⧉ 复制到我的库</button>`
    : '';
  const editActions = l.can_edit
    ? `<button class="lib-act" onclick="event.stopPropagation();openNotesModal('${esc(l.name)}')">备注</button>

    : '';
  // 管理员：可转移任意库的所有权（含公共库）
  const transferBtn = (currentUser.is_admin && l.owner !== currentUser.username)
    ? `<button class="lib-act" onclick="event.stopPropagation();showTransferModal('${esc(l.name)}','${esc(l.owner)}')" title="把库所有权转移给其他用户或设为公共库">转移归属</button>`
    : '';
  // 公共库在登录用户视图中位于特殊文件夹内，内容不可移动；游客视图保持可拖拽
  const draggable = (!l.is_public || currentUser.is_guest) ? 'true' : 'false';
  return `<div class="lib-item" draggable="${draggable}" data-name="${esc(l.name)}" data-folder="${esc(l.folder||'')}" style="padding-left:${12+indent}px" onclick="toggleLibSelect('${esc(l.name)}')">
    <div class="lib-name">${ownerTag} ${esc(l.name)}</div>

    ${cloneBtn}
    <div class="lib-meta">${fmt(s.chars||0)} 字 · ${s.chunks||0} 大段</div>
    <div class="lib-meta" id="semStatus_${esc(l.name)}" style="font-size:11px;color:var(--gold-2)">向量索引：查询中…</div>
    <div class="lib-actions">
      ${transferBtn}
      ${editActions}
    </div>
  </div>`;
}
function folderHeadHTML(folder, directCount, totalCount, depth, locked){
  // locked：公共库特殊文件夹内部——不可改名/删除/拖拽，折叠键加前缀避免与用户同名文件夹冲突

    <span class="folder-name">${esc(display)}</span>

      <button class="folder-act" onclick="event.stopPropagation();openRenameFolderModal('${esc(folder)}')">改名</button>

// 公共库特殊文件夹的折叠键（避免与用户真实文件夹路径冲突）
const PUBLIC_FOLDER_KEY = '__public__';
// 公共库分组头：可折叠/全选，但没有改名/删除/拖拽（内容由所有游客共同维护，不可移动）
function publicFolderHeadHTML(totalCount){

  return `<div class="folder-head ${collapsed?'collapsed':''} public-root" data-folder="${PUBLIC_FOLDER_KEY}" data-locked="1" draggable="false" style="padding-left:12px"
      onclick="toggleFolder('${PUBLIC_FOLDER_KEY}')">
    <span class="folder-toggle">${collapsed?'▶':'▼'}</span>
    <span class="folder-check" onclick="event.stopPropagation();togglePublicSelect()" data-state="${checkState}">${checkState==='checked'?'☑':'☐'}</span>
    <span class="folder-name">公共库</span>
    <span class="folder-count">${totalCount}</span>
